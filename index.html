<template id="ecran-gare"><style>
/* =====================================================================
   HORLIGNE · ÉCRAN GARE (refonte 2D, 2026-09-27)
   Décor et Contrôleur : images générées (ChatGPT Images), découpées en couches.
   Tout ce qui vit (lumières, brume, étoiles, personnage) est animé ici, sans bibliothèque.
   ===================================================================== */
:root{
  --night:#081631; --navy:#12244a; --deep:#060e22;
  --amber:#e8a75c; --amber-hi:#ffd9a1; --amber-lo:#b5773a;
  --cream:#f6ead2; --ink:#f3eee6; --muted:#b4bccb; --faint:#8a94a8;
  --serif:'Sour Gummy',system-ui,sans-serif; --sans:'Sour Gummy',system-ui,sans-serif;
  --out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#03060e;color:var(--ink);font-family:var(--sans)}
body{display:flex;justify-content:center;overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}   /* téléphone : un appui long ne sélectionne pas le texte des boutons (vu sur iPhone, 19/10) */
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber-hi);outline-offset:3px;border-radius:10px}

#app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;overflow:clip;background:var(--night)}
@media(min-width:500px){#app{margin:14px 0;height:calc(100dvh - 28px);border-radius:36px;box-shadow:0 30px 120px rgba(0,0,0,.8)}}

/* ---------- la scène : une image et ses couches, toutes en % de la scène ---------- */
#stage{position:absolute;aspect-ratio:941/1672;transform-origin:84% 64%;will-change:transform;opacity:0;transition:opacity 1.4s var(--out)}
#stage.on{opacity:1}
.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
.px{transform:translate3d(calc(var(--mx,0) * var(--d,0) * 1px),calc(var(--my,0) * var(--d,0) * 1px),0);transition:transform .9s var(--out)}
.pt{position:absolute;translate:-50% -50%;pointer-events:none;border-radius:50%}

/* lueurs : toujours un dégradé radial en mode écran, jamais un disque plein */
.glow{aspect-ratio:1;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,214,150,.62) 0%,rgba(255,176,92,.26) 22%,rgba(255,150,70,.08) 46%,transparent 68%);
  animation:flicker var(--f,3.1s) ease-in-out infinite alternate}
@keyframes flicker{0%{opacity:.82;scale:1}37%{opacity:1;scale:1.035}58%{opacity:.88;scale:.99}100%{opacity:.97;scale:1.02}}
.moonglow{aspect-ratio:1;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,232,190,.32),rgba(255,210,150,.08) 38%,transparent 66%);animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{to{opacity:.7;scale:1.06}}
.door{aspect-ratio:1;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,206,130,.45),rgba(255,160,80,.14) 40%,transparent 66%);animation:flicker 4.6s ease-in-out infinite alternate}
.spill{aspect-ratio:3/1;mix-blend-mode:screen;border-radius:50%;background:radial-gradient(ellipse,rgba(255,190,110,.32),rgba(255,160,80,.08) 50%,transparent 70%);animation:flicker 5.2s ease-in-out infinite alternate}
.star{width:3px;height:3px;background:#fff6e0;box-shadow:0 0 6px 1px rgba(255,240,210,.7);animation:twinkle var(--t,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
.mist{position:absolute;left:-30%;width:160%;pointer-events:none;mix-blend-mode:screen;filter:blur(18px);
  background:radial-gradient(ellipse 30% 45% at 25% 50%,rgba(160,190,230,.22),transparent 70%),radial-gradient(ellipse 26% 40% at 70% 55%,rgba(150,180,225,.18),transparent 70%);
  animation:drift var(--dr,70s) linear infinite alternate}
@keyframes drift{from{translate:-6% 0}to{translate:6% 0}}
.mote{width:3px;height:3px;background:#ffd9a1;box-shadow:0 0 8px 2px rgba(255,200,120,.6);opacity:0;animation:mote var(--t,7s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes mote{0%{opacity:0;translate:-50% -50%}20%{opacity:.9}100%{opacity:0;translate:calc(-50% + var(--vx,10px)) calc(-50% - 70px)}}

/* ---------- les trois moments : ce qui s'allume, ce qui s'éteint ---------- */
body:not([data-moment="soir"]) .soir-only{display:none}
body:not([data-moment="matin"]) .matin-only{display:none}
body:not([data-moment="jour"]) .jour-only{display:none}
.sunglow{aspect-ratio:1;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,240,200,.55),rgba(255,200,140,.18) 30%,transparent 62%);animation:breathe 8s ease-in-out infinite alternate}
.glare{aspect-ratio:1;mix-blend-mode:soft-light;background:radial-gradient(circle,rgba(255,250,225,.55),rgba(255,240,200,.12) 35%,transparent 60%);animation:breathe 10s ease-in-out infinite alternate}
body[data-moment="matin"] .mist{filter:blur(16px);opacity:1.4;background:radial-gradient(ellipse 30% 45% at 25% 50%,rgba(255,236,236,.34),transparent 70%),radial-gradient(ellipse 26% 40% at 70% 55%,rgba(250,230,235,.28),transparent 70%)}
body[data-moment="jour"] .mist{opacity:.35}
body[data-moment="matin"] .door{opacity:.45}
body[data-moment="jour"] .door{display:none}
.bird{position:absolute;width:22px;height:10px;opacity:0;animation:fly var(--t,26s) linear infinite;animation-delay:var(--dl,0s)}
.bird svg{width:100%;height:100%;fill:none;stroke:#2a3550;stroke-width:1.6;stroke-linecap:round}
.bird svg path{animation:flap .5s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes fly{0%{opacity:0;translate:-10vw 0}6%{opacity:.75}90%{opacity:.75}100%{opacity:0;translate:120vw -40px}}
@keyframes flap{to{scale:1 .45}}
/* interface claire le matin et le jour : texte bleu nuit sur ciel clair */
body:not([data-moment="soir"]) .shade-top{background:linear-gradient(180deg,rgba(255,252,246,.42),rgba(255,252,246,.12) 55%,transparent)}
body:not([data-moment="soir"]) h1{color:#13244a;text-shadow:0 1px 12px rgba(255,255,255,.45)}
body:not([data-moment="soir"]) .where{color:#8a531d} body:not([data-moment="soir"]) .where i{background:#c8782c;box-shadow:none}
body:not([data-moment="soir"]) .where .long,body:not([data-moment="soir"]) #who{color:#4f5a75}   /* « Gare centrale » et le prénom : lisibles sur le ciel clair */
body:not([data-moment="soir"]) .board{background:linear-gradient(180deg,rgba(255,249,235,.96),rgba(244,231,205,.96));border-color:rgba(147,106,54,.46);box-shadow:0 9px 24px rgba(44,35,23,.16),inset 0 1px 0 rgba(255,255,255,.88),inset 0 -1px 0 rgba(126,91,45,.13)}
body:not([data-moment="soir"]) .board::after{border-color:rgba(151,111,62,.15)}
body:not([data-moment="soir"]) .bhead{color:#6a7590} body:not([data-moment="soir"]) .bhead b{color:#a4601f}
body:not([data-moment="soir"]) .row .t b{color:#13244a} body:not([data-moment="soir"]) .row .t span{color:#5f6b84}
body:not([data-moment="soir"]) .row+.row{border-top-color:rgba(19,36,74,.08)}
body:not([data-moment="soir"]) .row .min{color:#4a5670} body:not([data-moment="soir"]) .row.sel .min{color:#a4601f}
body:not([data-moment="soir"]) .row.sel{background:linear-gradient(90deg,rgba(232,167,92,.2),rgba(232,167,92,.04))}
body:not([data-moment="soir"]) .row .dot{box-shadow:none}
body:not([data-moment="soir"]) .add{color:#a4601f;border-color:rgba(164,96,31,.4)}
body:not([data-moment="soir"]) .demo{color:#8a93a8}
/* raccord de lumière du Contrôleur selon l'heure */
body[data-moment="matin"] #ctrl .cool{background:linear-gradient(180deg,rgba(150,160,210,.12),rgba(120,130,190,.2))}
body[data-moment="matin"] #ctrl .warm{background:linear-gradient(100deg,rgba(255,200,170,.3),transparent 55%)}
body[data-moment="jour"] #ctrl .cool{background:linear-gradient(180deg,transparent,rgba(90,110,160,.16))}
body[data-moment="jour"] #ctrl .warm{background:linear-gradient(115deg,rgba(255,244,214,.26),transparent 50%)}
body:not([data-moment="soir"]) #ctrl img{filter:none}
body:not([data-moment="soir"]) #ctrl .lg,#ctrl.sans-lanterne .lg,#ctrl.sans-lanterne .warm{display:none}
body[data-moment="jour"] #ctrl .shadow{background:radial-gradient(ellipse,rgba(20,30,60,.4),rgba(20,30,60,.12) 45%,transparent 70%);translate:-38% -50%}
#stage.swap{transition:opacity .35s ease;opacity:0!important}

/* ---------- le Contrôleur ---------- */
#ctrl{position:absolute;left:10.33%;top:47.39%;width:51.35%;height:35.09%;pointer-events:auto;cursor:pointer;touch-action:manipulation;transition:opacity .8s var(--out)}
#ctrl{transform-origin:50% 100%}
/* il est parti réparer (10 min après un frein) : plus de Contrôleur, ses outils sur le quai, une lampe de travail sous le wagon */
body.reparation #ctrl{opacity:0;pointer-events:none}
/* ses outils sur le quai : reculés en perspective et éclairés selon le moment par outils/gare-abime.py (jamais décalés ici).
   Une seule boîte à outils : quand il s'assoit dessus, elle quitte le tas (body.assis) */
.outil{opacity:0;transition:opacity .8s var(--out)} body.outils .outil.pret{opacity:1}
body.assis:not(.reparation) #boite{opacity:0}
.travail{display:none;left:54.2%;top:76.5%;width:22%} body.outils .travail{display:block}
body.reparation #stage{cursor:pointer}
#ctrl .body{position:absolute;inset:0;transform-origin:50% 92.94%;animation:breath 3.8s ease-in-out infinite alternate}
@keyframes breath{from{scale:1 1}to{scale:.996 1.013}}
#ctrl .pop{position:absolute;inset:0;transform-origin:50% 92.94%;animation:appui 8s ease-in-out infinite}
/* il vit : il change d'appui, lentement, comme quelqu'un qui attend debout ; quand il parle, il hoche un peu la tête */
@keyframes appui{0%,100%{rotate:-.55deg}50%{rotate:.5deg}}
#ctrl.parle .body{animation:breath 3.8s ease-in-out infinite alternate,hoche .32s ease-in-out infinite alternate}
@keyframes hoche{from{translate:0 0}to{translate:0 -1.4px}}
/* le décor vit (05/10) : un petit train sur le viaduc (la nuit seulement), des nuages ; plus de fumée ni de vapeur au quai (06/10 : sur téléphone, elles sortaient de derrière le Contrôleur) */
.bouffee{position:absolute;aspect-ratio:1;border-radius:50%;pointer-events:none;filter:blur(1.5px);will-change:transform,opacity}
.viaduc{position:absolute;left:28.6%;width:27.6%;top:39.25%;height:6%;overflow:hidden;rotate:-1.9deg;transform-origin:50% 100%;pointer-events:none}   /* son bord bas = le haut du tablier (mesuré : 45,5 % à gauche, 45,0 % à droite) ; les sapins cachent les deux bouts */
.mini-train{position:absolute;bottom:0;left:-40%;width:36%;aspect-ratio:150/16}
.mini-train svg{display:block;width:100%;height:100%}
.nuage{position:absolute;height:4%;border-radius:50%;filter:blur(14px);pointer-events:none;opacity:.55;animation:nuage var(--dn,200s) linear infinite alternate}
body[data-moment="soir"] .nuage{background:radial-gradient(ellipse,rgba(120,140,185,.5),rgba(80,100,150,.18) 55%,transparent 72%)}
body[data-moment="matin"] .nuage{background:radial-gradient(ellipse,rgba(255,214,214,.7),rgba(255,200,205,.25) 55%,transparent 72%)}
body[data-moment="jour"] .nuage{background:radial-gradient(ellipse,rgba(255,255,255,.85),rgba(255,255,255,.3) 55%,transparent 72%);opacity:.75}
@keyframes nuage{from{translate:-18vw 0}to{translate:18vw 0}}
#ctrl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:brightness(.9) saturate(.94) contrast(1.02);z-index:1}
#ctrl img.off{opacity:0}
#ctrl img.in{z-index:2}
/* la marionnette (outils/marionnette.py), un jeu de morceaux par moment : au repos, ses morceaux bougent vraiment ;
   pivots en % du cadre des poses, donnés par moment (PANTIN) ; le matin et la journée, ni lanterne ni main */
#ctrl .pantin{position:absolute;inset:0;z-index:1;display:none}
#ctrl.pantin-on .pantin{display:block}
#ctrl.pantin-on #p1,#ctrl.pantin-on #p2{visibility:hidden}
#ctrl .pantin>div{position:absolute;inset:0}
#ctrl .pantin img{z-index:auto}   /* l'ordre des morceaux = l'ordre du HTML (une pièce qui tourne crée sa propre pile : avec z-index:1, le corps passait devant) */
#ctrl .pt-lant{transform-origin:var(--pv-lant,24.85% 61.72%);animation:pt-lant 3.4s ease-in-out infinite alternate}   /* la lanterne se balance au bout de son anse */
#ctrl .pt-ech{transform-origin:var(--pv-ech,61.87% 51.31%);animation:pt-ech 2.9s ease-in-out -1.3s infinite alternate}   /* le bout d'écharpe flotte */
#ctrl .pt-tete{transform-origin:var(--pv-tete,48.05% 47.59%);animation:pt-tete 7.5s ease-in-out infinite}   /* la tête penche, regarde, revient */
@keyframes pt-lant{from{rotate:-2.4deg}to{rotate:2.4deg}}
@keyframes pt-ech{from{rotate:-1.5deg}to{rotate:1.9deg}}
@keyframes pt-tete{0%,100%{rotate:0deg}20%{rotate:-1.9deg}45%{rotate:-1.3deg}72%{rotate:1.5deg}}
#ctrl.sans-lant .pt-lant,#ctrl.sans-lant .pantin [data-m="main"]{display:none}
#ctrl .pt-x{opacity:0}
#ctrl.clos .pt-yeux,#ctrl[data-bouche="a"] .pt-a,#ctrl[data-bouche="o"] .pt-o{opacity:1}
/* raccord avec la nuit : un voile froid et un reflet chaud côté lanterne, découpés par la silhouette */
#ctrl .tint{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
#ctrl .cool{mix-blend-mode:multiply;background:linear-gradient(180deg,rgba(90,110,170,.22),rgba(40,60,120,.34) 70%,rgba(20,34,80,.5))}
#ctrl .warm{mix-blend-mode:screen;background:radial-gradient(circle at var(--lx,25%) var(--ly,79%),rgba(255,190,110,.42),rgba(255,170,90,.1) 30%,transparent 55%)}
#ctrl .lg{position:absolute;left:var(--lx,25%);top:var(--ly,79%);width:49.6%;aspect-ratio:1;translate:-50% -50%;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(circle,rgba(255,220,150,.7),rgba(255,176,90,.25) 18%,rgba(255,150,70,.07) 40%,transparent 64%);
  animation:flame 1.7s ease-in-out infinite alternate;transition:left .25s var(--out),top .25s var(--out)}
@keyframes flame{0%{opacity:.85;scale:.97}30%{opacity:1;scale:1.03}55%{opacity:.8}80%{opacity:.95;scale:1.01}100%{opacity:.88;scale:.99}}
#ctrl .shadow{position:absolute;left:50%;top:92.94%;width:49.6%;height:6%;translate:-50% -50%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),rgba(0,0,0,.2) 45%,transparent 70%)}
.zzz{position:absolute;font:900 16px var(--sans);color:var(--cream);text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none;animation:zzz 2.6s ease-out forwards}
@keyframes zzz{from{opacity:0;translate:0 0;scale:.7}20%{opacity:1}to{opacity:0;translate:26px -60px;scale:1.2}}

/* ---------- interface : elle se pose sur le ciel et sur le quai, jamais au milieu ---------- */
.shade-top{position:absolute;inset:0 0 auto;height:44%;pointer-events:none;background:linear-gradient(180deg,rgba(4,10,26,.62),rgba(4,10,26,.25) 60%,transparent)}
.shade-bot{position:absolute;inset:auto 0 0;height:26%;pointer-events:none;background:linear-gradient(0deg,rgba(4,9,22,.92),rgba(4,9,22,.55) 55%,transparent)}
.ui{transition:opacity .35s var(--out),translate .5s var(--out)}
body.boarding .ui{opacity:0;pointer-events:none}
body.boarding header.ui{translate:0 -16px} body.boarding .dock.ui,body.boarding nav.ui{translate:0 20px}

header{position:absolute;inset:0 0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 0}
.where{display:flex;align-items:center;gap:8px;font:800 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--amber-hi)}
.where i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.where span{color:var(--muted)}
h1{margin-top:9px;font:italic 500 27px/1.12 var(--serif);letter-spacing:-.01em;color:var(--cream);text-shadow:0 2px 18px rgba(0,0,0,.5)}

/* tableau des départs */
.board{position:relative;margin-top:12px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(10,22,48,.82),rgba(7,16,36,.88));
  border:1px solid rgba(213,174,116,.3);box-shadow:0 9px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,231,190,.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.board::after{content:'';position:absolute;inset:3px;border:1px solid rgba(213,174,116,.1);border-radius:14px;pointer-events:none}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px 6px 14px;font:900 10.5px var(--sans);letter-spacing:.2em;color:var(--faint)}
.bhead b{font:800 12px var(--sans);letter-spacing:.06em;color:var(--amber-hi);font-variant-numeric:tabular-nums}
.rows{max-height:144px;overflow:auto;scrollbar-width:none}
/* le pied du tableau (21/10, plan Duolingo phase 2 point 12) : la prochaine ville du grand voyage et le prochain tampon, en alternance */
.bpied{display:grid;width:100%;min-height:34px;padding:8px 14px 9px;border-top:1px solid rgba(255,217,161,.12);text-align:left;font:500 13px/1.3 var(--sans);color:#c9b89e;cursor:pointer}
.bpied span{grid-area:1/1;transition:opacity .45s,visibility 0s}   /* les deux textes dans la même case : la hauteur ne saute pas quand ils alternent */
.bpied span.cache{opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}   /* jamais deux textes lisibles l'un sur l'autre */
.bpied b{color:var(--amber-hi);font-weight:600}
body:not([data-moment="soir"]) .bpied{color:#5e6880;border-top-color:rgba(58,42,26,.12)}
body:not([data-moment="soir"]) .bpied b{color:#a4601f}
.row{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:7px 14px;text-align:left;min-height:48px;transition:background .25s}
.row+.row{border-top:1px solid rgba(255,255,255,.06)}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 10px var(--c)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:italic 500 16.5px/1.2 var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;margin-top:1px;font:700 11.5px var(--sans);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .min{font:800 13px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.row.sel{background:linear-gradient(90deg,rgba(232,167,92,.16),rgba(232,167,92,.03))}
.row.sel::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.row.sel .min{color:var(--amber-hi)}
.bhead .r{display:flex;align-items:center;gap:10px}
.add{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 7px;border-radius:999px;border:1.5px dashed rgba(255,217,161,.35);font:800 11px var(--sans);letter-spacing:.04em;color:var(--amber-hi)}
.add i{font-style:normal;font-size:15px;line-height:1}
.demo{color:var(--faint);letter-spacing:.12em}

/* bouton principal : épais, il s'enfonce quand on appuie */
.dock{position:absolute;inset:auto 0 var(--nav,76px);padding:0 18px 14px}   /* au-dessus de la barre du bas, qui est restée en dehors de la gare */
.go{position:relative;width:100%;height:62px;border-radius:18px;background:linear-gradient(180deg,#f0b66c,#e8a75c 52%,#dfa055);color:#1a1206;
  box-shadow:inset 0 1px 0 rgba(255,242,214,.62),inset 0 -1px 0 rgba(126,72,24,.14),0 4px 0 #aa743b,0 8px 17px rgba(57,36,12,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:translate .12s var(--out),box-shadow .12s var(--out),filter .2s}
.go b{font:900 17px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.go span{font:700 12px var(--sans);opacity:.72}

nav{position:absolute;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:space-around;padding:8px 8px max(10px,env(safe-area-inset-bottom));background:rgba(4,9,22,.9);border-top:1px solid rgba(213,190,150,.18)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center;font:800 10.5px var(--sans);letter-spacing:.04em;color:#aaa69e;position:relative}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--amber-hi)}
nav button.on::before{content:'';position:absolute;top:-8px;width:30px;height:3px;border-radius:0 0 3px 3px;background:var(--amber);box-shadow:0 0 12px var(--amber)}

/* bulle du Contrôleur */
#bubble{position:absolute;max-width:190px;padding:11px 14px;border-radius:16px;background:var(--cream);color:#1d2238;font:800 14px/1.35 var(--sans);
  box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;opacity:0;scale:.6;transform-origin:0% 100%;transition:opacity .18s,scale .35s var(--spring)}
#bubble::after{content:'';position:absolute;left:14px;bottom:-7px;width:16px;height:16px;background:var(--cream);border-radius:3px;rotate:45deg}
#bubble.on{opacity:1;scale:1}

/* feuille : créer une ligne (guichet de la gare) */
#creer{position:absolute;inset:auto 0 var(--nav,76px) 0;max-height:calc(100% - var(--nav,76px) - 12px);overflow:auto;padding:22px 20px max(22px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;z-index:8;
  background:linear-gradient(180deg,#22170e,#150d07);border-top:1px solid rgba(255,217,161,.2);box-shadow:0 -20px 60px rgba(0,0,0,.6);color:var(--ink);
  translate:0 calc(105% + var(--nav,76px));transition:translate .55s var(--out)}
#creer.on{translate:0 0}
#creer .k{font:900 11px var(--sans);letter-spacing:.2em;color:var(--amber)}
#creer h2{font:italic 500 25px/1.15 var(--serif);color:var(--cream);margin:6px 0 14px}
#creer label{display:block;font:800 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#b9a68c;margin-top:14px}
#creer input,#creer select{width:100%;margin-top:6px;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(255,217,161,.2);background:rgba(255,255,255,.05);
  color:var(--cream);font:700 16px var(--sans)}
#creer input:focus,#creer select:focus{outline:none;border-color:var(--amber)}
#creer .deux{display:flex;gap:10px}#creer .deux>div{flex:1}
#creer .note{font:700 11.5px/1.5 var(--sans);color:#9a8a76;margin-top:6px}
.where .lieu{color:inherit;white-space:nowrap}
.where #who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:34%}   /* le prénom passe avant « Gare centrale » */
.where.court .long{display:none}
.where .etats{margin-left:auto;display:flex;align-items:center;gap:11px;color:inherit}
.where .serie{display:flex;align-items:center;gap:5px;color:var(--amber-hi);letter-spacing:.06em}
.where .serie[hidden],.where .pastille[hidden]{display:none}
.where .pastille{display:flex;align-items:center;gap:4px;color:#ffb3a3;letter-spacing:.06em;cursor:pointer;
  padding:6px 0;margin:-6px 0;-webkit-tap-highlight-color:transparent}
.where .pastille b,.where .serie b{font-variant-numeric:tabular-nums}
.pastille svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body:not([data-moment="soir"]) .where .pastille{color:#b0402f}
body:not([data-moment="soir"]) .where .serie{color:#8a531d}
/* la lanterne de la série (21/10) : allumée quand le trajet du jour est fait, éteinte en attendant ;
   de 18 h elle se balance avec une braise, de 21 h elle s'agite (dernier train à minuit) */
.where .serie{cursor:pointer;padding:6px 0;margin:-6px 0;-webkit-tap-highlight-color:transparent}
.lanterne{overflow:visible;flex:none}
.lanterne .lt-anse{fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round}
.lanterne .lt-fer{fill:currentColor}
.lanterne .lt-garde{fill:none;stroke:currentColor;stroke-width:.75;opacity:.85}
.lanterne .lt-verre{fill:currentColor;fill-opacity:.14;stroke:currentColor;stroke-width:.9;transition:fill .5s,fill-opacity .5s}
.lanterne .lt-flamme{fill:#fff3c2;opacity:0;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .5s}
.lanterne.allumee .lt-verre{fill:#ffc75a;fill-opacity:.95}
.lanterne.allumee .lt-flamme{opacity:1;animation:lt-vacille 2s ease-in-out infinite}
.lanterne.allumee{filter:drop-shadow(0 0 3px rgba(255,180,80,.8))}
.where .serie .lanterne{width:17px;height:17px;transform-origin:50% 6%}
.where .serie[data-etat="attend"]{opacity:.82}
.where .serie[data-etat="inquiet"] .lanterne{animation:lt-balance 1.6s ease-in-out infinite}
.where .serie[data-etat="danger"] .lanterne{scale:1.18;animation:lt-balance-fort .8s ease-in-out infinite}
.where .serie[data-etat="inquiet"] .lt-flamme,.where .serie[data-etat="danger"] .lt-flamme{opacity:.85;fill:#ffb35c;animation:lt-braise .5s steps(2,jump-none) infinite}
.where .serie[data-etat="danger"]{color:#ffa06e}
body:not([data-moment="soir"]) .where .serie[data-etat="danger"]{color:#b0402f}
@keyframes lt-vacille{0%,100%{scale:1 1}30%{scale:.9 1.07}60%{scale:1.06 .9}}
@keyframes lt-balance{0%,100%{rotate:-7deg}50%{rotate:7deg}}
@keyframes lt-balance-fort{0%,100%{rotate:-14deg}50%{rotate:14deg}}
@keyframes lt-braise{0%{scale:.38}100%{scale:.55}}
@keyframes lt-sallume{0%{filter:drop-shadow(0 0 0 rgba(255,180,80,0))}40%{filter:drop-shadow(0 0 12px rgba(255,190,90,1))}100%{filter:drop-shadow(0 0 3px rgba(255,180,80,.8))}}

#accueil .btns{display:flex;gap:10px;margin:20px -20px 0;padding:12px 20px 4px;position:sticky;bottom:calc(-1 * max(22px,env(safe-area-inset-bottom)));

/* la question du Contrôleur avant la fenêtre des notifications de l'iPhone */
.bf{position:relative;width:min(100%,380px);max-height:100%;overflow:auto;padding:20px 20px 16px;border-radius:14px;color:#3a2a1a;
  background:radial-gradient(120% 90% at 30% 0%,#fbf3e2,#efe1c6 70%,#e6d3b2);box-shadow:inset 0 0 0 1.5px rgba(58,42,26,.12),0 20px 50px rgba(0,0,0,.6)}   /* papier uni du billet (la page du carnet montrait ses trous de reliure) */

/* 22/10 : le Coop sous chaîne en Voyageur (une chaîne de quai en travers de l'icône, un cadenas qui pend au milieu) */
nav .ico-coop{position:relative;display:block;width:24px;height:24px;flex:none}
nav .ico-coop>svg:first-child{display:block;width:24px;height:24px;transition:opacity .2s}
nav svg.chaine{position:absolute;left:50%;top:50%;width:40px;height:23px;translate:-50% -38%;display:none;pointer-events:none;overflow:visible;fill:none;stroke:none}
nav button.verrou svg.chaine{display:block}
nav button.verrou .ico-coop>svg:first-child{opacity:.4}
nav button.verrou{color:#8d8a84}
nav button.verrou.secoue svg.chaine{animation:chaine-secoue .55s cubic-bezier(.3,1.5,.5,1)}
nav button.verrou.secoue .cadenas{animation:cadenas-balance .9s ease-out}
nav svg.chaine .cadenas{transform-box:fill-box;transform-origin:50% 0}
@keyframes chaine-secoue{0%{transform:none}20%{transform:translateY(1.5px) rotate(-3deg)}45%{transform:translateY(-.5px) rotate(2.5deg)}70%{transform:rotate(-1deg)}100%{transform:none}}
@keyframes cadenas-balance{0%{rotate:0deg}15%{rotate:22deg}35%{rotate:-16deg}55%{rotate:10deg}75%{rotate:-5deg}100%{rotate:0deg}}
@media (prefers-reduced-motion:reduce){nav button.verrou.secoue svg.chaine,nav button.verrou.secoue .cadenas{animation:none}}
.ap-buste{float:right;width:64px;height:auto;margin:-4px -2px 4px 8px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}

/* les paliers de série (21/10, plan Duolingo phase 2 point 9) : 7, 30, 100 et 365 jours, une fête et une carte à partager */

  background:repeating-conic-gradient(from 0deg,rgba(242,200,107,.22) 0 9deg,rgba(242,200,107,0) 9deg 22.5deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);animation:pv-tourne 26s linear infinite}

/* le journal d'usage (21/10) : un résumé lisible, à envoyer si on veut */
.jv .ap-txt{font-size:15px;line-height:1.45;margin-bottom:10px}
.jv .jv-resume{margin:0 0 12px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.05);font:400 13.5px/1.35 var(--sans);color:#e0ceb4;list-style:none}
.jv .jv-resume li+li{border-top:1px solid rgba(255,217,161,.1);padding-top:3px;margin-top:3px}
.jv .jv-resume b{color:var(--cream);font-weight:600}
.row .t span em{font-style:normal;color:var(--amber)}
/* passage à bord */
#veil{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 60% 55%,#ffe2ad,#f0a95a 55%,#6b3a1c);transition:opacity .9s ease-in}
/* ---------- Carnet et Réglages : même matière que le guichet ---------- */
.feuilleG{position:absolute;inset:auto 0 var(--nav,76px) 0;max-height:calc(100% - var(--nav,76px) - 12px);overflow:auto;padding:22px 20px max(22px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;z-index:8;
  background:linear-gradient(180deg,#22170e,#150d07);border-top:1px solid rgba(255,217,161,.2);box-shadow:0 -20px 60px rgba(0,0,0,.6);color:var(--ink);
  translate:0 calc(105% + var(--nav,76px));transition:translate .55s var(--out)}
.feuilleG.on{translate:0 0}
body.page-ouverte .dock .go,body.page-ouverte #regulier{visibility:hidden}
/* ---------- changer d'onglet : glisser d'un lieu à l'autre (10/10, choix de l'auteur) ----------
   Gare, Carnet, Coop, Amis, Réglages sont cinq lieux côte à côte, dans l'ordre de la barre du bas. Plus aucune page ne monte sur la gare.
   Comme le « push » d'iOS (Telegram, Instagram) : la page de droite glisse par-dessus, celle de gauche recule d'un quart et s'assombrit.
   Seules les deux pages du voyage bougent ; la barre du bas ne bouge pas. Piliers et recul de caméra retirés le soir même (l'auteur : pas fluide, une barre). */
#vueGare{position:absolute;inset:0}
body.ailleurs #vueGare{visibility:hidden}
#amis,#coop,#reglages{translate:none;transition:none;visibility:hidden}
#amis.on,#coop.on,#reglages.on{visibility:visible}
.en-route{visibility:visible!important;will-change:transform,opacity}
#app.voyage{background:#020306}   /* ce qu'on voit à travers la page qui s'assombrit */
/* l'onglet Amis est une vraie page : toute la hauteur au-dessus de la barre du bas, avec sa croix pour revenir à la gare */
#amis{top:0;max-height:none;border-radius:0;padding:0;overflow:hidden;border-top:0;background:#140d07}
/* ses deux onglets : tes amis, et la page du train Coop */
.feuilleG .croix{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 26px/1 var(--sans);color:var(--amber-hi);background:rgba(255,255,255,.06)}
.feuilleG .k{font:900 11px var(--sans);letter-spacing:.2em;color:var(--amber)}
.feuilleG h2{font:italic 500 25px/1.15 var(--serif);color:var(--cream);margin:6px 0 12px;text-wrap:balance}
.feuilleG h3,.feuilleG label{display:block;font:800 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#b9a68c;margin:18px 0 8px}
.feuilleG input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(255,217,161,.2);background:rgba(255,255,255,.05);color:var(--cream);font:700 15px var(--sans)}
.feuilleG input:focus{outline:none;border-color:var(--amber)}
.feuilleG .fermer{display:block;width:100%;min-height:52px;margin-top:20px;border-radius:14px;background:var(--amber);color:#1a1206;font:900 14px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.fiche-act{display:flex;gap:8px;margin-top:16px}
.fiche-act button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid rgba(255,217,161,.25);font:800 12.5px var(--sans);color:var(--amber-hi)}
.fiche-act button.danger{border-color:rgba(255,120,95,.4);color:#ffb3a3}
.fiche-act button.sur{background:#c9443a;border-color:#c9443a;color:#fff}
.fiche-act button.ok{background:var(--amber);border-color:var(--amber);color:#1a1206}
#ficheTxt{font:700 13px/1.6 var(--sans);color:#c9b9a3}
/* les réglages d'une ligne (11/10, l'auteur : l'abonné change tout, le Voyageur seulement le nom) */
.f-titre{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,217,161,.12);font:900 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
#ficheReg label{margin:14px 0 6px}
.feuilleG select{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(255,217,161,.2);background:rgba(255,255,255,.05);color:var(--cream);font:700 15px var(--sans)}
.feuilleG select:focus{outline:none;border-color:var(--amber)}
.feuilleG select:disabled,.feuilleG .interrupteur:disabled{opacity:.5}
#ficheReg #fHeure{margin-top:8px}
.f-pro{position:relative;margin-top:4px}
.f-pro.verrou{cursor:pointer;border-radius:14px}
.f-pro.verrou>*:not(.f-cadenas){opacity:.42;pointer-events:none}
.f-cadenas{position:absolute;z-index:1;right:0;top:10px;padding:5px 10px;border-radius:999px;background:linear-gradient(135deg,#ffe7a8,#e2a94c);color:#2a1a06;font:900 10.5px var(--sans);letter-spacing:.06em;box-shadow:0 3px 0 #8a5a1c}
.f-note{margin-top:12px;font:700 12px/1.5 var(--sans);color:#9a8a76}
.row .gerer{font:900 15px/1 var(--sans);color:var(--amber);letter-spacing:.1em;padding:0 2px}
/* ---------- le carnet de voyage : un vrai carnet de cuir, une page à la fois, reliure à gauche ----------
   Les images de ChatGPT (assets/carnet/web/…) remplacent les matières dessinées ici dès qu'elles existent. */
#carnet,#cpVue,#remise,.modale,#amis,#coop,#quaiCoop{--encre:#3a2a1a;--rouge:#b3302a;--sepia:#4a3220;--papier:#f3e8d3;--imp:'IM Fell English',Georgia,serif;--main:'Caveat',cursive}
#carnet{position:absolute;inset:0;z-index:10;visibility:hidden;pointer-events:none}   /* le carnet d'un ami couvre aussi la barre du bas */
#carnet.on{visibility:visible;pointer-events:auto}
#carnet .voile{position:absolute;inset:0;background:rgba(3,6,14,.93);opacity:0;transition:opacity .45s}
#carnet.on .voile{opacity:1}
/* le carnet garde les proportions de la vraie page (2:3) : jamais étiré, il rétrécit plutôt si l'écran est court */
#carnet .monte{position:absolute;left:50%;top:50%;width:min(95%,430px,calc((100dvh - 128px) * .63));
  translate:-50% calc(-50% + 110dvh);transition:translate .55s var(--out);display:flex;flex-direction:column}
#carnet.on .monte{translate:-50% -50%}
/* ton carnet est un onglet : une vraie page, posée sur le bois du guichet ; le carnet d'un ami reste une fenêtre au-dessus du hall */
#carnet.onglet-page{inset:0 0 var(--nav,76px);z-index:8;background:#150d07;container-type:size;overflow:hidden}   /* rien ne dépasse de la page, même en glissant */
/* le bureau du chef de gare vu du dessus (CARNET-FOND, Codex, 10/10) : le carnet est posé sur son sous-main vert ; la lumière suit le moment */
#carnet .c-fond{position:absolute;inset:0;background:url(assets/carnet/web/fond-bureau-soir.webp) 50% 0/cover no-repeat}   /* calé en haut : le bord du sous-main tombe à un endroit connu */
body[data-moment="matin"] #carnet .c-fond{background-image:url(assets/carnet/web/fond-bureau-matin.webp)}
body[data-moment="jour"] #carnet .c-fond{background-image:url(assets/carnet/web/fond-bureau-jour.webp)}
#carnet:not(.onglet-page) .c-fond{opacity:0}   /* le carnet d'un ami garde son voile sombre au-dessus du hall */
#carnet.onglet-page .voile{display:none}
/* le carnet posé en haut du sous-main (bord à 13,9 % de la hauteur de l'image, 1672/941 = 1,7768) : les marque-pages débordent sur le bois
   (l'auteur, 11/10 : « les marque-pages doivent dépasser un peu du support vert pour donner de la profondeur »). Réduit d'un bloc : son contenu est à taille fixe. */
#carnet.onglet-page .monte{top:calc(.139 * max(100cqw * 1.7768, 100cqh) - 16px);translate:-50% 0;transform-origin:50% 0;scale:.86;transition:none;
  width:min(95cqw,430px,calc((90cqh - 100px) * .63))}
/* ton carnet : « Refermer » descend sur le bois, au milieu de la bande du bas, entre les tampons et la tasse (le carnet d'un ami garde le sien sous le carnet) */
.refermer-bas{display:none}
#carnet.onglet-page .monte .refermer{display:none}
#carnet.onglet-page.ferme .feuillet{cursor:pointer}
#carnet.onglet-page .refermer-bas{display:block;position:absolute;left:50%;top:calc(.865 * max(100cqw * 1.7768, 100cqh));translate:-50% -50%;text-shadow:0 1px 8px rgba(0,0,0,.85)}
.livre{position:relative;width:100%;padding-top:30px;perspective:1600px}
.feuillet{position:relative;width:100%;aspect-ratio:.63}   /* la page, un tout petit peu plus haute que le dessin (2:3) */
.pages,.couv{position:absolute;inset:0}
.page{position:absolute;inset:0;overflow:hidden;overscroll-behavior:contain;scrollbar-width:none;padding:40px 18px 18px 32px;border-radius:3px 9px 9px 3px;
  color:var(--encre);transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:url(assets/carnet/web/page.webp) center/100% 100%,
    radial-gradient(ellipse 75% 70% at 55% 45%,rgba(255,252,240,.35),transparent 70%),
    radial-gradient(ellipse 120% 100% at 55% 50%,transparent 60%,rgba(120,80,30,.22)),
    linear-gradient(90deg,rgba(60,35,10,.32),rgba(60,35,10,.06) 5%,transparent 9%),var(--papier);
  box-shadow:0 14px 30px rgba(0,0,0,.38),inset -1px 0 0 rgba(120,90,50,.3)}
.page::-webkit-scrollbar{display:none}
body[data-moment="soir"] .page{filter:sepia(.12) brightness(.94)}
body[data-moment="soir"] .page::after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 20% 0%,rgba(255,190,110,.14),transparent 60%)}
.couv{transform-origin:left center;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.45,.05,.25,1);z-index:3}
.couv.ouverte{transform:rotateY(-176deg)}
/* le pli d'une page qui tourne */
.pli-ombre{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.pli-ombre i{position:absolute;height:90px;background:linear-gradient(to bottom,rgba(45,28,10,.3),rgba(45,28,10,.08) 45%,rgba(45,28,10,0))}
.pli-rabat{position:absolute;inset:0;z-index:4;pointer-events:none;filter:drop-shadow(-5px 4px 7px rgba(30,18,8,.42))}
.pli-verso{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;overflow:hidden;
  background:url(assets/carnet/web/page.webp) center/100% 100%,var(--papier);filter:brightness(1.03) saturate(.92)}
.pli-verso i{position:absolute;height:130px;background:linear-gradient(to top,rgba(45,28,10,.34),rgba(45,28,10,.06) 35%,rgba(255,252,242,.18) 70%,rgba(255,252,242,0))}
.page{touch-action:pan-y}
#carnet .page{overflow:hidden}   /* 22/10 : le carnet ne défile plus ; ajusterPage() fait tenir le contenu */
.page-c{transform-origin:0 0}
/* la couverture : la lumière glisse sur le cuir quand elle s'ouvre, et elle fait de l'ombre sur la première page */
.couv-face::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.45));opacity:0;transition:opacity .75s}
.couv.ouverte .couv-face::after{opacity:1}
.feuillet::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:3px 9px 9px 3px;
  background:linear-gradient(90deg,rgba(20,12,5,.55),rgba(20,12,5,.15) 60%,rgba(20,12,5,0));opacity:0}
.feuillet.ouvre::after{animation:ombreCouv .9s ease-out}
@keyframes ombreCouv{0%{opacity:1}100%{opacity:0}}
.couv.rangee{visibility:hidden}   /* une fois ouverte, la couverture sort du champ : on ne garde que la page */
/* ton carnet ouvert sur le bureau (l'auteur, 11/10) : la couverture reste ouverte à plat à gauche, la page de garde se voit ;
   ouverte à 180° (à 176° elle restait un peu levée et laissait une incise au pli) */
#carnet.onglet-page .couv.ouverte{transform:rotateY(-180deg)}
#carnet.onglet-page .couv.rangee{visibility:inherit}   /* ouverte, elle reste ; mais cachée avec la page (11/10 : on l'apercevait sur la Gare) */
#carnet.onglet-page .couv>.couv-dos{box-shadow:0 18px 40px rgba(0,0,0,.45)}
/* dès qu'une page est tournée, son dos (une page blanche) est posé à gauche, sur la page de garde (l'auteur, 11/10) ; miroir de la page : reliure à droite */
.verso-gauche{position:absolute;top:0;bottom:0;right:100%;width:100%;z-index:3;pointer-events:none;opacity:0;transform:scaleX(-1);border-radius:3px 9px 9px 3px;
  background:linear-gradient(90deg,rgba(60,35,10,.34),rgba(60,35,10,.08) 5%,transparent 10%),url(assets/carnet/web/page.webp) center/100% 100%,var(--papier);box-shadow:0 18px 40px rgba(0,0,0,.45)}
#carnet.onglet-page .verso-gauche.on{opacity:1}   /* sans fondu : elle change pendant que la feuille tournée la recouvre */
#carnet.onglet-page .couv:not(.rangee)~.verso-gauche{opacity:0}   /* couverture fermée ou en mouvement : rien ne flotte à côté du carnet */
.verso-gauche.fondu{transition:opacity .3s}   /* rouvert sur une autre page que le Profil : sa page blanche se pose en douceur après la couverture */
body[data-moment="soir"] .verso-gauche{filter:sepia(.12) brightness(.94)}
.couv>div{position:absolute;inset:0;border-radius:4px 12px 12px 4px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.couv>.couv-dos{border-radius:12px 3px 3px 12px}   /* ouverte, son bord droit est au pli : coins droits contre la page, arrondis à l'extérieur */
.couv-face{background:url(assets/carnet/web/couverture-sans-elastique.webp) center/100% 100%,
  radial-gradient(ellipse 80% 70% at 45% 40%,#8a5a34,#6b4226 55%,#4a2b17);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 0 7px rgba(0,0,0,.06),inset 0 0 0 8px rgba(255,220,170,.08)}
.couv-dos{transform:rotateY(180deg);background:linear-gradient(270deg,rgba(40,24,8,.45),rgba(40,24,8,.12) 3.5%,rgba(40,24,8,0) 8%),   /* l'ombre du pli, côté reliure */
  url(assets/carnet/web/page-de-garde.webp) center/100% 100%,
  repeating-radial-gradient(circle at 30% 40%,#c98a3c 0 6px,#2b3a5c 6px 11px,#efe0c0 11px 14px,#7a1f2b 14px 17px);filter:saturate(.8)}
.elastique{position:absolute;top:0;bottom:0;left:78.1%;width:6%;z-index:4;
  background:url(assets/carnet/web/elastique.webp) center/100% 100% no-repeat;filter:drop-shadow(2px 0 3px rgba(0,0,0,.35));transition:translate .35s var(--out),opacity .35s}
.elastique.part{translate:46px 0;opacity:0}
.ruban{position:absolute;left:18px;bottom:-30px;width:13px;height:46px;z-index:2;background:url(assets/carnet/web/ruban.webp) center bottom/100% auto no-repeat}
/* les onglets, collés à la main comme de vrais marque-pages : pas alignés, un peu de travers ;
   ceux des autres rubriques dépassent de derrière la page, celui de la page ouverte est collé dessus */
.onglets{position:absolute;left:0;right:0;top:0;height:30px}
.onglets button{position:absolute;top:var(--h);left:var(--x);width:19.5%;height:50px;padding-bottom:25px;line-height:1;font:italic 14px var(--imp);color:#4a3322;letter-spacing:.03em;
  border:solid transparent;border-width:10px 12px;border-image:var(--t) 70 80 fill stretch;rotate:var(--a);z-index:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)) brightness(.9);transition:translate .25s var(--out)}
.onglets button:nth-child(1){--x:2%;--h:4px;--a:-2.4deg}.onglets button:nth-child(2){--x:21%;--h:1px;--a:1.6deg}
.onglets button:nth-child(3){--x:40%;--h:4px;--a:-1deg}.onglets button:nth-child(4){--x:59%;--h:2px;--a:2.4deg}.onglets button:nth-child(5){--x:78%;--h:3px;--a:-1.4deg}   /* 25/10 : cinq marque-pages (Progrès) */
.onglets button.on{z-index:5;translate:0 -3px;color:#352316;filter:drop-shadow(0 2px 3px rgba(60,40,20,.32)) brightness(1.04)}
#carnet .page button:focus-visible,#carnet .onglets button:focus-visible{outline:2px solid #4a3322;outline-offset:-2px}
.feuillet{z-index:2}
.onglets button:nth-child(1){--t:url(assets/carnet/web/onglet-1.webp)}.onglets button:nth-child(2){--t:url(assets/carnet/web/onglet-2.webp)}
.onglets button:nth-child(3){--t:url(assets/carnet/web/onglet-3.webp)}.onglets button:nth-child(4){--t:url(assets/carnet/web/onglet-4.webp)}
.onglets button:nth-child(5){--t:url(assets/carnet/web/onglet-1.webp)}

.refermer{align-self:center;margin-top:12px;min-height:44px;padding:0 18px;font:italic 15px var(--imp);color:#e9dcc6;letter-spacing:.03em}
/* l'encre */
.imp{font-family:var(--imp)} .main{font-family:var(--main)}
.page .rubrique,.page h3,.page .note,.page .vide,.bil-total,.bil-barres,.bil-tenus,.bil-cases,.tp-fam,.tp-nom,.voy,.voy-km,.page .coins{mix-blend-mode:multiply}
.page h3,.page .note,.page .vide,.bil-total,.bil-tenus,.tp-nom,.voy-km{text-shadow:0 0 .6px currentColor}
.mot{display:inline-block;transform:translateY(var(--y)) rotate(var(--r))}
.page .rubrique{font:13px var(--imp);letter-spacing:.24em;text-transform:uppercase;color:#6b5236}
.page h3{font:italic 400 26px/1.1 var(--imp);margin:4px 0 2px;color:var(--encre)}
.page .note{font:600 21px/1.15 var(--main);color:#2f3f6b}
.page .vide{font:500 21px/1.25 var(--main);color:#5d4a36;margin-top:26px}
.page .coins{position:absolute;left:26px;right:12px;bottom:2px;display:flex;justify-content:space-between;margin:0}   /* au pied de la page, hors du texte */
.page .coins button{font:500 17px var(--main);color:#5d4a36;min-height:40px;padding:0 4px}
.page .coins button.cache{visibility:hidden}
/* Bilan */
/* tout le bilan tient sous la carte d'abonné : titre sur une ligne, le total à côté de la comparaison, des barres plus basses (11/10) */
.bil-tete{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.bil-tete h3{margin:0}
.bil-ligne{display:flex;align-items:center;gap:12px;margin-top:3px}
.bil-ligne .note{flex:1;font-size:17px;line-height:1.1}
.bil-total{flex:none;font:400 38px/1 var(--imp);font-variant-numeric:oldstyle-nums}
.bil-barres{display:block;width:100%;margin:6px 0 0}
.bil-tenus{font:600 19px/1.2 var(--main);text-align:center;margin:3px 0 6px}
.bil-tenus b{font-weight:700}
.bil-cases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bil-cases div{display:flex;align-items:center;justify-content:center;gap:7px;border:1.3px solid rgba(58,42,26,.55);border-radius:6px 9px 7px 10px;padding:4px 6px}
.bil-cases svg{width:44px;height:44px;display:block;margin:0 auto}
.bil-cases .bil-dessin{width:30px;height:30px;display:block;margin:0;object-fit:contain}
.bil-signature{position:absolute;right:16px;bottom:38px;width:40px;height:26px;pointer-events:none}
.bil-signature img{position:absolute;right:4px;bottom:0;width:34px;height:26px;object-fit:contain;opacity:.16}
.trace-plume{position:absolute;width:30px;height:36px;pointer-events:none;background:url(assets/carnet/web/bilan/plume.webp) center/contain no-repeat;z-index:1}
.bil-cases b{font:400 22px/1 var(--imp)}
.pf-progres{display:block;margin:12px auto 0;min-height:44px;padding:0 10px;font:600 17px var(--main);color:#2f3f6b;text-decoration:underline;text-underline-offset:3px}
/* 25/10 : la page Progrès (l'auteur : « voir notre évolution depuis le début, voir ce que Horligne nous apporte ») */
.pg-chiffres{display:flex;gap:10px;margin:4px 0 0}
.pg-chiffres>div{flex:1;min-width:0;font:13px/1.2 var(--imp);color:#6b5236;mix-blend-mode:multiply}
.pg-chiffres b{display:block;font:400 30px/1 var(--imp);color:var(--encre);font-variant-numeric:oldstyle-nums}
.pg-chiffres .rouge b{color:#a3262b}
.pg-chiffres em{display:block;font:italic 12.5px/1.2 var(--imp);margin-top:1px}
.pg-chiffres .mieux{color:#2f6b3a}.pg-chiffres .pire{color:#a3262b}
.pg-legende{display:flex;gap:14px;margin:6px 0 -2px;font:12.5px var(--imp);color:#6b5236;mix-blend-mode:multiply}
.pg-legende span{display:flex;align-items:center;gap:5px}
.pg-legende i{width:11px;height:11px;border:1.4px solid #3a2a1a;background:repeating-linear-gradient(-55deg,#3a2a1a 0 1px,transparent 1px 4px)}
.pg-legende .r i{border-color:#a3262b;background:repeating-linear-gradient(-55deg,#a3262b 0 1px,transparent 1px 4px)}
.pg-graphe{display:block;width:100%;height:auto;margin-top:2px;mix-blend-mode:multiply;-webkit-tap-highlight-color:transparent}
.pg-graphe [data-pg-j],.pg-graphe [data-pg-sem]{cursor:pointer}
.page .pg-detail{min-height:2.35em;margin:0 0 2px;font-size:16px;line-height:1.15}
.pg-detail .rg{color:#a3262b}.pg-detail .plus{color:#2f6b3a}.pg-detail .moins{color:#a3262b}
.pg-titre2{margin:10px 0 0;font:italic 19px/1.1 var(--imp);color:var(--encre);mix-blend-mode:multiply}
.page .pg-resume{margin:0 0 2px;font-size:16px;line-height:1.15}
.pg-mesure{margin:8px 0 2px;padding:8px 10px;border:1.4px dashed rgba(163,38,43,.5);border-radius:6px 9px 7px 10px;font:13px/1.3 var(--imp);color:#6b3a2a;mix-blend-mode:multiply}
.pg-mesure button{display:block;margin-top:6px;min-height:40px;padding:0 14px;border-radius:8px;background:#a3262b;color:#fff6e6;font:600 14px var(--sans);mix-blend-mode:normal}
.bil-cases span{font:500 15px/1 var(--main);color:#5d4a36;text-align:left}
/* Billets : un billet par ligne et par jour, les poinçons se cumulent dans la semaine */
/* la pile de la semaine (11/10) : un billet par jour, chacun recouvre le bas du précédent */
.bt-pile{margin-top:8px}
.bt{position:relative;width:calc(100% + 8px);margin-left:-4px;aspect-ratio:2.53;background:url(assets/carnet/web/billet-1.webp) center/100% 100% no-repeat;
  filter:drop-shadow(0 -1px 2px rgba(60,40,20,.28)) drop-shadow(0 2px 2px rgba(60,40,20,.3))}
.bt.v2{background-image:url(assets/carnet/web/billet-2.webp)}.bt.v3{background-image:url(assets/carnet/web/billet-3.webp)}
.bt-souche{position:absolute;left:2.5%;width:10.5%;top:14%;display:flex;flex-direction:column;align-items:center;color:#4a3220;text-align:center}
.bt-souche b{font:400 10.5px/1 var(--imp);letter-spacing:.12em;text-transform:uppercase}
.bt-souche span{font:400 19px/1 var(--imp);margin-top:1px}.bt-souche sup{font-size:.5em}
.bt-lignes{position:absolute;left:23%;right:9%;top:8%;display:flex;flex-direction:column;gap:0}   /* à l'écart des ornements des coins */
.bt-l{display:flex;align-items:center;gap:6px;height:15px}
.bt-nom{flex:1;min-width:0;font:400 14.5px/1 var(--imp);color:var(--encre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 .6px currentColor}
.bt-plus{font:500 14px/1 var(--main);color:#5d4a36}
.bt-trous{display:flex;align-items:center;gap:2px;flex:none}
.bt-trous .trou{position:relative;translate:none;width:11px;height:11px}
.bt-trous .trou.dechire{width:15px;height:15px}
.bt-trous b{font:500 13px var(--main);color:#5d4a36}
.bt-patte{flex:none;width:14px;height:14px;background:url(assets/carnet/web/tampons/patte-charbon.webp) center/contain no-repeat;opacity:.85;mix-blend-mode:multiply}
.bt .tampon-terminus{top:8%;right:6%;font-size:12px;padding:1px 5px}
.trou{position:absolute;width:17px;height:17px;translate:-50% -50%;background:radial-gradient(circle at 60% 63%,#e6d8bb 0 26%,#a3875e 58%,#5a432c);
  -webkit-mask:url(assets/carnet/web/trou.webp) center/contain no-repeat;mask:url(assets/carnet/web/trou.webp) center/contain no-repeat}
.trou.dechire{width:27px;height:27px;background:radial-gradient(circle at 54% 58%,#e6d8bb 0 24%,#9c7f57 56%,#4f3a25);
  -webkit-mask-image:url(assets/carnet/web/trou-dechire.webp);mask-image:url(assets/carnet/web/trou-dechire.webp)}
/* Tampons : encre rouge ; ceux qui restent à gagner, une silhouette au crayon */
.tp-fam{font:16px var(--imp);font-variant:small-caps;letter-spacing:.12em;color:#6b5236;margin:18px 0 6px;padding-bottom:2px;border-bottom:1px solid rgba(90,60,30,.25)}
.tp-grille{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px}
.tp{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px}
.tp-forme{position:relative;width:78px;height:78px;display:grid;place-items:center;font:400 22px var(--imp);color:rgba(90,70,45,.5);
  background:url(assets/carnet/web/tampons/a-gagner.webp) center/86% no-repeat}   /* pas encore gagné : sa place au crayon */
.tp.gagne .tp-forme{background:var(--img) center/contain no-repeat;color:var(--rouge);rotate:var(--rot,-6deg);mix-blend-mode:multiply}
/* le chiffre du cap, tamponné dans la case vide du tampon (à la même encre) */
.tp-forme b{position:absolute;left:var(--nx,50%);top:var(--ny,76%);translate:-50% -50%;font:400 13px/1 var(--imp);color:var(--rouge);opacity:.9;letter-spacing:.02em}
.tp[data-fam="heures"] .tp-forme{--nx:66%;--ny:62%}.tp[data-fam="traversee"] .tp-forme{--nx:80%;--ny:84%}.tp[data-fam="serie"] .tp-forme{--ny:79%}
.tp[data-fam="lignes"] .tp-forme{--ny:80%}.tp[data-fam="billets"] .tp-forme{--ny:83%}.tp[data-fam="moments"] .tp-forme{--ny:78%}
.tp[data-fam="sansfrein"] .tp-forme{--ny:79%}.tp[data-fam="remontee"] .tp-forme{--ny:80%}
.tp-nom{font:500 15px/1.05 var(--main);color:#7a6650;text-align:center}
/* sur la page : des tampons plus petits, en blocs par famille ; le nom se lit en touchant le tampon (11/10) */
.page .tp-note{font-size:16px;min-height:38px;margin-top:2px}
.tp-flux{display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px;margin-top:4px}
.tp-bloc{flex:none}
.page .tp-fam{font-size:13px;margin:6px 0 4px;letter-spacing:.1em}
.page .tp-grille{grid-template-columns:repeat(var(--n,3),52px);gap:5px}
.page .tp{min-height:0;gap:0}
.page .tp-forme{width:52px;height:52px;font-size:16px}
.page .tp-forme b{font-size:9px}
.page .tp-nom{display:none}
.tp.gagne .tp-nom{color:var(--encre)}
/* Cartes : le train entre deux villes, la boucle, la collection */
.voy{display:block;width:100%;margin-top:8px}
.voy-km{font:italic 25px var(--imp);text-align:center;margin-top:2px}
.voy-sous{text-align:center}
.voy-carte{margin:14px 0 10px}
.voy-carte summary{min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:italic 18px var(--imp);color:var(--encre)}
.voy-carte summary::before{content:'＋';font-style:normal}.voy-carte[open] summary::before{content:'−'}
.voy-carte svg{display:block;width:100%;height:auto;border:1px solid rgba(74,50,32,.2);border-radius:4px}
.voy-carte p{font:14px var(--imp);text-align:center;margin:8px 0;color:#5d4a36}
.boucle{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.boucle i{width:10px;height:10px;border-radius:50%;border:1.3px solid #8b7556}
.boucle i.passee{background:#4a3220;border-color:#4a3220}
.boucle i.ici{outline:2px solid #3a2a1a;outline-offset:2px}
.cp-grille{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:10px}
/* la page Cartes tient sur une page (11/10) : le voyage, tes deux dernières cartes, puis la grande carte */
.page .voy-km{font-size:22px}.page .voy-sous{font-size:16px}
.page .cp-vide{font-size:18px;margin-top:12px}
.cp-dernieres{display:flex;justify-content:center;gap:26px;margin-top:8px}
.cp-dernieres .cp{width:108px;flex:none}
.cp-dernieres .cp-titre{font-size:14px;padding:12px 4px 6px}.cp-dernieres .cp-titre small{font-size:8px;letter-spacing:.14em}
.plan-ouvrir{display:block;margin:8px auto 0;min-height:44px;padding:0 10px;font:italic 18px var(--imp);color:var(--encre);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;mix-blend-mode:multiply}
/* la grande carte dépliante (11/10, idée de l'auteur) : pliée en quatre, elle s'ouvre, prend tout l'écran, et on s'y promène du doigt */
#plan{position:absolute;inset:0;z-index:10;display:none;overflow:hidden;touch-action:none;--L:300px}
#plan.on{display:block}
.pl-voile{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(28,18,10,.86),rgba(8,5,3,.94));opacity:0;transition:opacity .35s}
#plan.ouvert .pl-voile{opacity:1}
.pl-pli{position:absolute;left:50%;top:50%;width:var(--L);height:var(--L);margin:calc(var(--L) / -2) 0 0 calc(var(--L) / -2);perspective:1400px;transform-style:preserve-3d;opacity:0}
.pl-moitie{position:absolute;left:0;width:100%;height:50%;transform-style:preserve-3d}
.pl-moitie.haut{top:0}.pl-moitie.bas{top:50%;transform-origin:50% 0}
.pl-q{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d}
.pl-q.g{left:0}.pl-q.d{left:50%;transform-origin:0 50%}
.pl-face,.pl-dos{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pl-face{background:#efe3c8 url(assets/carnet/web/carte-europe-grande.webp) no-repeat;background-size:var(--L) var(--L);background-blend-mode:multiply;box-shadow:inset 0 0 18px rgba(120,85,40,.18)}
.pl-dos{transform:rotateY(180deg);background:radial-gradient(ellipse at 40% 30%,#f3e7cf,#e2d1ae 75%,#d2bd92);box-shadow:inset 0 0 0 1px rgba(90,60,30,.25),inset 0 0 22px rgba(110,75,35,.25)}
.pl-vue{position:absolute;inset:0;overflow:hidden;cursor:grab}
.pl-vue:active{cursor:grabbing}
.pl-feuille{position:absolute;left:0;top:0;transform-origin:0 0;background:#efe3c8;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pl-feuille>img{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none;user-select:none}
.pl-feuille>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* les deux pliures restent marquées dans le papier */
.pl-pliure{position:absolute;pointer-events:none}
.pl-pliure.v{left:50%;top:0;bottom:0;width:14px;margin-left:-7px;background:linear-gradient(90deg,transparent,rgba(110,75,35,.16) 45%,rgba(255,250,235,.35) 55%,transparent)}
.pl-pliure.h{top:50%;left:0;right:0;height:14px;margin-top:-7px;background:linear-gradient(transparent,rgba(110,75,35,.16) 45%,rgba(255,250,235,.35) 55%,transparent)}
/* les cartes postales, punaisées sur leur ville */
.pl-cp{position:absolute;width:74px;aspect-ratio:2/3;padding:4px;background:#fbf6ea;box-shadow:0 5px 12px rgba(40,25,10,.45);rotate:var(--r);transform-origin:50% 6px}
.pl-cp.doree{background:linear-gradient(135deg,#f6e3a1,#c9a14a 35%,#f3dc8e 60%,#b8892f)}
.pl-cp .cp-titre{font-size:11px;padding:8px 2px 4px}.pl-cp .cp-titre small{font-size:6px;letter-spacing:.1em;margin-bottom:1px}
.pl-cp .cp-x{right:-9px;top:-9px;font-size:13px;padding:0 6px}
/* ton train, posé sur la carte là où il roule : toujours au-dessus des cartes postales */

/* ---------- la page Amis (directions/AMIS.md) : le hall de la gare en fond, des tableaux à palettes et des panneaux transparents par-dessus ;
   formes provisoires en attendant les images de ChatGPT (directions/AMIS-IMAGES-2026-10-05.md) ---------- */
#amis .a-fond{position:absolute;inset:0;pointer-events:none;overflow:hidden;background:#140d07}
/* le hall (07/10, l'auteur) : une scène au format de l'image (961 × 1637), cadrée comme la gare par fitHall() ; l'horloge, le tableau
   à palettes et le Contrôleur y sont posés en % de l'image, ils restent à leur place quelle que soit la taille de l'écran */
#amis .a-scene{position:absolute;aspect-ratio:961/1637}
#amis .a-scene>*{position:absolute}
#aLueurs,#aLustres,#aPoussiere{inset:0}
#aFond{inset:0;width:100%;height:100%}
/* l'horloge : ses aiguilles peintes sont effacées (outils/amis-images.py), celles-ci donnent la vraie heure */
.a-horloge{left:41.73%;top:11.52%;width:16.03%;aspect-ratio:1;overflow:visible}
.a-horloge .aig{fill:#2b2620;filter:drop-shadow(1px 1.6px 1px rgba(40,20,0,.35))}
/* le tableau à palettes peint sous l'horloge : 3 lignes de 11 cases ; la 1re classe de la semaine s'y affiche */
.a-tableau{left:26.85%;top:23.40%;width:46.41%;height:7.51%;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(3,1fr);container-type:inline-size}
/* 10/10 : de vraies palettes (REFONTE-DESSINS, lot P ; outils/palettes.py). Une palette = deux moitiés de la même image ;
   quand le caractère change, la moitié du haut de l'ancien tombe, puis la moitié du bas du nouveau se rabat, 1 à 3 fois de suite */
.a-tableau span{position:relative;display:block;perspective:140px}
.a-tableau .pal{position:absolute;top:5%;bottom:5%;left:50%;aspect-ratio:96/140;translate:-50% 0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.pal i{position:absolute;left:0;width:100%;height:50%;background:center/100% 200% no-repeat;backface-visibility:hidden}
.pal .h,.pal .fh{top:0;background-position:50% 0}
.pal .b,.pal .fb{top:50%;background-position:50% 100%}
.pal .fh{transform-origin:50% 100%;animation:pal-haut var(--t,70ms) ease-in forwards}
.pal .fb{transform-origin:50% 0;animation:pal-bas var(--t,70ms) ease-out forwards}
@keyframes pal-haut{to{transform:rotateX(-90deg);filter:brightness(.55)}}
@keyframes pal-bas{from{transform:rotateX(90deg);filter:brightness(1.35)}to{transform:rotateX(0);filter:none}}
#amis .a-fond::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,9,5,.6),rgba(14,9,5,0) 9%,rgba(14,9,5,0) 52%,rgba(14,9,5,.8) 66%)}
.a-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* le hall vit (07/10, l'auteur : « trop vide, pas assez d'interactions entre la mascotte et le décor ») */
.a-ciel{left:0;top:5.50%;width:100%;height:20.77%;overflow:hidden;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}   /* derrière les vitres seulement (masque du ciel, outils/amis-images.py) */
.a-ciel i{position:absolute}
.a-etoile{width:2.5px;height:2.5px;border-radius:50%;background:#fff6e0;box-shadow:0 0 5px 1px rgba(255,240,210,.7);animation:twinkle var(--t,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.a-nuage{height:12%;border-radius:50%;filter:blur(3px);animation:a-nuage var(--d,90s) linear infinite;animation-delay:var(--dl,0s)}
body[data-moment="jour"] .a-nuage{background:radial-gradient(ellipse,rgba(255,255,255,.95),rgba(255,255,255,.4) 55%,transparent 72%)}
body[data-moment="matin"] .a-nuage{background:radial-gradient(ellipse,rgba(255,226,214,.9),rgba(255,206,196,.35) 55%,transparent 72%)}
@keyframes a-nuage{from{left:-30%}to{left:105%}}
.a-oiseau{width:2.6%;aspect-ratio:22/10;animation:a-vol var(--d,12s) linear forwards}
.a-oiseau svg{display:block;width:100%;height:100%}
.a-oiseau path{fill:none;stroke:#3a3f55;stroke-width:1.6;stroke-linecap:round;animation:flap .45s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes a-vol{from{left:-4%;translate:0 0}to{left:104%;translate:0 -30%}}
.a-lueur{animation:flicker var(--f,3s) ease-in-out infinite alternate,a-balance var(--d,5.5s) ease-in-out infinite alternate;animation-delay:0s,var(--dl,0s)}   /* leur lumière vacille et suit la lanterne */
@keyframes a-balance{from{margin-left:var(--b,0%)}to{margin-left:calc(-1 * var(--b,0%))}}
/* les trois lanternes suspendues (lot L de HALL-IMAGES) : découpées dans le hall (outils/amis-images.py), elles se balancent au bout de
   leur chaîne, chacune à son rythme. Leur lueur reste dans #aLueurs (une pièce qui tourne isole son mode écran) et suit le même balancement. */
.a-lustre{position:absolute;top:0;transform-origin:var(--px,50%) 0;animation:a-lustre var(--d,5.5s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.a-lustre img{display:block;width:100%}
@keyframes a-lustre{from{rotate:calc(-1 * var(--a,1.5deg))}to{rotate:var(--a,1.5deg)}}
/* le Contrôleur du hall (09/10) : seulement des poses faites pour le hall (HALL-IMAGES, HALL-POSES) ; il passe de l'une à l'autre en fondu.
   Le banc et l'échelle restent dans le hall ; ils s'effacent quand l'image de lui dessus les remplace. Places et tailles : outils/hall-poses.py */
.a-pose{height:auto}
#aBanc,#aEchelle,#aEchelleOmbre,#aAct,#aActOmbre,#aPot{transition:opacity .45s ease}
#aAct,#aActOmbre,#aPot{opacity:0}
#amis.act #aAct,#amis.act #aActOmbre{opacity:1}
#amis.act.act-banc #aBanc,#amis.act.act-echelle #aEchelle,#amis.act.act-echelle #aEchelleOmbre,#amis.act.act-astique #aEchelle,#amis.act.act-astique #aEchelleOmbre{opacity:0}
#amis:not(.act-echelle):not(.act-astique):not(.act-banc) #aAct{animation:breath 4.2s ease-in-out infinite alternate}   /* debout, il respire */
/* qui passe devant qui (09/10 : le banc au centre de la pièce) : au fond, l'échelle, et lui sur l'échelle ou au palmier ; puis le banc ;
   devant, lui debout sur le sol (versHall règle son z-index selon sa place) */
#aEchelleOmbre,#aEchelle,#aPot{z-index:2} #aBancOmbre,#aBanc{z-index:3} #aAct,#aActOmbre{z-index:4}
#amis.act.act-arrosoir #aPot{opacity:1}   /* le pot du décor reposé par-dessus lui : l'eau tombe DANS le pot */
#aAct{transform-origin:50% 100%}
#amis.act-banc #aAct{animation:breath 5s ease-in-out infinite alternate}
.a-ombre-act{height:2.2%;translate:-50% -50%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.42),rgba(0,0,0,.14) 50%,transparent 70%)}
#aPot{inset:0;width:100%;height:100%;clip-path:polygon(14.88% 41.84%,21.18% 41.84%,21.18% 42.33%,20.81% 42.58%,20.81% 47.65%,15.3% 47.65%,15.3% 42.58%,14.88% 42.33%)}   /* le pot du palmier de GAUCHE (09/10 : l'échelle est à droite) */
body[data-moment="soir"] #aAct,body[data-moment="soir"] #aBanc,body[data-moment="soir"] #aEchelle{filter:brightness(.92) saturate(.96)}
body[data-moment="matin"] .a-lueur{opacity:.45}
body[data-moment="jour"] .a-lueur{display:none}
.a-bulle{left:59%;top:40%;translate:0 -50%;max-width:140px;padding:9px 12px;border-radius:14px;background:var(--cream);color:#1d2238;font:800 13px/1.35 var(--sans);
  box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;scale:.7;transform-origin:0 50%;transition:opacity .18s,scale .3s var(--spring);z-index:5}
.a-bulle::after{content:'';position:absolute;left:-5px;top:50%;width:12px;height:12px;background:var(--cream);border-radius:2px;rotate:45deg;translate:0 -50%}
.a-bulle.on{opacity:1;scale:1}
.a-bulle.g{translate:-100% -50%;transform-origin:100% 50%;margin-left:-6px} .a-bulle:not(.g){margin-left:6px}   /* à sa gauche quand il est à droite du hall */
.a-bulle.g::after{left:auto;right:-5px}
/* 09/10 (l'auteur) : le hall reste en haut de la page ; seule la liste des amis défile, et elle passe sous le bord du décor, jamais dessus */
#amis .a-defile{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;overflow:hidden;padding:0 14px}
#amisCorps{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -14px;padding:0 14px 30px}
#amis .a-haut{position:relative;flex:none;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -14px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg,rgba(14,9,5,.95),rgba(14,9,5,.82) 72%,rgba(14,9,5,0))}
#amis .a-haut .croix{position:static;flex:none}
#amis .k{text-shadow:0 1px 6px rgba(0,0,0,.85);margin-top:2px}
#amis h2{text-shadow:0 2px 14px rgba(0,0,0,.8)}
.a-espace{flex:none;height:48dvh}   /* fitHall() la règle : la liste commence sous ses pieds */
.a-titre{margin:18px 4px 7px;font:800 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#ecd9b9;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.a-panneau{border-radius:16px;overflow:hidden;background:rgba(26,16,8,.6);border:1px solid rgba(255,217,161,.2);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,234,197,.09),0 10px 30px rgba(0,0,0,.35)}
.a-panneau .ami{padding:8px 12px;gap:10px;border-bottom-color:rgba(255,217,161,.07)}
