/* un hasard qui ne change pas d'une ouverture à l'autre (le trait de plume reste le même) */
const graine=n=>{const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)};


/* =====================================================================
   PROGRÈS (25/10, l'auteur : « voir notre progression le mieux possible, combien de temps les applis nous prennent, combien en moins
   cette semaine… voir ce que Horligne nous apporte », « code comme si j'avais déjà le compte »).
   1. La semaine : pour chaque jour, ta concentration (barre noire : les minutes de chaque gare atteinte) et, à côté, le temps passé
      sur les applis choisies dans « Applis à bloquer » (barre rouge : le Temps d'écran d'Apple, que l'app iPhone relève avec le verrou,
      au palier de 5 minutes). Toucher un jour : ses deux temps et l'écart (concentration ou distraction en plus).
   2. Tes applis semaine après semaine : la moyenne par jour (les jours mesurés seulement) et l'écart avec la semaine d'avant ;
      toucher une semaine l'ouvre au-dessus. Les coins de page remontent toutes les semaines depuis la première.
   Sans mesure (navigateur, ou app sans le compte développeur) : la concentration seule, et ce qu'il faut pour voir le rouge.
   ===================================================================== */
const ROUGE='#a3262b',ENCRE='#3a2a1a',VERT='#2f6b3a';
const MOIS_COURT=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
let progJour=null,progNumero=0;   // le jour touché sur le graphique de la semaine (0 = lundi)
function minutesParJour(){const m={};(S.log||[]).forEach(e=>{const k=jour(e.d);m[k]=(m[k]||0)+(e.m||0)});return m}
const mesureDispo=()=>!carnetAmi&&Object.keys(S.distraction||{}).length>0;
function bilanSemaine(w){const[,,deb]=semaine(w),C=minutesParJour(),D=carnetAmi?{}:(S.distraction||{}),maint=Date.now();
  const J=Array.from({length:7},(_,i)=>{const d=new Date(deb);d.setDate(d.getDate()+i);const k=jour(d.getTime());return {d,k,futur:d.getTime()>maint,c:C[k]||0,x:D[k]}});
  const mes=J.filter(j=>j.x!=null);return {J,conc:J.reduce((t,j)=>t+j.c,0),dist:mes.reduce((t,j)=>t+j.x,0),nMes:mes.length,moyD:mes.length?mes.reduce((t,j)=>t+j.x,0)/mes.length:null}}
const premiereSemaine=()=>Math.min(0,Math.round((plusAncienne()-lundiDe(Date.now()).getTime())/(7*864e5)));   // l'indice (négatif) de ta première semaine
/* une barre tracée à la plume, comme le reste du carnet (bords qui tremblent, hachures) */
function barrePlume(id,x,h,base,bw,coul,g){if(!h)return '';const y=base-h,j=k=>(graine(g+k)-.5)*2;
  return `<clipPath id="${id}"><rect x="${x}" y="${y}" width="${bw}" height="${h}"/></clipPath>
    <path d="M${x+j(1)} ${base}L${x+j(2)} ${y+j(3)}L${x+bw+j(4)} ${y+j(5)}L${x+bw+j(6)} ${base}" fill="none" stroke="${coul}" stroke-width="1.6" stroke-linejoin="round"/>
    <g clip-path="url(#${id})" stroke="${coul}" stroke-width=".9" opacity=".72">${Array.from({length:Math.ceil((h+bw)/4.6)},(_,k)=>`<line x1="${x-2}" y1="${base-k*4.6}" x2="${x+bw+2}" y2="${base-k*4.6-bw*.7}"/>`).join('')}</g>`}
const SOL=(w,y)=>`<path d="M0 ${y+.5}Q${w/4} ${y-1.2} ${w/2} ${y+.8}T${w} ${y}" fill="none" stroke="${ENCRE}" stroke-width="1.3"/>`;
const HALO=' style="paint-order:stroke;stroke:#efe3c9;stroke-width:3px;stroke-linejoin:round"';   // les chiffres restent lisibles sur le pointillé
const ecartTxt=(m)=>`${m>=0?'+':'−'}${fmtMin(Math.round(Math.abs(m)))}`;
function graphSemaine(B,w,aD){const id='pg'+(++progNumero)+'-',W=300,Hb=76,pas=W/7,bw=aD?13:22,auj=w===0?(new Date().getDay()+6)%7:-1;
  const max=Math.max(60,...B.J.map(j=>Math.max(j.c,j.x||0)));let s='';
  B.J.forEach((j,i)=>{const cx=i*pas+pas/2,sel=progJour===i,hc=j.c?Math.max(5,j.c/max*Hb):0,hx=j.x?Math.max(5,j.x/max*Hb):0;
    if(sel)s+=`<rect x="${i*pas+2}" y="-3" width="${pas-4}" height="${Hb+25}" rx="6" fill="${ENCRE}" opacity=".08"/>`;
    s+=aD?barrePlume(id+i+'c',cx-bw-1,hc,Hb,bw,ENCRE,i*7+w*31)+barrePlume(id+i+'x',cx+1,hx,Hb,bw,ROUGE,i*11+w*17):barrePlume(id+i+'c',cx-bw/2,hc,Hb,bw,ENCRE,i*7+w*31);
    if(aD&&j.x===0&&!j.futur)s+=`<text x="${cx+1+bw/2}" y="${Hb-3}" text-anchor="middle" font-family="IM Fell English,Georgia,serif" font-size="11" fill="${ROUGE}">0</text>`;
    s+=`<text x="${cx}" y="${Hb+17}" text-anchor="middle" font-family="IM Fell English,Georgia,serif" font-size="14" fill="${ENCRE}"${i===auj||sel?' text-decoration="underline"':''}${sel?' font-weight="700"':''}>${'LMMJVSD'[i]}</text>
      <rect data-pg-j="${i}" x="${i*pas}" y="-5" width="${pas}" height="${Hb+28}" fill="transparent"/>`});
  return `<svg class="pg-graphe" viewBox="-4 -6 308 104" role="img" aria-label="Chaque jour de la semaine : ta concentration${aD?' et le temps de tes applis':''}. Touche un jour pour le détail.">${s}${SOL(W,Hb)}</svg>`}
function detailJour(j,aD){const date=`${JOUR_NOM[j.d.getDay()]} ${j.d.getDate()===1?'1er':j.d.getDate()}`.replace(/^./,c=>c.toUpperCase());
  if(j.futur)return `${date} : pas encore passé.`;
  if(!aD||j.x==null)return `${date} : <b>${fmtMin(j.c)}</b> de concentration${aD?' (tes applis n’étaient pas encore mesurées)':''}.`;
  const d=j.c-j.x;return `${date} : <b>${fmtMin(j.c)}</b> de concentration, <b class="rg">${fmtMin(j.x)}</b> sur tes applis.<br>${d>0?`<span class="plus">${fmtMin(d)} de concentration en plus.</span>`:d<0?`<span class="moins">${fmtMin(-d)} de distraction en plus.</span>`:'Autant de l’un que de l’autre.'}`}
/* tes applis (ou, sans mesure, ta concentration), semaine après semaine : six semaines jusqu'à celle ouverte au-dessus */
function graphSemaines(w,aD){const premiere=premiereSemaine(),libre=abonne()||carnetAmi?premiere:Math.max(premiere,1-CARNET_LIBRE),debut=Math.max(libre,w-5);
  const L=[];for(let k=debut;k<=w;k++){const B=bilanSemaine(k);L.push({w:k,v:aD?B.moyD:B.conc})}
  const id='ps'+progNumero+'-',W=300,Hb=62,top=16,pas=W/6,bw=26,vals=L.map(x=>x.v).filter(v=>v!=null),max=Math.max(aD?60:120,...vals),coul=aD?ROUGE:ENCRE;let s='';
  /* la référence : ta première semaine mesurée, en pointillé */
  let ref=null;if(aD){for(let k=premiere;k<=0;k++){const B=bilanSemaine(k);if(B.moyD!=null){ref=B.moyD;break}}}
  if(ref!=null){const y=top+Hb-ref/max*Hb;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="${ROUGE}" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/><text x="${W}" y="${y-3}" text-anchor="end" font-family="IM Fell English,Georgia,serif" font-size="10.5" fill="${ROUGE}" opacity=".8"${HALO}>ta 1re semaine</text>`}
  L.forEach((x,i)=>{const cx=i*pas+pas/2,h=x.v?Math.max(4,x.v/max*Hb):0,sel=x.w===w,[,,deb]=semaine(x.w),av=i?L[i-1].v:null;
    s+=barrePlume(id+i,cx-bw/2,h,top+Hb,bw,coul,i*13+x.w*7);
    if(x.v!=null)s+=`<text x="${cx}" y="${top+Hb-h-4}" text-anchor="middle" font-family="IM Fell English,Georgia,serif" font-size="11.5" fill="${coul}"${HALO}>${fmtMin(Math.round(x.v))}${aD?'/j':''}</text>`;
    s+=`<text x="${cx}" y="${top+Hb+15}" text-anchor="middle" font-family="IM Fell English,Georgia,serif" font-size="12" fill="${ENCRE}"${sel?' font-weight="700" text-decoration="underline"':''}>${x.w===0?'cette sem.':deb.getDate()+' '+MOIS_COURT[deb.getMonth()]}</text>`;
    if(x.v!=null&&av!=null){const d=x.v-av,mieux=aD?d<=0:d>=0;s+=`<text x="${cx}" y="${top+Hb+28}" text-anchor="middle" font-family="IM Fell English,Georgia,serif" font-size="11.5" fill="${mieux?VERT:ROUGE}">${ecartTxt(d)}</text>`}
    s+=`<rect data-pg-sem="${x.w}" x="${i*pas}" y="0" width="${pas}" height="${top+Hb+32}" fill="transparent"/>`});
  return `<svg class="pg-graphe" viewBox="-4 -2 308 112" role="img" aria-label="${aD?'Le temps de tes applis par jour, semaine après semaine':'Ta concentration, semaine après semaine'}. Touche une semaine pour l’ouvrir au-dessus.">${s}${SOL(W,top+Hb)}</svg>`}
function resumeDepuisDebut(aD){const premiere=premiereSemaine();
  if(aD){let a=null,ka=null;for(let k=premiere;k<=0;k++){const B=bilanSemaine(k);if(B.moyD!=null){a=B.moyD;ka=k;break}}
    const B=bilanSemaine(0),now=B.moyD!=null?B.moyD:bilanSemaine(-1).moyD;
    if(a==null||now==null||ka===0)return 'Ta première semaine mesurée : la comparaison commence lundi.';
    const d=a-now;return d>0?`Depuis ta 1re semaine mesurée : <b>${fmtMin(Math.round(d))} de moins par jour</b> sur tes applis.`:d<0?`Depuis ta 1re semaine mesurée : ${fmtMin(Math.round(-d))} de plus par jour sur tes applis. On reprend la main.`:'Autant qu’à ta 1re semaine mesurée.'}
  const tot=(S.log||[]).reduce((t,e)=>t+(e.m||0),0),n=1-premiere;
  return tot?`Depuis le début : <b>${fmtMin(tot)}</b> de concentration en ${n} semaine${n>1?'s':''}.`:'Ton premier trajet commencera ta courbe.'}
function noteMesure(){if(carnetAmi)return '';const N=NATIF||null;
  if(!N)return `<div class="pg-mesure">Le temps passé sur tes applis s’affiche dans l’app Horligne de l’iPhone : une barre rouge à côté de chaque barre de concentration.</div>`;
  if(!N.verrou)return `<div class="pg-mesure">Avec le verrou d’Apple (compte développeur), Horligne mesurera le temps de tes applis : une barre rouge à côté de chaque barre de concentration.</div>`;
  if(!N.applis)return `<div class="pg-mesure">Choisis les applis qui te prennent du temps : Horligne mesure chaque jour combien de temps tu y passes, et te montre combien tu en gagnes.<button type="button" data-pg-applis>Choisir mes applis</button></div>`;
  return `<div class="pg-mesure">Mesure en cours : la première barre rouge arrive dès 5 minutes sur tes applis.</div>`}
function pageProgres(w){if(semaineVerrouillee(w))return pageVerrou(w,'Progrès');
  const B=bilanSemaine(w),A=bilanSemaine(w-1),aD=mesureDispo(),[,,deb]=semaine(w);
  const titre=w===0?'Cette semaine':w===-1?'La semaine dernière':'Semaine du '+dateCourte(deb);
  const cC=A.conc?`<em class="${B.conc>=A.conc?'mieux':'pire'}">${ecartTxt(B.conc-A.conc)} vs la semaine d’avant</em>`:B.conc?'<em>ta première semaine</em>':'<em>&nbsp;</em>';
  const cD=B.moyD!=null&&A.moyD!=null?`<em class="${B.moyD<=A.moyD?'mieux':'pire'}">${ecartTxt(B.moyD-A.moyD)} par jour vs la semaine d’avant</em>`:'<em>&nbsp;</em>';
  const j=progJour!=null?B.J[progJour]:null;
  const detail=j?detailJour(j,aD):aD&&B.nMes?(B.conc>=B.dist?`Cette semaine, ta concentration passe devant tes applis de <b>${fmtMin(B.conc-B.dist)}</b>.`:`Cette semaine, tes applis passent devant ta concentration de <b class="rg">${fmtMin(B.dist-B.conc)}</b>.`)+' Touche un jour pour le détail.'
    :B.conc?'Touche un jour pour le détail.':(w===0?'Pas encore de voyage cette semaine.':'Aucun voyage cette semaine-là.');
  return `<div class="bil-tete"><span class="rubrique">Progrès</span><h3>${titre}</h3></div>
    <div class="pg-chiffres"><div><b>${fmtMin(B.conc)}</b>de concentration${cC}</div>${aD?`<div class="rouge"><b>${fmtMin(B.dist)}</b>sur tes applis${B.nMes&&B.nMes<7&&!B.J.some(x=>x.futur)?` (${B.nMes} j mesurés)`:''}${cD}</div>`:''}</div>
    ${aD?'<div class="pg-legende"><span><i></i>concentration</span><span class="r"><i></i>tes applis</span></div>':''}
    ${graphSemaine(B,w,aD)}
    <div class="note pg-detail">${detail}</div>
    <div class="pg-titre2">${aD?'Tes applis, semaine après semaine':'Ta concentration, semaine après semaine'}</div>
    ${graphSemaines(w,aD)}
    <div class="note pg-resume">${resumeDepuisDebut(aD)}</div>
    ${aD?'':noteMesure()}
    ${coins(w)}`}
$('cPages').addEventListener('click',e=>{if(tourne||onglet!=='progres')return;
  const j=e.target.closest('[data-pg-j]');if(j){const i=+j.dataset.pgJ;progJour=progJour===i?null:i;clic();afficher(0);return}
  const s=e.target.closest('[data-pg-sem]');if(s){const k=+s.dataset.pgSem;if(k!==semB){semB=k;progJour=null;clic();afficher(0)}return}
  if(e.target.closest('[data-pg-applis]'))natif('applis')});

/* Billets : un billet par jour roulé, posés en pile comme de vrais billets (11/10, l'auteur : une semaine sur une seule page, même en roulant tous les jours).
   On voit le haut de chacun : le jour sur la souche, puis chaque ligne prise ce jour-là avec ses poinçons (déchiré : un frein). */
const BT_H=142,BT_PLACE=482;   // hauteur d'un billet (largeur de la page / 2,53) ; hauteur disponible pour la pile
function pageBillets(w){if(semaineVerrouillee(w))return pageVerrou(w,'Billets');
  const[a,b]=semaine(w),tr=(S.trajets||[]).filter(t=>t.d>=a&&t.d<b).sort((x,y)=>x.d-y.d);
  if(!tr.length)return `${titreSemaine(w,'Billets')}<p class="vide">${w===0?'Aucun billet cette semaine. Le Contrôleur poinçonnera le prochain.':'Aucun voyage cette semaine-là.'}</p>${coins(w)}`;
  const jours=[];
  for(let j=0;j<7;j++){const d0=new Date(a);d0.setDate(d0.getDate()+j);const d1=new Date(d0);d1.setDate(d1.getDate()+1);
    const duJour=tr.filter(t=>t.d>=d0.getTime()&&t.d<d1.getTime());if(duJour.length)jours.push({d0,d1,duJour})}
  const n=jours.length,pas=n>1?Math.min(BT_H+8,(BT_PLACE-BT_H)/(n-1)):0;   // la part visible de chaque billet
  return titreSemaine(w,'Billets')+`<div class="bt-pile">${jours.map(({d0,d1,duJour},k)=>{
    const ids=[...new Set(duJour.map(t=>t.l))],v=1+Math.floor(graine(d0.getTime()/864e5)*3),jn=JOUR_NOM[d0.getDay()];
    const fini=ids.some(id=>{const L=(S.personalLines||{})[id];return L&&L.termine&&L.termine>=d0.getTime()&&L.termine<d1.getTime()});
    const lignes=ids.slice(0,ids.length>3?2:3).map(id=>{const du=duJour.filter(t=>t.l===id),t0=du[du.length-1],L=(S.personalLines||{})[id],coop=t0.coop;
      const nom=coop?(carnetAmi?'Train Coop':t0.n||'Train Coop'):carnetAmi?'Ligne '+(NOMS_COULEURS[L&&L.color]||''):L?L.name:t0.n;
      return `<div class="bt-l">${coop?'<i class="bt-patte"></i>':''}<span class="bt-nom">${esc(nom)}</span><span class="bt-trous">${du.slice(0,8).map(t=>`<i class="trou${t.fr?' dechire':''}"></i>`).join('')}${du.length>8?'<b>+</b>':''}</span></div>`}).join('');
    return `<div class="bt${v>1?' v'+v:''}" style="margin-top:${k?(pas-BT_H).toFixed(1):0}px;rotate:${((graine(k*5+d0.getDate())-.5)*1.4).toFixed(2)}deg">
      <div class="bt-souche"><b>${jn.slice(0,3)}</b><span>${d0.getDate()===1?'1<sup>er</sup>':d0.getDate()}</span></div>
      <div class="bt-lignes">${lignes}${ids.length>3?`<div class="bt-l bt-plus">et ${ids.length-2} autres lignes</div>`:''}</div>
      ${fini?'<span class="tampon-terminus">TERMINUS</span>':(S.consHist||{})[jour(d0.getTime())]?'<span class="bt-complet" title="Mission du jour accomplie" aria-label="Mission du jour accomplie">★</span>':''}</div>`}).join('')}</div>${coins(w)}`}

function pageProfil(){   // 25/10 : la grande carte d'abonné porte l'essentiel ; le bilan de la semaine est dans Progrès
  return carteProfil()+(carnetAmi?'':'<button type="button" class="pf-progres" data-vers-progres>Voir mes progrès ›</button>')+`<div class="bil-signature" aria-hidden="true"><img src="assets/carnet/web/bilan/taches.webp" alt=""></div>`}
const contenu=()=>onglet==='bilan'?pageProfil():onglet==='progres'?pageProgres(semB):onglet==='billets'?pageBillets(semT):onglet==='tampons'?pageTampons():pageCartes();

function plume(racine){racine.querySelectorAll('.note,.vide,.bil-tenus,.tp-nom,.coins button,.bil-cases span,.voy-sous').forEach(el=>{
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),noeuds=[];while(w.nextNode())noeuds.push(w.currentNode);
  noeuds.forEach(n=>{const f=document.createDocumentFragment();n.textContent.split(/(\s+)/).forEach(m=>{
    if(!m.trim()){f.appendChild(document.createTextNode(m));return}
    let h=0;for(const c of m)h=(h*31+c.charCodeAt(0))%9973;const sp=document.createElement('span');sp.className='mot';
    sp.style.setProperty('--r',((graine(h)-.5)*2.4).toFixed(2)+'deg');sp.style.setProperty('--y',((graine(h+7)-.5)*1.6).toFixed(2)+'px');sp.textContent=m;f.appendChild(sp)});
    n.replaceWith(f)})})}
/* tourner la page : en avant, l'ancienne page pivote sur la reliure et découvre la nouvelle ; en arrière, la nouvelle revient se poser */
function froissement(){if(S.set&&S.set.rail===false)return;try{const ac=contexteSon(),n=ac.sampleRate*.32,bf=ac.createBuffer(1,n,ac.sampleRate),d=bf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n)*(.6+.4*Math.random());const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  f.type='bandpass';f.frequency.value=2400;f.Q.value=.7;g.gain.value=.22;s.buffer=bf;s.connect(f).connect(g).connect(sortie(ac));s.start()}catch(e){}}
/* tourner une vraie page : elle se plie depuis le coin du bas (le pli avance, on voit le revers du papier,
   la page projette son ombre sur celle d'en dessous) ; on peut aussi la tirer du doigt et la lâcher à mi-chemin */
let tourne=false,dernierTrait=null,tourGeneration=0;
function annulerTours(){tourGeneration++;tourne=false;doigt=null;const box=$('cPages');
  box.querySelectorAll('.pli-ombre,.pli-rabat').forEach(p=>p.remove());
  box.querySelectorAll('.page').forEach(p=>{p.style.clipPath='';p.style.zIndex=''})}
/* 22/10 (l'auteur : « refais en sorte qu'on ne puisse pas faire glisser le carnet vers le bas ou le haut ») : une page de carnet ne défile pas.
   Depuis la police Sour Gummy (19/10), le texte plus grand dépassait parfois la feuille et la page défilait. Désormais, si le contenu
   dépasse, il se réduit juste assez pour tenir entier sur la feuille (jamais sous 62 %), comme on écrirait plus petit en bas d'une page. */
function ajusterPage(p){const c=p&&p.querySelector(':scope>.page-c');if(!c)return;
  const poser=k=>{c.style.transform=k<1?`scale(${k})`:'';c.style.width=k<1?`${100/k}%`:'';c.style.marginRight=k<1?`${100-100/k}%`:'';c.style.marginBottom=''};
  poser(1);const cs=getComputedStyle(p),dispo=p.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);if(dispo<=0)return;
  const B=[...c.querySelectorAll('.bt-pile>.bt')],trop=c.offsetHeight-dispo;   // les billets : on resserre d'abord la pile (ils se recouvrent un peu plus), sans rien rétrécir
  if(B.length>1&&trop>0){const h=B[0].offsetHeight;B.slice(1).forEach(b=>{const vu=h+(parseFloat(b.style.marginTop)||0);b.style.marginTop=`${Math.max(44,vu-trop/(B.length-1))-h}px`})}
  const tient=k=>{poser(k);return c.offsetHeight*k<=dispo+.5};
  if(!tient(1)){let lo=.62,hi=1;for(let i=0;i<8;i++){const m=(lo+hi)/2;if(tient(m))lo=m;else hi=m}   // la plus grande taille qui tient
    poser(lo);c.style.marginBottom=`${-c.offsetHeight*(1-lo)}px`}   // la boîte du contenu ne dépasse plus de la feuille : rien à faire défiler
  p.scrollTop=0;p.scrollLeft=0}
new MutationObserver(m=>m.forEach(r=>r.addedNodes.forEach(n=>{if(n.classList?.contains('page'))ajusterPage(n)}))).observe($('cPages'),{childList:true});
const reajusterPages=()=>document.querySelectorAll('#cPages .page').forEach(ajusterPage);
addEventListener('resize',reajusterPages);document.fonts?.ready.then(reajusterPages);
function nouvellePage(){const p=document.createElement('div');p.className='page';p.innerHTML=`<div class="page-c">${avecAmi(contenu)}</div>`;plume(p);
  const dernier=(S.log||[]).at(-1),note=p.querySelector('.note');
  if(!carnetAmi&&!reduce&&onglet==='progres'&&semB===0&&note&&dernier&&Date.now()-dernier.d<120000&&dernierTrait!==dernier.d){
    dernierTrait=dernier.d;const pen=document.createElement('i');pen.className='trace-plume';pen.setAttribute('aria-hidden','true');note.style.position='relative';note.appendChild(pen);
    requestAnimationFrame(()=>{const w=note.clientWidth;pen.style.top='-12px';pen.animate([{left:'0',opacity:0},{opacity:1,offset:.08},{left:(w-24)+'px',opacity:1,offset:.9},{left:(w-24)+'px',opacity:0}],{duration:1500,easing:'linear'}).finished.then(()=>pen.remove()).catch(()=>pen.remove());
      note.querySelectorAll('.mot').forEach((mot,i)=>mot.animate([{opacity:0},{opacity:1}],{duration:120,delay:i*70,fill:'backwards'}))})}
  p.querySelectorAll('image').forEach(im=>{im.addEventListener('load',()=>{const d=im.previousElementSibling;if(d&&d.classList.contains('sil-def'))d.remove()});im.addEventListener('error',()=>im.remove())});
  return p}
/* le pli : la médiatrice entre le coin du bas (C) et le point où le doigt l'a emmené (P) ; t = part de la page déjà tournée */
function geometrie(W,H,t){const P={x:W-2*W*t,y:H-H*.2*Math.sin(Math.PI*t)},C={x:W,y:H};
  let nx=C.x-P.x,ny=C.y-P.y;const l=Math.hypot(nx,ny)||1e-6;nx/=l;ny/=l;const M={x:(C.x+P.x)/2,y:(C.y+P.y)/2};
  const coupe=sg=>{const R=[[0,0],[W,0],[W,H],[0,H]],o=[];for(let i=0;i<4;i++){const a=R[i],b=R[(i+1)%4],da=sg*((a[0]-M.x)*nx+(a[1]-M.y)*ny),db=sg*((b[0]-M.x)*nx+(b[1]-M.y)*ny);

function majCartes(){sansCarte=null;S.cartes=S.cartes||[];S.cpt=S.cpt||{};const pos=position(),now=new Date(),cle=now.getFullYear()*12+now.getMonth();
  if(!S.cartesV){S.cartesV=1;S.moisVu=cle;Object.values(S.personalLines||{}).forEach(L=>{if(L.completed&&!L.vuFini){L.vuFini=1;S.cpt.terminus=(S.cpt.terminus||0)+1}});return}   // le passé : compté, sans cartes

    const min=(S.log||[]).filter(e=>e.d>=a&&e.d<b).reduce((x,e)=>x+(e.m||0),0),T=(S.trajets||[]).filter(t=>t.d>=a&&t.d<b);
    if(min>0){const fr=T.filter(t=>t.fr).length;S.cartes.push({t:'mois',d:b,v:pos.i,mois:MOIS_NOM[new Date(a).getMonth()],min,tenus:T.length-fr,fr,doree:!fr&&T.length>0?1:0});

  const defiler=(k=0)=>{if(!ici())return;if(tourne){if(k<20)vusT=setTimeout(()=>defiler(k+1),200);return}   // attendre que la page ait fini de tourner
    vusT=setTimeout(()=>{if(!ici())return;S.tpNeufs=(S.tpNeufs||[]).filter(id=>!ids.includes(id));sauver();majNeufs()},2200)};   // vus si la page est restée ouverte (pas seulement feuilletée)

/* ---------- la carte d'un ami, posée seule (07/10, l'auteur) : on la retourne d'un toucher ; au dos, sa semaine. L'inviter, le retirer ---------- */

  const total=jours.reduce((x,y)=>x+y,0),tenus=(S.trajets||[]).filter(t=>t.d>=a&&t.d<b&&!t.fr).length,max=Math.max(60,...jours);
  return `<div class="dos-carte"><div class="dc-t">Cette semaine</div><div class="dc-total">${fmtMin(total)}</div>
    <div class="dc-tenus">${tenus?`${tenus} trajet${tenus>1?'s':''} tenu${tenus>1?'s':''}`:'Pas encore de trajet'}</div>
    <div class="dc-barres">${jours.map((m,i)=>`<span>${m?`<i style="height:${Math.max(6,m/max*72).toFixed(0)}%"></i>`:''}<b>${'LMMJVSD'[i]}</b></span>`).join('')}</div></div>`}

  const rendre=msg=>{$('ecrin').innerHTML=`<div class="mod-boite"><button class="croix" data-ec="non" aria-label="Fermer">×</button><div class="k">TA MÉDAILLE DE PROFIL</div><h2>${titre||'Change de médaille'}</h2>

    <div class="ecrin"><div class="ecrin-grille">${MEDAILLES.map(M=>{const v=M.rare&&!R[M.id];
      return `<button class="ec${sel===M.id?' on':''}${v?' verrou':''}" data-med="${M.id}" aria-label="${M.nom}${v?' (à gagner)':''}">${medailleHTML(M.id,'52px',{verrou:v})}<small>${M.nom}</small></button>`}).join('')}</div></div>

function majMedailles(){S.medaillesRares=S.medaillesRares||{};const neuves=[];
  MEDAILLES.forEach(M=>{if(M.rare&&!S.medaillesRares[M.id]&&M.test()){S.medaillesRares[M.id]=Date.now();neuves.push(M.id)}});

   sans offre après ; une à l'arrivée, en descendant du train, avant que le Contrôleur remette ce qui est gagné.
   Changé le 20/10 (l'auteur, après l'analyse Duolingo) : pas de pub au tout premier départ ; à l'arrivée, la pub OU l'offre, jamais les deux :
   au premier trajet réussi du jour, pas de pub, l'offre vient après les tampons ; ensuite la pub seule.
   Simulées dans le prototype : 15 s au départ, 30 s à l'arrivée (3 s et 5 s en trajet éclair), qu'on ne peut pas passer. L'abonné n'en voit aucune. */
function pubVideo(o,suite){if($('pub').classList.contains('on'))return;
  if(BETA){if(o.ref)sauverSerie(o.ref);suite();return}   // version de test : aucune pubconst p=$('pub'),total=(o.depart?(demoOn()?3:15):(demoOn()?5:30))*1000,s=Math.round(total/1000);let ecoule=0,der=performance.now(),fini=false,t=null;
  S.pubVue=Date.now();if(o.depart)S.pubDepart=S.pubVue;else S.pubArrivee=S.pubVue;S.pubs=(S.pubs||0)+1;noter('pub',{quand:o.depart?'depart':o.serie?'serie':'arrivee'});sauver();
  p.innerHTML=`<div class="pub-haut"><span class="pub-tag">Publicité</span><span class="pub-compte" id="pubCompte">${s}</span></div>
    <div class="pub-ecran"><div class="pub-video">${o.serie?`<span class="pub-serie">Ta série de ${o.serie} jours revient à la fin de la pub.</span>`:''}<i class="pub-lecture" aria-hidden="true"></i><b>Publicité · exemple</b><span>Ici passera une vidéo de ${s} secondes.</span></div><div class="pub-barre"><i id="pubBarre"></i></div></div>
    <div class="pub-bas"><p id="pubTxt">${o.serie?'Regarde-la jusqu’au bout.':o.depart?'Le Contrôleur prépare ton billet pendant la pub.':'Le Contrôleur range ton billet pendant la pub.'}</p></div>`;
  p.classList.add('on');p.setAttribute('aria-hidden','false');
  const retirer=()=>{if(!p.classList.contains('on'))return;p.classList.remove('on');p.setAttribute('aria-hidden','true');p.innerHTML=''};
  const visibilite=()=>der=performance.now();document.addEventListener('visibilitychange',visibilite);
  const terminer=()=>{if(fini)return;fini=true;clearInterval(t);document.removeEventListener('visibilitychange',visibilite);$('pubCompte').hidden=true;$('pubBarre').style.width='100%';
    if(o.ref){sauverSerie(o.ref);$('pubTxt').textContent=`Série sauvée : ${serie()} jour${serie()>1?'s':''} d’affilée.`;secousse([10,40,18])}
    else $('pubTxt').textContent=o.depart?'En voiture !':'Merci. Le quai t’attend.';
    setTimeout(()=>{retirer();suite()},o.depart?700:o.ref?1800:1100)};   // jamais d'offre derrière une pub (20/10) : on monte, ou on revient en gare
  t=setInterval(()=>{const now=performance.now();if(!document.hidden)ecoule+=now-der;der=now;   // en pause si l'app passe derrière
    $('pubBarre').style.width=Math.min(100,ecoule/total*100)+'%';$('pubCompte').textContent=Math.max(0,Math.ceil((total-ecoule)/1000));if(ecoule>=total)terminer()},200)}

/* la série après un frein (l'auteur, 11/10) : une pub la garde, au plus une fois par semaine ; l'abonné la garde sans pub.
   Le frein garde toutes ses autres traces (train abîmé, carte d'incident). Pas en Coop : le frein y fait échouer tout le groupe. */
function debutSerie(){const g=S.serieGrace;return g&&g.frein===S.dernierFrein?g.depuis:(S.dernierFrein||0)}
function serieSauvable(){const r=S.serieRef;if(!r||r.frein!==S.dernierFrein||r.coop||(r.avant||0)<2)return null;
  if((S.serieGrace&&S.serieGrace.frein===r.frein)||S.serieRefus===r.frein||Date.now()-r.frein>48*36e5)return null;
  if((S.sauvetages||[]).some(x=>Date.now()-x<7*864e5))return null;return r}
function sauverSerie(r){if(!r||(S.serieGrace&&S.serieGrace.frein===r.frein))return;S.serieGrace={frein:r.frein,depuis:r.depuis};noter('serie-sauvee',{n:r.avant});
  S.sauvetages=[...(S.sauvetages||[]).filter(x=>Date.now()-x<30*864e5),Date.now()];S.serieMax=Math.max(S.serieMax||0,serie());sauver();paintBoard()}
function offrirSerie(r,suite){const m=$('sauvetage'),ab=abonne(),libre=ab||BETA;
  m.innerHTML=`<div class="sv-boite"><div class="k">TA SÉRIE</div>
    <svg class="sv-flamme" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1c1 3 4 4.5 4 8.2A4 4 0 0 1 4 9.2C4 7 5.5 6 6 4c.8 1.2 1.2 2 2 2.2C8.4 4.8 8.3 3 8 1z"/></svg>
    <div class="sv-n">${r.avant}</div><h2>jours d’affilée…</h2>
    <p class="sv-txt">Le frein a remis ta série à zéro. ${ab?'Abonné : tu peux la garder, une fois par semaine.':BETA?'Version de test : tu peux la garder, une fois par semaine.':'Regarde une pub jusqu’au bout et elle repart comme si de rien n’était. Une fois par semaine.'}</p>
    <p class="sv-note">Le train garde ses dégâts.${libre?'':' Abonné : ta série se garde sans pub.'}</p>
    <button class="sv-oui" id="svOui">${libre?'Garder ma série':'▶ Regarder la pub · garder ma série'}</button>
    <button class="sv-non" id="svNon">Laisser filer</button></div>`;
  m.classList.add('on');
  $('svOui').addEventListener('click',()=>{m.classList.remove('on');m.innerHTML='';
    if(libre){sauverSerie(r);toast(`Série sauvée : ${serie()} jours d’affilée.`);secousse([10,40,18]);suite()}
    else pubVideo({serie:r.avant,ref:r},suite)});
  $('svNon').addEventListener('click',()=>{m.classList.remove('on');m.innerHTML='';S.serieRefus=r.frein;noter('serie-laissee',{n:r.avant});sauver();suite()})}
const PUB_AU_DEPART=!BETA;   // false : plus de pub au départ (voir OFFRE-2026-10-11, règle Google Play sur les pubs au début d'une activité)
const premierDepart=()=>!(S.trajets||[]).length&&!(S.log||[]).length&&!(S.incidents||[]).length;   // 20/10 (l'auteur) : le tout premier trajet part sans pub
let pubDepartFaite=false;
$('go').addEventListener('click',e=>{if(pubDepartFaite){pubDepartFaite=false;return}
  if(!PUB_AU_DEPART||abonne()||premierDepart()||enCours()||vide||$('go').disabled||(H&&H.busy)||document.body.classList.contains('boarding')||$('pub').classList.contains('on'))return;
  e.stopImmediatePropagation();e.preventDefault();$('go').disabled=true;
  pubVideo({depart:1},()=>{$('go').disabled=false;pubDepartFaite=true;$('go').click()})},true);
/* en Coop, le Voyageur invité voit la pub du départ quand il monte (invitation ou code), avant de prendre sa place sur le quai */
{const monter=monterDans,rejoindre=rejoindreCoop,pubCoop=f=>{if($('pub').classList.contains('on')||H?.busy)return;if(PUB_AU_DEPART&&!abonne()&&!premierDepart()&&!$('pub').classList.contains('on'))pubVideo({depart:1},f);else f()};
  monterDans=t=>pubCoop(()=>monter(t));rejoindreCoop=c=>pubCoop(()=>rejoindre(c))}
/* en descendant du train : d'abord la série à sauver (après un frein), sinon la pub du Voyageur ; puis l'arrivée habituelle.
   20/10 (l'auteur) : la pub OU l'offre. Au premier trajet réussi du jour, pas de pub : l'offre du jour viendra après les tampons (proposerAbonnement). */
const offreAttendue=retour=>!abonne()&&!/frein|incident/i.test(retour||'')&&S.aboJour!==jour(Date.now());
function apresTrain(retour,suite){const r=serieSauvable();
  if(r){offrirSerie(r,suite);return}
  if(retour&&!abonne()&&!offreAttendue(retour)&&Date.now()-(S.pubArrivee||0)>60000){pubVideo({},suite);return}
  suite()}

/* =====================================================================
   LE BILLET DE FIN DE TRAJET (20/10, analyse Duolingo : l'écran « leçon terminée »)
   Ce que le trajet a rapporté, en un coup d'œil : minutes, gares, km du grand voyage, série et semaine, prochaine ville.
   Seulement après un trajet mené jusqu'à une gare (pas après un frein). Un seul bouton : « Continuer ».
   ===================================================================== */
const SEM_L=['L','M','M','J','V','S','D'];
/* L'OBJECTIF DES 7 PREMIERS JOURS (21/10, plan Duolingo thème 2 : la boucle des 7 premiers jours).
   Au 1er trajet réussi (et encore au 3e si on ne s'est pas engagé), le billet propose « On vise 7 jours d'affilée ? » ;
   « Je m'engage » se tamponne sur le billet, sans fenêtre de plus. Ensuite, chaque billet dit « jour N sur 7 »,
   et le palier des 7 jours fête l'objectif tenu. Une série cassée repart au jour 1, sans reproche. */
function objectifPropose(){return !S.objectif7&&[1,3].includes(trajetsReussis())}
function noteSemaine(n,reste){const o=S.objectif7;
  if(objectifPropose())return `<div class="bf-objectif"><p class="bf-note"><b>On vise 7 jours d’affilée ?</b> Un trajet par jour, même court. Je coche chaque jour sur ton billet.</p><button type="button" class="bf-engage">Je m’engage</button></div>`;
  if(o&&!o.tenu)return `<p class="bf-note"><b>Objectif 7 jours : jour ${Math.min(n,7)} sur 7.</b> ${n>=7?'Objectif tenu !':n===1&&o.d<Date.now()-864e5?'On repart, sans regret.':`Encore ${7-n} jour${7-n>1?'s':''}.`}</p>`;
  return `<p class="bf-note">${n%7===0?'Une semaine complète d’affilée. Bravo !':`Encore ${reste} jour${reste>1?'s':''} pour une semaine complète.`}</p>`}
function engagerObjectif(b,n){if(S.objectif7)return;S.objectif7={d:Date.now(),serie:n};noter('objectif7',{jour:n});sauver();clic();secousse([10,30,10]);
  b.outerHTML='<span class="bf-engage fait" aria-live="polite">Engagé ✓</span>';
  const t=document.querySelector('#billetFin .bf-engage.fait');if(t&&!reduce)t.animate([{transform:'scale(1.6) rotate(-14deg)',opacity:0},{transform:'scale(.92) rotate(-6deg)',opacity:1,offset:.6},{transform:'scale(1) rotate(-6deg)',opacity:1}],{duration:420,easing:'ease-out',fill:'forwards'});
  const p=document.querySelector('#billetFin .bf-objectif .bf-note');if(p)p.innerHTML=`<b>Objectif 7 jours : jour ${n} sur 7.</b> Je garde ta place demain.`}
/* =====================================================================
   LA MISSION DU JOUR (24/10, l'auteur : « les consignes ne servent pas à grand-chose », option B retenue) : une seule consigne
   par jour, tirée sur TES lignes au lieu de trois corvées génériques. Chaque matin, le Contrôleur choisit :
   – une ligne délaissée depuis 3 jours ou plus : « Reprends « X » : une gare suffit » ;
   – sinon ta ligne la plus suivie ces deux semaines : « Avance « X » de N gares », un cran au-dessus de ton rythme sur elle ;
   – avec deux lignes ou plus, un jour sur trois, une autre ligne : « Donne une gare à « Y » ».
   La réussir donne un billet de réserve (deux au plus) et une étoile sur le billet du jour au Carnet ; elle compte pour le
   défi du mois (20 missions, moins si le mois commence en route) et sa médaille rare. Non faite, elle disparaît le lendemain,
   sans reproche. Avant le 24/10 : trois consignes génériques (copie directions/transitions-onglets/gare-2d-avant-mission-du-jour.html).
   ===================================================================== */
const MISSIONS_MOIS=20,cibleMois=()=>(S.consMois&&S.consMois.cible)||MISSIONS_MOIS;
const ICO_MISSION='<path d="M12 21s6-5.5 6-10.5a6 6 0 0 0-12 0C6 15.5 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/>';
const dateCle=t=>{const d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const moisCle=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const lignesActives=()=>Object.values(S.personalLines||{}).filter(L=>L&&!L.completed);
const garesDuJour=(L,t=Date.now())=>{const j=jour(t);return (L.stations||[]).filter(x=>jour(x.date)===j).length};
const dernierPassage=L=>Math.max(0,...(L.stations||[]).map(x=>x.date||0));
function rythmeLigne(L){const lim=Date.now()-14*864e5,par={};(L.stations||[]).forEach(x=>{if(x.date>=lim){const j=jour(x.date);par[j]=(par[j]||0)+1}});   // gares par jour roulé sur cette ligne, deux semaines (médiane)
  const v=Object.values(par).sort((a,b)=>a-b);return v.length?v[Math.floor(v.length/2)]:0}
function tirerMission(){const now=Date.now(),A=lignesActives();if(!A.length)return null;
  const h=hasardDe(dateCle(now)*7+3),attente=L=>Math.floor((now-(dernierPassage(L)||L.created||now))/864e5);
  const oubliee=A.filter(L=>(L.stations||[]).length&&attente(L)>=3).sort((a,b)=>attente(b)-attente(a))[0];
  if(oubliee)return {j:jour(now),l:oubliee.id,n:oubliee.name,type:'reprendre',c:1,depuis:attente(oubliee)};
  const recentes=L=>(L.stations||[]).filter(x=>x.date>=now-14*864e5).length;
  const T=A.slice().sort((a,b)=>recentes(b)-recentes(a)||dernierPassage(b)-dernierPassage(a)),P=T[0];
  if(T.length>1&&h()<1/3){const Y=T[1+Math.floor(h()*(T.length-1))];return {j:jour(now),l:Y.id,n:Y.name,type:'autre',c:1}}
  const r=rythmeLigne(P),reste=(new Date(now).setHours(23,59,0,0)-now)/60000;   // jamais une mission déjà impossible à l'heure du tirage (ouverte tard le soir)
  return {j:jour(now),l:P.id,n:P.name,type:r?'avancer':'premiere',c:new Date(now).getHours()>=20?1:Math.max(1,Math.min(4,r+1,Math.floor(reste/(P.interval||25))))}}   // tirée après 20 h : une gare suffit
const texteMission=M=>M.type==='reprendre'?`Reprends « ${M.n} », une gare suffit`:M.type==='autre'?`Donne une gare à « ${M.n} »`
  :M.c>1?`Avance « ${M.n} » de ${M.c} gares`:`Mène « ${M.n} » jusqu’à une gare`;
const valeurMission=M=>{const L=(S.personalLines||{})[M.l];return L?Math.min(M.c,garesDuJour(L)):0};
/* recompte la mission ; accomplie, elle est notée (pour le billet), comptée pour le mois, et le billet de réserve est donné */
function majConsignes(){if(premierLancement())return null;const now=Date.now(),mc=moisCle(now);
  if(!S.mission||S.mission.j!==jour(now)){S.mission=tirerMission();delete S.consignes}
  if(!S.consMois||S.consMois.cle!==mc||!S.consMois.v){const d=new Date(now),reste=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1;
    const deja=S.consMois&&S.consMois.cle===mc?Object.keys(S.consHist||{}).filter(k=>moisCle(jourVersDate(k).getTime())===mc).length:0;   // passage aux missions : les journées complètes du mois comptent
    S.consMois={cle:mc,n:deja,cible:Math.min(MISSIONS_MOIS,Math.max(4,Math.round(reste*2/3))),v:2};sauver()}
  let M=S.mission;
  if(M&&!M.faite){const L=(S.personalLines||{})[M.l];
    if(L&&garesDuJour(L)>=M.c){M.faite=now;M.nouv=1;(S.consHist=S.consHist||{})[M.j]=1;S.consMois.n++;noter('mission',{type:M.type,c:M.c});
      if(gagnerReserve())M.reserve=1;
      if(S.consMois.n>=cibleMois()&&!(S.defis||{})[mc]){(S.defis=S.defis||{})[mc]=now;M.defi=mc;noter('defi-mois',{mois:mc})}
      sauver()}
    else if(!L||L.completed){S.mission=M=tirerMission();sauver()}}   // ligne supprimée ou finie : une autre mission
  majChipConsignes();return M}
function majChipConsignes(){if($('bpied'))majPied()}   // la mission s'affiche au pied du tableau des départs
function montrerConsignes(){if($('go').disabled||H?.busy)return;const M=majConsignes(),W=$('consV'),mc=moisCle(Date.now()),nM=(S.consMois||{}).n||0,reussi=(S.defis||{})[mc];
  const d=new Date(),fin=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate(),f=!!(M&&M.faite),v=M?valeurMission(M):0;
  const L=M&&(S.personalLines||{})[M.l];
  const pourquoi=!M?'Toutes tes lignes sont au terminus. Crée-en une nouvelle, et je te donne une mission demain matin.'
    :f?`« ${esc(M.n)} » a avancé comme prévu. Une nouvelle mission t’attend demain matin.`
    :M.type==='reprendre'?`Elle t’attend depuis ${M.depuis} jours. Une gare, et elle repart.`
    :M.type==='autre'?'Ta ligne principale avance bien. Celle-ci compte aussi.'
    :M.c>1?'Un cran au-dessus de ton rythme sur cette ligne.':'Une gare aujourd’hui, et ta ligne avance.';
  const ctrl=IMG_SERIE['consignes-controleur'];   // le Contrôleur et sa planchette (Codex, CONSIGNES-IMAGES-2026-10-22) ; sans elle, le titre seul
  W.innerHTML=`<div class="bf sans-encoches"><div class="cons-tete"><div><div class="bf-k">Mission du jour · ${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>
    <p class="bf-titre">${!M?'Pas de mission aujourd’hui':f?'Mission accomplie !':'La mission du Contrôleur'}</p></div>${ctrl?`<img class="cons-ctrl" src="${ctrl}" alt="">`:''}</div>
    ${M?`<ul class="cons-liste"><li class="${f?'fait':''}"><span class="cons-ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICO_MISSION}</svg></span>
      <span class="cons-t"><b>${esc(texteMission(M))}</b>${L&&L.goal?`<span class="mis-obj">Objectif : ${esc(L.goal)}</span>`:''}<i class="cons-barre" aria-hidden="true"><i style="width:${Math.round(v/M.c*100)}%"></i></i></span>
      <span class="cons-v">${f?'✓':`${v}/${M.c}`}</span></li></ul>`:''}
    <p class="mis-pourquoi">${pourquoi}</p>
    <div class="cons-mois"><div><b>Défi ${/^[aeiou]/.test(MOIS_NOM[d.getMonth()])?'d’':'de '}${MOIS_NOM[d.getMonth()]}</b><span${reussi?' class="reussi"':''}>${reussi?'Réussi ! ':''}${Math.min(nM,cibleMois())}/${cibleMois()} missions${reussi?'':` · encore ${fin} jour${fin>1?'s':''}`}</span></div>
      <i class="cons-barre" aria-hidden="true"><i style="width:${Math.round(Math.min(1,nM/cibleMois())*100)}%"></i></i></div>
    <div class="cons-reserve"><span class="cons-r-ico">${[0,1].map(k=>`<i class="${k<(S.reserves||0)?'':'vide'}">${reserveHTML(false)}</i>`).join('')}</span><span><b>Billets de réserve : ${S.reserves||0}/${RESERVES_MAX}</b>Une mission accomplie en donne un. Il garde ta série un jour sans trajet : ta lanterne reste en veilleuse.</span></div>
    <p class="bf-note">${reussi?'Le défi du mois est tenu. Chaque mission compte encore pour ta série.':'Chaque mission accomplie compte pour le défi du mois. Au bout : la médaille rare « Le défi du mois ».'}</p>
    ${M&&!f&&L?`<div class="bf-deux"><button type="button" class="bf-autre">Plus tard</button><button type="button" class="bf-ok" data-prendre>Prendre cette ligne</button></div>`:'<button type="button" class="bf-ok">Continuer</button>'}</div>`;
  W.classList.add('on');clic();if(M){delete M.nouv;delete M.defi;delete M.reserve}sauver();noter('mission-vue');
  setTimeout(()=>W.querySelector('.bf-ok')?.focus({preventScroll:true}),80);
  W.onclick=e=>{const pr=e.target.closest('[data-prendre]');
    if(pr){const k=lines.findIndex(x=>x.id===M.l);if(k>=0){sel=k;paintBoard()}}
    if(pr||e.target.closest('.bf-ok,.bf-autre')||e.target===W){W.classList.remove('on');W.innerHTML='';W.onclick=null}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(appliquerReserves())majLanterne();majConsignes()}});   // l'app rouverte le lendemain : la nouvelle mission
if(!window.SERIE_IMAGES||window.SERIE_IMAGES.includes('rare-defi')){const i=new Image();i.onload=()=>MED_PRETES.add('rare-defi');i.src='assets/amis/web/medailles/rare-defi.webp'}   // la médaille peinte par Codex (CONSIGNES-IMAGES-2026-10-22) remplace le dessin dès qu'elle existe
/* la mission dans le billet de fin de trajet : son point se remplit quand elle vient d'être accomplie */
function bandeConsignes(){const M=S.mission;if(!M||M.j!==jour(Date.now()))return '';const v=valeurMission(M),f=!!M.faite;
  const msg=M.defi?`<b>Défi ${/^[aeiou]/.test(MOIS_NOM[new Date().getMonth()])?'d’':'de '}${MOIS_NOM[new Date().getMonth()]} réussi !</b> ${cibleMois()} missions ce mois-ci.`
    :M.nouv?`<b>Mission accomplie !</b> ${M.reserve?'Un billet de réserve pour toi : il gardera ta série un jour sans trajet.':`« ${esc(M.n)} » a avancé comme prévu.`}`
    :f?'':`Mission du jour : ${esc(texteMission(M).replace(/^./,c=>c.toLowerCase()))}${M.c>1?` (${v}/${M.c})`:''}.`;
  if(!msg)return '';
  return `<button type="button" class="bf-cons${M.nouv||M.defi?' complete':''}" data-cons aria-label="Voir la mission du jour"><span class="pts" aria-hidden="true"><i class="${M.nouv?'nouv':''}"></i></span><span>${msg}</span></button>`}
function animerBandeConsignes(B){const M=S.mission,p=B.querySelector('.bf-cons .pts i.nouv');if(!M||!p)return;
  setTimeout(()=>{if(!B.classList.contains('on'))return;p.classList.add('oui');clic();if(!reduce)p.animate([{transform:'scale(.4)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'})},1500);
  setTimeout(()=>{if(B.classList.contains('on')){(M.defi?fanfare:carillon)();secousse([10,40,10])}},1880);
  delete M.nouv;delete M.defi;delete M.reserve;sauver()}

   Six voitures, de l'Omnibus au Grand Express. Chaque lundi : avec des amis, les trois premiers du classement montent d'une voiture ;
   sans ami, il suffit de rouler OBJECTIF_CLASSE km dans la semaine. Une semaine entière sans trajet fait redescendre d'une voiture,

/* Une seule commande de vitesse : départ progressif, freinage avant le quai. */
function creerAllureVoyageur(api){
  const FREINAGE=Number(api.freinage)>0?Number(api.freinage):8,
    DEPART=Number(api.depart)>0?Number(api.depart):4;
  const borner=v=>Math.max(0,Math.min(1,Number(v)||0));
  const doux=p=>{p=borner(p);return p*p*(3-2*p)};
  const calme=()=>typeof api.calme==='function'?api.calme():!!api.calme;
  let vivant=true,taux=borner(api.initial),precedent=api.temps(),commande=null;
  function demander(cible,ms=0){
    if(!vivant)return;
    cible=borner(cible);
    // Un arrêt métier peut précéder le prochain rendu (onglet masqué).
    // Le départ suivant doit repartir du repos même si aucun pas n'a vu la gare.
    if(cible===0&&api.etat()==='gare')taux=0;
    commande={de:taux,cible,debut:api.temps(),duree:Math.max(0,cible>taux?DEPART*1000:Number(ms)||0)};
  }
  function distanceRestante(reste){
    const r=Math.max(0,Number(reste)||0);
    if(r>=FREINAGE)return r-FREINAGE/2;
    const u=r/FREINAGE;return FREINAGE*(u*u*u-.5*u*u*u*u);
  }
  function pas(t){
    if(!vivant)return{vitesse:0,avance:0};
    const dt=Math.max(0,Math.min(.25,(t-precedent)/1000));precedent=t;
    const avant=taux;
    let candidat=commande?commande.de+(commande.cible-commande.de)*doux(commande.duree?(t-commande.debut)/commande.duree:1):taux;
    const etat=api.etat();
    if(etat==='route')candidat=Math.min(candidat,doux(Math.max(0,api.reste())/FREINAGE));
    if(etat==='gare')candidat=0;
    taux=calme()?0:borner(candidat);
    return{vitesse:taux,avance:calme()||etat==='gare'?0:(avant+taux)*.5*dt};
  }
  return{demander,pas,distanceRestante,vitesse:()=>taux,
    suspendre(t){precedent=t},cleanup(){vivant=false;commande=null},
    diagnostic:()=>({vitesse:taux,freinage:FREINAGE,depart:DEPART,commande:commande?{...commande}:null})};
}

/* Un quai continu, détouré : le paysage du voyage reste visible derrière. */
function installerGareVoyageur(api){
  const ANTICIPATION=Number(api.anticipation)||16,MINIMUM=Number(api.minimumApproche)||12,
    FREINAGE=Number.isFinite(Number(api.distanceFreinage))?Math.max(0,Number(api.distanceFreinage)):1.3,ENTREE=1.02;

  // Son alpha natif laisse passer le biome, sans champs rapportés ni fondu vertical.
  function choisir(type){

    typeGare=type;prete=true;return true;
  }
  function charger(type){
    if(promesses[type])return promesses[type];

    return promesses[type]=(async()=>{
    const ref=await api.imageReady(src);if(!vivant)return null;

    const echelle=type==='grande'?.72:1;

    Object.assign(im.style,{position:'absolute',top:type==='grande'?'31.4%':'12.5%',height:echelle*100+'%',maxWidth:'none',transform:'none'});

      retourCache=etat==='gare'&&prete&&vitesse()>.001;
      // Le compteur métier continue hors écran, la distance visuelle reste figée.
      // Recaler seulement au retour : aucun saut pendant une arrivée visible.

    diagnostic:()=>({prete,echec,phase:etape,ignoree:ignorer,type:typeGare,origineEnAttente:origine,attenteDepart:attendDepart(),sources:[...sources],

  ['personalLines','set','gvKm','cpt','tampons','medaillesRares','invitations'].forEach(k=>{if(etat[k]!=null&&!objet(etat[k]))etat[k]={}});
  ['log','trajets','incidents','amis','cartes','aRemettre','sauvetages'].forEach(k=>{if(etat[k]!=null&&!Array.isArray(etat[k]))etat[k]=[]});
  ['log','trajets','incidents','amis','cartes','aRemettre'].forEach(k=>{if(etat[k])etat[k]=etat[k].filter(objet)});
  Object.entries(etat.personalLines||{}).forEach(([id,L])=>{
    if(!objet(L)){delete etat.personalLines[id];return}
    L.id=L.id||id;L.name=String(L.name||'Ligne');L.goal=String(L.goal||'');
    if(!Number.isFinite(L.interval)||L.interval<2||L.interval>180)L.interval=25;
    if(!Array.isArray(L.stations))L.stations=[];else L.stations=L.stations.filter(objet);
  });
  if(etat.name!=null)etat.name=String(etat.name);
  if(etat.coop&&(!objet(etat.coop)||!Array.isArray(etat.coop.passagers)||!etat.coop.passagers.some(p=>objet(p)&&p.moi&&p.aBord)))delete etat.coop;
  if(etat.coop){etat.coop.passagers=etat.coop.passagers.filter(p=>objet(p)&&Number.isInteger(p.place)&&p.place>=1&&p.place<=8);if(!Number.isFinite(etat.coop.interval)||etat.coop.interval<2||etat.coop.interval>180)etat.coop.interval=25}
  if(avantReparation!==JSON.stringify(etat)){try{localStorage.setItem(CLE+'-recuperation',JSON.stringify(corps))}catch(e){}}
  const a=etat.activeRide,L=a&&etat.personalLines&&etat.personalLines[a.lineId];
  const recent=Number.isFinite(a?.t0)&&a.t0<=Date.now()&&(Date.now()-a.t0)<12*36e5;
  const enRoute=recent&&a.phase!=='frein'&&((a.personal&&L&&!L.completed)||(a.coop&&etat.coop));
  const ecran=['gare','trajet'].includes(nav?.ecran)?nav.ecran:(enRoute?'trajet':'gare'),params=nav&&nav.params||{};
  if(ecran==='trajet'&&!params.ligne&&a){if(a.coop)params.coop=1;else params.ligne=a.lineId}
  let minuterie=null,file=Promise.resolve(),dernierDistant=null,ecritureDistante=false,scope=null,navigation=0;
  function persister(){const c={etat:clone(H.etat),nav:H.nav,maj:Date.now()};
    try{localStorage.setItem(CLE,JSON.stringify(c))}catch(e){}
    try{window.name='horligne:'+JSON.stringify(c)}catch(e){}
    if(!ref)return Promise.resolve();dernierDistant=c;
    if(!ecritureDistante){ecritureDistante=true;
      file=(async()=>{try{while(dernierDistant){const suivant=dernierDistant;dernierDistant=null;try{await ref.set(suivant)}catch(e){}}}
        finally{ecritureDistante=false}})()}
    return file}
  // Chaque écran possède ses propres minuteries, écouteurs et animations.
  // Les callbacks de l'ancien écran ne peuvent plus modifier le nouvel écran.
  function install(s){
    window.setTimeout=(fn,ms,...args)=>{const id=native.timeout(()=>{s.timers.delete(id);if(!s.dead&&typeof fn==='function')fn(...args)},ms);s.timers.add(id);return id};
    window.setInterval=(fn,ms,...args)=>{const id=native.interval(()=>{if(!s.dead)fn(...args)},ms);s.intervals.add(id);return id};
    window.requestAnimationFrame=fn=>{const id=native.raf(t=>{s.frames.delete(id);if(!s.dead)fn(t)});s.frames.add(id);return id};
    window.clearTimeout=id=>{s.timers.delete(id);native.clearTimeout(id)};
    window.clearInterval=id=>{s.intervals.delete(id);native.clearInterval(id)};
    window.cancelAnimationFrame=id=>{s.frames.delete(id);native.cancelFrame(id)};
    EventTarget.prototype.addEventListener=function(type,fn,options){native.add.call(this,type,fn,options);s.listeners.push([this,type,fn,options])};
    window.MutationObserver=class extends native.Observer{constructor(fn){super((...args)=>{if(!s.dead)fn(...args)});s.observers.push(this)}};
  }
  function dispose(){if(!scope)return;scope.dead=true;
    scope.cleanups.forEach(fn=>{try{fn()}catch(e){}});
    scope.timers.forEach(clearTimeout);scope.intervals.forEach(clearInterval);scope.frames.forEach(cancelAnimationFrame);
    scope.listeners.forEach(([t,k,f,o])=>native.remove.call(t,k,f,o));scope.observers.forEach(o=>o.disconnect());
    document.querySelectorAll('#app').forEach(e=>e.getAnimations({subtree:true}).forEach(a=>a.cancel()));
    document.getElementById('hote-ecran')?.remove();document.body.className='';
  }
  function mount(name,p){dispose();scope={dead:false,timers:new Set(),intervals:new Set(),frames:new Set(),listeners:[],observers:[],cleanups:[]};
    H.params=p||{};H.ecran=name;H.instance=(H.instance||0)+1;H.test=null;install(scope);
    document.documentElement.classList.toggle('calme',!!H.etat.set?.calme);
    const root=document.createElement('div');root.id='hote-ecran';root.style.display='contents';
    root.appendChild(document.getElementById('ecran-'+name).content.cloneNode(true));document.body.appendChild(root);
    ECRANS[name]();gestionFocus();H.nav=null;persister();
  }
  function gestionFocus(){let active=null,retour=null;
    const visibles=()=>[...document.querySelectorAll('#app [role="dialog"].on')]
      .filter(p=>!['amis','coop','reglages','quaiCoop'].includes(p.id)&&!(p.id==='carnet'&&p.classList.contains('onglet-page')))
      .sort((a,b)=>(parseInt(getComputedStyle(b).zIndex)||0)-(parseInt(getComputedStyle(a).zIndex)||0));
    const update=()=>{const prochain=visibles()[0]||null;
      document.querySelectorAll('#app [role="dialog"].on').forEach(p=>{
        p.inert=!!prochain&&p!==prochain&&!p.contains(prochain);p.setAttribute('aria-hidden',String(p.inert));
      });
      const nav=document.querySelector('#app nav');if(nav)nav.inert=!!prochain||!!H.busy||!!document.getElementById('go')?.disabled;
      const gare=document.getElementById('vueGare');if(gare)gare.inert=!!prochain||document.body.classList.contains('ailleurs');
      if(H.ecran==='trajet')document.querySelectorAll('#stage,#salon,.dock').forEach(p=>p.inert=!!prochain);
      if(prochain===active){if(active&&!active.contains(document.activeElement))active.querySelector('button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex="0"]')?.focus({preventScroll:true});return}
      if(active&&!['abo','pub','sauvetage'].includes(active.id))active.removeAttribute('aria-modal');
      if(prochain){if(!active)retour=document.activeElement;active=prochain;active.setAttribute('aria-modal','true');
        const cible=active.querySelector('button:not([disabled]),input,select,[tabindex="0"]');
        if(cible)cible.focus({preventScroll:true});else{active.tabIndex=-1;active.focus({preventScroll:true})}
      }else{active=null;if(retour?.isConnected&&!retour.closest('[inert]'))retour.focus({preventScroll:true});retour=null}
    };
    const observer=new MutationObserver(update);
    document.querySelectorAll('#app [role="dialog"]').forEach(p=>observer.observe(p,{attributes:true,attributeFilter:['class'],childList:true}));
    document.addEventListener('keydown',e=>{if(e.key!=='Tab'||!active)return;
      const boutons=[...active.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex="0"]')].filter(b=>b.getClientRects().length&&!b.closest('[inert]'));
      if(!boutons.length){e.preventDefault();return}
      const premier=boutons[0],dernier=boutons.at(-1);
      if(e.shiftKey&&(document.activeElement===premier||!active.contains(document.activeElement))){e.preventDefault();dernier.focus()}
      else if(!e.shiftKey&&(document.activeElement===dernier||!active.contains(document.activeElement))){e.preventDefault();premier.focus()}
    });update();
  }
  const ready=new Map();
  function imageReady(src){if(ready.has(src))return ready.get(src);const p=new Promise((resolve,reject)=>{const im=new Image();let timer;
    const finir=(erreur)=>{native.clearTimeout(timer);im.onload=im.onerror=null;erreur?reject(erreur):resolve(im)};
    timer=native.timeout(()=>finir(new Error('chargement trop long')),8000);im.onload=()=>finir();im.onerror=()=>finir(new Error('image indisponible'));
    im.src=src;if(im.complete&&im.naturalWidth)finir()});ready.set(src,p);p.catch(()=>ready.delete(src));return p}
  async function preload(name){const q=new URLSearchParams(location.search).get('moment'),m=['matin','jour','soir'].includes(q)?q:(h=>h>=6&&h<11?'matin':h>=11&&h<18?'jour':'soir')(new Date().getHours());
    const src=name==='trajet'?(H.etat.coop&&H.nav?.params.coop?`assets/coop/web/salon-${m}-eteint.webp`:`assets/trajet/web/fond-${m}.webp`):`assets/gare/${m}-fond.webp`;
    await imageReady(src);
  }
  const cover=document.createElement('div');cover.id='hote-vapeur';cover.setAttribute('aria-hidden','true');
  Object.assign(cover.style,{position:'fixed',pointerEvents:'none',zIndex:9999,overflow:'hidden',opacity:0,background:'#e7e9e4',borderRadius:'inherit'});
  for(let k=0;k<6;k++){const cloud=document.createElement('i');Object.assign(cloud.style,{position:'absolute',left:(k%2?-45:15)+'%',top:(k*18-25)+'%',width:'140%',height:'65%',borderRadius:'50%',background:'radial-gradient(ellipse,#f3f4ed 20%,#d8e1df 62%,transparent 75%)',filter:'blur(12px)'});cover.appendChild(cloud)}
  document.body.appendChild(cover);
  const delay=ms=>new Promise(r=>native.timeout(r,ms));
  const H={etat,params,nav:null,ecran,
    onExit(fn){scope?.cleanups.push(fn)},
    diagnostics(){return {ecran:H.ecran,busy:!!H.busy,timers:scope.timers.size,intervals:scope.intervals.size,frames:scope.frames.size}},
    imageReady,
    sauver(S){H.etat=S;clearTimeout(minuterie);minuterie=native.timeout(persister,500)},
    async aller(name,p){if(H.busy||!['gare','trajet'].includes(name))return;H.busy=true;const id=++navigation;clearTimeout(minuterie);H.nav={ecran:name,params:p||{}};
      try{await preload(name)}catch(e){H.nav=null;H.busy=false;document.getElementById('go')?.removeAttribute('disabled');document.body.classList.remove('boarding');
        const bar=document.querySelector('nav');if(bar)bar.inert=false;
        const msg=document.getElementById('toast');if(msg){msg.textContent='Le wagon ne charge pas. Réessaie dans un instant.';msg.classList.add('on')}return}
      // Sauvegarde avant le raccord ; aucun rechargement ni double démarrage du trajet.
      await Promise.race([persister(),delay(3000)]);if(id!==navigation)return;
      const rect=document.getElementById('app').getBoundingClientRect();Object.assign(cover.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',borderRadius:getComputedStyle(document.getElementById('app')).borderRadius});
      const calme=matchMedia('(prefers-reduced-motion:reduce)').matches||document.documentElement.classList.contains('calme');
      const ms=calme?120:450;cover.style.opacity='1';
      if(!calme)[...cover.children].forEach((c,k)=>c.animate([{transform:`translate(${k%2?-32:32}%,24%) scale(.8)`},{transform:`translate(${k%2?22:-22}%,-28%) scale(1.3)`}],{duration:ms*2,easing:'ease-out'}));
      try{
        await cover.animate([{opacity:0},{opacity:1}],{duration:ms,easing:'ease-in-out',fill:'forwards'}).finished;
        mount(name,p);cover.getAnimations().forEach(a=>a.cancel());cover.style.opacity='1';
        await cover.animate([{opacity:1},{opacity:0}],{duration:ms,easing:'ease-out',fill:'forwards'}).finished;
      }catch(e){
        H.nav=null;const msg=document.getElementById('toast');
        if(msg){msg.textContent='Le passage a été interrompu. Réessaie.';msg.classList.add('on')}
        console.error('Horligne : passage interrompu',e);
      }finally{
        cover.getAnimations({subtree:true}).forEach(a=>a.cancel());cover.style.opacity='0';H.busy=false;
        if(H.ecran==='gare'){document.getElementById('go')?.removeAttribute('disabled');const bar=document.querySelector('nav');if(bar)bar.inert=false;document.body.classList.remove('boarding')}
      }
    }};
  window.HORLIGNE=H;
  // Sauvegarde synchrone locale avant fermeture ou passage en arrière-plan.
  native.add.call(window,'pagehide',()=>{native.clearTimeout(minuterie);persister()});
  native.add.call(document,'visibilitychange',()=>{if(document.hidden){native.clearTimeout(minuterie);persister()}});
  mount(ecran,params);
  const w=document.getElementById('hote-attente');w.style.opacity=0;w.style.pointerEvents='none';native.timeout(()=>w.remove(),300);
})();

</script>
