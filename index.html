/* les tableaux à palettes (classement, arrivées) : le même objet que le tableau des départs ; le cadre de ChatGPT le remplacera (B01, B02) */
.tbl-pal{position:relative;border-radius:10px;padding:6px 7px 5px;background:linear-gradient(180deg,#131812,#0b0e0a);border:2px solid #6b5326;
  box-shadow:inset 0 0 0 2px #1d2219,inset 0 4px 12px rgba(0,0,0,.7),0 10px 26px rgba(0,0,0,.5)}
.tbl-pal::before{content:'';position:absolute;inset:-3px;border-radius:11px;pointer-events:none;
  background:radial-gradient(circle at 5px 5px,#e8c46a 0 2.6px,transparent 3.2px),radial-gradient(circle at calc(100% - 5px) 5px,#e8c46a 0 2.6px,transparent 3.2px),
    radial-gradient(circle at 5px calc(100% - 5px),#e8c46a 0 2.6px,transparent 3.2px),radial-gradient(circle at calc(100% - 5px) calc(100% - 5px),#e8c46a 0 2.6px,transparent 3.2px)}
.tbl-pal{border:9px solid transparent;border-image:url(assets/amis/web/tableau-cadre.webp) 32 / 9px stretch;border-radius:0;background-clip:padding-box}   /* le cadre de ChatGPT (B01) : laiton, coins rivetés */
.tbl-pal::before{display:none}
.tp-tete{display:flex;justify-content:space-between;gap:8px;padding:3px 4px 7px;font:800 10.5px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#e8a75c}
.cl-l{display:grid;grid-template-columns:38px 40px minmax(0,1fr) auto auto 12px;align-items:center;gap:7px;min-height:52px;padding:5px 4px;border-radius:6px;cursor:pointer}
.cl-l+.cl-l{border-top:1px solid rgba(255,255,255,.05)}
.cl-l.moi{background:rgba(232,167,92,.15)}
.cl-l:focus-visible{outline:2px solid var(--amber-hi);outline-offset:1px}
.rg{font:800 14px ui-monospace,Menlo,monospace;color:#e8a75c;text-align:center}
.cl-nom{display:flex;align-items:center;gap:6px;min-width:0}
.coopc{flex:none;min-height:26px;padding:0 8px;border-radius:99px;background:#e8a75c;color:#1a1206;font:900 9px var(--sans);letter-spacing:.14em}
/* les plaques de classe (1re or, 2e argent, 3e bronze) : les plaques de ChatGPT (P01 à P03), le rang écrit sur l'émail */
.plaque{display:inline-flex;align-items:center;justify-content:center;justify-self:center;min-width:28px;height:18px;padding:0 3px;border-radius:3px;background:linear-gradient(#fbf6ea,#ece2cc);
  color:#1f2b55;font:700 11.5px/1 var(--serif);box-shadow:0 0 0 2px var(--metal),0 0 0 3px rgba(0,0,0,.45),0 2px 3px rgba(0,0,0,.4)}
.plaque sup{font-size:.62em;margin-left:1px}
.plaque.or{--metal:#d9b25a}.plaque.argent{--metal:#c3cad2}.plaque.bronze{--metal:#b5773a}
.plaque.grande{min-width:46px;height:27px;font-size:17px;box-shadow:0 0 0 3px var(--metal),0 0 0 4px rgba(0,0,0,.4),0 3px 5px rgba(0,0,0,.35)}
/* en « 9 tranches » : le cadre de métal et ses vis ne se déforment pas, quelle que soit la taille */
.plaque{min-width:0;width:40px;height:19px;padding:0;border:5px solid transparent;border-radius:0;box-shadow:none;background:none;border-image:url(assets/amis/web/plaque-or.webp) 16 fill stretch;filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.45));font-size:10.5px}
.plaque.argent{border-image-source:url(assets/amis/web/plaque-argent.webp)}.plaque.bronze{border-image-source:url(assets/amis/web/plaque-bronze.webp)}
.plaque.grande{width:74px;height:27px;border-width:6px;font-size:15px;box-shadow:none}
/* les médailles de profil : émail et laiton (formes provisoires en SVG) */
.med{--t:40px;--anneau:#d9b25a;position:relative;flex:none;display:inline-grid;place-items:center;width:var(--t);height:var(--t);border-radius:50%;color:var(--motif);
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.42),rgba(255,255,255,0) 38%),radial-gradient(circle at 62% 76%,rgba(0,0,0,.22),rgba(0,0,0,0) 60%),var(--email);
  box-shadow:inset 0 0 0 calc(var(--t)*.085) var(--anneau),inset 0 0 0 calc(var(--t)*.11) rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.45)}
.med svg{width:56%;height:56%;fill:currentColor;filter:drop-shadow(0 .5px .5px rgba(0,0,0,.35))}
.med.rare{--anneau:var(--metal,#e6c45a);box-shadow:inset 0 0 0 calc(var(--t)*.11) var(--anneau),inset 0 0 0 calc(var(--t)*.135) rgba(0,0,0,.3),0 0 0 calc(var(--t)*.03) rgba(255,232,170,.4),0 1px 4px rgba(0,0,0,.5)}
.med.rare::before{content:'';position:absolute;inset:calc(var(--t)*.022);border-radius:50%;border:calc(var(--t)*.035) dotted rgba(70,48,8,.6)}   /* la couronne de laurier, en attendant l'image */
.med.vide{--email:#2b2219;--anneau:#8a6b3a}
.med.verrou{filter:grayscale(.85) brightness(.45)}
.med.img{background:none;box-shadow:none}.med.img img{width:100%;height:100%;object-fit:contain}
.med .voyant{position:absolute;right:-2px;top:-2px;width:30%;height:30%;min-width:9px;min-height:9px;border-radius:50%;background:#ffbe5c;border:2px solid #1a1206;
  box-shadow:0 0 8px 2px rgba(255,180,70,.75);animation:voyant 1.6s ease-in-out infinite alternate}
@keyframes voyant{from{opacity:.6}to{opacity:1}}
/* les fenêtres par-dessus la page : fiche d'un ami, écrin des médailles, choix des tampons, invitations du quai */
.modale{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
  background:rgba(3,6,14,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modale.on{display:flex}
.mod-boite{position:relative;width:min(100%,420px);max-height:100%;overflow:auto;padding:16px 16px 14px;border-radius:20px;background:linear-gradient(180deg,#24170d,#150d07);
  border:1px solid rgba(255,217,161,.2);box-shadow:0 20px 60px rgba(0,0,0,.6);color:var(--ink)}
.mod-boite .k{font:900 11px var(--sans);letter-spacing:.2em;color:var(--amber);margin-right:48px}
.mod-boite h2{font:italic 500 23px/1.15 var(--serif);color:var(--cream);margin:4px 44px 10px 0}
.mod-boite .croix{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 26px/1 var(--sans);color:var(--amber-hi);background:rgba(255,255,255,.06)}
.fa-retirer{display:block;margin:12px auto 0;min-height:44px;padding:0 14px;border-radius:10px;font:800 12px var(--sans);color:#ffb3a3}
.fa-retirer.sur{background:#c9443a;color:#fff}
/* la carte d'un ami, posée seule (07/10, choix de l'auteur) : on la retourne d'un toucher ; au dos, sa semaine (jamais ses freins : seulement du positif) */
.fa-seule{width:min(100%,400px);display:flex;flex-direction:column;align-items:center;gap:10px;perspective:1400px}
.fa-seule>.croix{align-self:flex-end;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 26px/1 var(--sans);color:var(--amber-hi);background:rgba(255,255,255,.08)}
.fa-flip{position:relative;width:100%;aspect-ratio:1000/604;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.45,.05,.25,1);cursor:pointer;rotate:-1.2deg}
.fa-flip.retournee{transform:rotateY(180deg)}
.fa-face,.fa-dos{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fa-face .abo{box-shadow:0 16px 34px rgba(0,0,0,.55)}
.fa-dos{transform:rotateY(180deg)}
.dos-carte{position:absolute;inset:0;container-type:inline-size;border-radius:2.4cqw;padding:6% 7% 5%;color:#3a2a1a;
  background:url(assets/carnet/web/page.webp) center/cover,#f3e8d3;box-shadow:0 16px 34px rgba(0,0,0,.55);
  display:grid;grid-template-columns:1fr 1.3fr;grid-template-rows:auto auto 1fr;column-gap:7%}
.dc-t{font:3.8cqw var(--imp);letter-spacing:.22em;text-transform:uppercase;color:#6b5236}
.dc-total{font:400 11cqw/1.05 var(--imp);margin-top:2%}
.dc-tenus{align-self:end;font:500 5.4cqw/1.15 var(--main);color:#5d4a36}
.dc-barres{grid-column:2;grid-row:1/4;display:flex;gap:3%;align-items:stretch}
.dc-barres span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3cqw}
.dc-barres i{width:100%;border:.35cqw solid #3a2a1a;border-bottom:0;border-radius:.4cqw .6cqw 0 0;background:repeating-linear-gradient(135deg,rgba(58,42,26,.55) 0 .4cqw,transparent .4cqw 1.6cqw)}
.dc-barres b{font:3.6cqw/1 var(--imp);border-top:.3cqw solid #3a2a1a;width:100%;text-align:center;padding-top:1cqw}
.fa-aide{font:italic 15px var(--imp);color:#e9dcc6;margin:0}
.fa-act2{display:flex;gap:10px}
.fa-act2 button{min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid rgba(255,217,161,.35);font:italic 17px var(--imp);color:#f6ead2}
/* l'écrin de velours : choisir sa médaille (l'image de ChatGPT, A03) */
.ec-dit{min-height:36px;font:700 12.5px/1.45 var(--sans);color:#d2c1a5;margin:0 0 8px}
.ecrin{margin:2px 0 12px;padding:12px 6px;border-radius:12px;border:7px solid #4a2c17;
  box-shadow:inset 0 0 0 1px #c9a24c,inset 0 6px 18px rgba(0,0,0,.55),0 6px 16px rgba(0,0,0,.4);background:radial-gradient(ellipse at 30% 15%,#2a3c70,#17224a 60%,#101833)}
.ecrin{border:0;padding:9% 8%;border-radius:4px;background:url(assets/amis/web/ecrin.webp) center/100% 100%;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.ecrin-grille{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px}
.ec{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;padding:5px 0;border-radius:10px}
.ec small{font:800 9.5px/1.15 var(--sans);color:#d8deef;text-align:center}
.ec.on{background:rgba(255,217,161,.13)}.ec.on .med{outline:2.5px solid #ffd9a1;outline-offset:3px}
.ec.verrou small{color:#8b93ab}
.mod-boite .fiche-act button:disabled{opacity:.5}
/* choisir un tampon pour sa carte : une feuille du carnet */
.mod-papier{width:min(100%,380px);max-height:100%;overflow:auto;padding:18px 14px 12px;border-radius:4px 9px 6px 4px;color:#3a2a1a;text-align:center;
  background:url(assets/carnet/web/page.webp) center/100% 100%,#f3e8d3;box-shadow:0 16px 34px rgba(0,0,0,.55)}
.mod-papier .rubrique{font:13px var(--imp);letter-spacing:.24em;text-transform:uppercase;color:#6b5236}
.mod-papier h3{font:italic 400 24px/1.1 var(--imp);margin:2px 0 12px}
/* la carte d'abonné (le profil) : dessinée en code en attendant celle de ChatGPT (A01) ; mêmes places pour le texte */
.abo{position:relative;display:block;width:100%;aspect-ratio:3/2;container-type:inline-size;border-radius:2.4cqw;overflow:hidden;color:#1f2b55;text-align:left;
  background:radial-gradient(ellipse 80% 70% at 30% 20%,#fcf7ea,#f0e5cc 70%,#e5d4b0);box-shadow:0 3px 10px rgba(30,18,6,.4)}
.abo.img{background:url(assets/amis/web/carte-abonne.webp) center/100% 100%}
.abo-cadre{position:absolute;inset:2.6cqw;border-radius:1.4cqw;border:1.1cqw double #2b3a6b;box-shadow:inset 0 0 0 .55cqw #f3ead6,inset 0 0 0 .85cqw #c9a14a}
.abo.img .abo-cadre,.abo.img .abo-trou{display:none}
.abo-titre{position:absolute;left:6.5%;right:6.5%;top:7%;height:10.5%;display:grid;place-items:center;background:#2b3a6b;color:#f3ead6;font:3.9cqw/1 var(--imp);letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}
.abo.img .abo-titre{background:none}
.abo-trou{position:absolute;right:3.4%;top:3.4%;width:4.4%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#2a1d12 52%,#7a6142 66%,transparent 70%)}
.abo-med{position:absolute;left:8.5%;top:22%;width:27%;height:27cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;padding:0;line-height:0;
  box-shadow:0 0 0 .45cqw #2b3a6b,0 0 0 1.05cqw #f3ead6,0 0 0 1.45cqw #2b3a6b}
.abo-nom{position:absolute;left:6.5%;width:31%;top:67%;height:12.5%;display:block;border:.35cqw solid #2b3a6b;border-radius:.8cqw;padding:0 1cqw;
  font:700 6.2cqw/7.6cqw var(--main);color:#1f2b55;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abo-lignes{position:absolute;left:41%;right:6.5%;top:21%;height:43%;display:grid;grid-template-rows:repeat(4,1fr)}
.abo-lignes span{display:block;align-self:end;min-width:0;padding-bottom:.4cqw;border-bottom:.3cqw solid rgba(43,58,107,.45);
  font:700 4.6cqw/1.25 var(--main);color:#1f2b55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abo-tps{position:absolute;left:41%;right:6.5%;top:69%;height:21%;display:flex;gap:4%}
.abo-tps>*{position:relative;flex:1;display:grid;place-items:center;border:.35cqw solid #2b3a6b;border-radius:.7cqw;background:rgba(255,255,255,.22)}
.abo-tps .tp-img{width:90%;height:90%;background:center/contain no-repeat;mix-blend-mode:multiply;rotate:-7deg}
.abo-tps b{position:absolute;left:50%;top:70%;translate:-50% -50%;font:3.2cqw/1 var(--imp);color:#b3302a}
/* la carte imprimée de ChatGPT (A01) : ses proportions (1000 × 604) et ses zones mesurées sur l'image ; les cadres dessinés en code s'effacent */
.abo.img{aspect-ratio:1000/604}
.abo.img .abo-titre{top:7.8%;height:10.1%}
.abo.img .abo-med{left:11.1%;top:28.1%;width:24%;height:24cqw;box-shadow:none}   /* une hauteur explicite : un <button> ne respecte pas aspect-ratio */
.abo.img .abo-nom{left:8%;width:30.6%;top:74%;height:10.6%;border:0;font-size:5.4cqw;line-height:6.4cqw}
.abo.img .abo-lignes{left:44.5%;right:8%;top:23.7%;height:37.6%}
.abo.img .abo-lignes span{border-bottom:0;padding-bottom:.6cqw}
.abo.img .abo-tps{left:45.8%;right:7.1%;top:67.2%;height:23%;gap:3.2%}
.abo.img .abo-tps>*{border:0;background:none}
/* 25/10 : la grande carte du Profil (1000 × 1320, outils/carte-grande.py) ; positions = sa DISPO en % (x / 1000, y / 1320), tailles en cqw (= 10 px de carte) */
.abo-g{position:relative;display:block;width:100%;aspect-ratio:1000/1320;container-type:inline-size;overflow:hidden;border-radius:3cqw;color:#1f2b55;text-align:left;
  background:url(assets/carnet/web/carte-grande.webp) center/100% 100%,#efe2c4;box-shadow:0 3px 10px rgba(30,18,6,.42)}
.abo-g.or{background:url(assets/carnet/web/carte-grande-or.webp) center/100% 100%,#d9ad45;box-shadow:0 0 0 1.5px rgba(255,227,161,.75),0 0 26px rgba(242,200,107,.35),0 3px 10px rgba(30,18,6,.42)}
.abo-g.or::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,250,230,.42) 50%,transparent 62%);translate:-130% 0;animation:aboBrille 6s 1.5s infinite;pointer-events:none}
.ag-titre{position:absolute;left:5.8%;right:12%;top:3.56%;height:4.62%;display:grid;place-items:center;color:#f3ead6;font:3.9cqw/1 var(--imp);letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}
.ag-med{position:absolute;left:11.1%;top:14.77%;width:24%;height:24cqw;border-radius:50%;display:grid;place-items:center;padding:0;line-height:0}
.ag-nom{position:absolute;left:8%;width:30.6%;top:35.76%;height:4.85%;display:block;padding:0 1cqw;font:700 5.4cqw/6.4cqw var(--main);color:#1f2b55;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-lignes{position:absolute;left:44.5%;right:8%;top:12.73%;height:17.2%;display:grid;grid-template-rows:repeat(4,1fr)}
.ag-lignes>span{display:block;align-self:end;min-width:0;padding-bottom:.6cqw;font:700 4.5cqw/1.25 var(--main);color:#1f2b55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-rub{position:absolute;left:8%;right:8%;display:grid;place-items:center;font:3.1cqw/1 var(--imp);letter-spacing:.3em;text-transform:uppercase;color:#2b3a6b}
.ag-rub.r1{top:41.6%;height:3.4%}.ag-rub.r2{top:78.4%;height:2.8%}
.ag-case{position:absolute;width:42%;height:9.85%;display:grid;grid-template-columns:6.4cqw 1fr;align-items:center;column-gap:1.8cqw;padding:0 1.8cqw 0 2.6cqw;min-width:0}
.ag-case.c0,.ag-case.c2,.ag-case.c4{left:7.2%}.ag-case.c1,.ag-case.c3,.ag-case.c5{left:50.8%}
.ag-case.c0,.ag-case.c1{top:45.45%}.ag-case.c2,.ag-case.c3{top:56.36%}.ag-case.c4,.ag-case.c5{top:67.27%}
.ag-case svg{width:6.4cqw;height:6.4cqw;fill:none;stroke:#2b3a6b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ag-case>span{min-width:0}
.ag-case b{display:block;font:700 6.6cqw/1 var(--main);color:#1f2b55;white-space:nowrap}
.ag-case b small{font-size:3.8cqw}
.ag-case span span{display:block;margin-top:.4cqw;font:3.7cqw/1.1 var(--imp);color:#3b4770;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-tp{position:absolute;top:81.67%;width:14.6%;height:10.6%;display:grid;place-items:center;padding:0}
.ag-tp.t0{left:25.1%}.ag-tp.t1{left:42.7%}.ag-tp.t2{left:60.3%}
.ag-tp .tp-img{width:86%;height:86%;background:center/contain no-repeat;mix-blend-mode:multiply;rotate:-7deg}
.ag-tp b{position:absolute;left:50%;top:72%;translate:-50% -50%;font:3.2cqw/1 var(--imp);color:#b3302a}
.pf.grande{width:100%;margin-top:2px;rotate:-.8deg}
.pf.grande~.pf-aide{margin-top:4px}
.pf.grande~.pf-progres{margin-top:0}
/* dans le carnet, onglet Profil : la carte glissée dans quatre coins photo */
.pf{position:relative;width:88%;margin:4px auto 2px;rotate:-1.3deg}
.pf .coin{position:absolute;width:9.5%;aspect-ratio:1;background-position:center;background-size:contain;background-repeat:no-repeat;z-index:2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.pf-aide{font:500 14px/1.15 var(--main);color:#5d4a36;text-align:center;margin:3px 0 0;mix-blend-mode:multiply}
/* la remise : une médaille rare, les résultats du lundi */
.rm-med{display:grid;place-items:center;margin:12px 0 6px}
.rm-nom{font:italic 400 22px var(--imp);margin:0}
.rm-deux{display:flex;justify-content:center;gap:14px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:12px 0 6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px}
.pod b{font:italic 400 18px var(--imp)}
.pod small{font:500 16px var(--main);color:#5d4a36}
.pod.p1{order:2;margin-bottom:14px}.pod.p2{order:1}.pod.p3{order:3}
/* une invitation dans le train d'un ami : un billet */
/* à la gare : l'invitation d'un ami s'annonce comme un train régulier */
#invitation{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;padding:9px 9px 9px 14px;border-radius:14px;
  background:rgba(20,12,6,.9);border:1px solid rgba(232,167,92,.45);font:800 12.5px/1.35 var(--sans);color:var(--amber-hi)}
#invitation[hidden]{display:none}
#invitation span{flex:1 1 100%}
#invitation button{flex:1}
#invitation button{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(255,217,161,.3);font:800 12px var(--sans);color:var(--amber-hi)}
#invitation #invOui{background:var(--amber);border-color:var(--amber);color:#1a1206}
.iq-btn{flex:none;min-height:40px;padding:0 14px;border-radius:10px;background:var(--amber);color:#1a1206;font:800 12px var(--sans)}
.feuilleG .note{font:700 12px/1.5 var(--sans);color:#9a8a76;margin-top:6px}
.feuilleG .note .code{font:800 15px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--amber-hi)}
.ami{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:8px 2px;text-align:left;border-bottom:1px solid rgba(255,217,161,.08)}
.ami b{display:block;font:italic 500 18px var(--serif);color:var(--cream)}
.ami small{display:block;font:700 12px var(--sans);color:#9a8a76;margin-top:2px}
.ami i{font:800 12px var(--sans);font-style:normal;color:var(--amber-hi);white-space:nowrap}
.ami i.rate{color:#ffb3a3}.ami:disabled{opacity:.55}
.feuilleG select{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(255,217,161,.2);background:rgba(255,255,255,.05);color:var(--cream);font:700 16px var(--sans)}
#coopCodeZone[hidden]{display:none}
/* le quai Coop : le tableau à palettes et le choix de son objet (formes provisoires en attendant les images) */
/* ---------- la page Coop (06/10, son propre onglet ; choix de l'auteur) : la voiture-salon, Charbon, les billets de groupe ----------
   Rien de commun avec les Amis : pas de hall, pas de tableau à palettes, du vert velours au lieu de l'ambre. */
#coop{top:0;max-height:none;border-radius:0;padding:0;overflow:hidden;border-top:0;background:#1b100b;--fond-billet:#1b100b}
/* 09/10 (l'auteur) : le salon reste en haut de la page ; seuls les billets défilent, et ils passent sous le bord du décor, jamais dessus */
#coop .c-defile{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;padding:0 14px}
#coopCorps{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -14px;padding:0 14px 30px}
/* le fondu (09/10, l'auteur : « la coupure est très sèche ») : en défilant, la liste s'efface doucement en arrivant sous le décor.
   Il grandit avec le défilement (fondre(), 64 px au plus) : tout en haut, pas de fondu, le premier titre reste net */
#amisCorps,#coopCorps{-webkit-mask-image:linear-gradient(transparent,rgba(0,0,0,.55) calc(var(--fondu,0px) * .5),#000 var(--fondu,0px));mask-image:linear-gradient(transparent,rgba(0,0,0,.55) calc(var(--fondu,0px) * .5),#000 var(--fondu,0px))}
#coop .c-haut{position:relative;flex:none;z-index:3;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 -14px;padding:max(12px,env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg,rgba(27,16,11,.97),rgba(27,16,11,.9) 75%,rgba(27,16,11,0))}
#coop .c-haut .croix{position:static;flex:none}
#coop .k{color:#e9c879}
#coop h2{margin-bottom:0}
/* le décor (COOP-ACCUEIL de Codex, 09/10 ; outils/coop-accueil.py) : le salon carré (1254 × 1254 px), cadré « couverture » par fitCoop() ;
   le Contrôleur assis à gauche (ses poses K00 à K14), Charbon image par image sur la banquette, la pelote et la plume au bout de la canne.
   Tout se place en pixels de la scène, convertis en % (PX) */
.c-scene{position:relative;flex:none;height:clamp(280px,46dvh,440px);margin:0 -14px;overflow:hidden;border-bottom:3px solid #6e4426;background:#1b100b}
.c-sc{position:absolute;aspect-ratio:1}
.c-sc>*{position:absolute}
#cFond{inset:0;width:100%;height:100%}
#cCtrl{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#cCtrl img{position:absolute;inset:0;width:100%;height:100%;-webkit-user-drag:none;user-select:none}
#cCtrl img.off{opacity:0}
#cCtrl img.in{z-index:2}
#cCtrl.souffle{animation:breath 4.2s ease-in-out infinite alternate;transform-origin:50% 100%}   /* au repos, et Charbon endormi sur ses genoux : il respire */
#cFil{inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#cFil line{stroke:#efe4cc;stroke-width:2.4;stroke-linecap:round;opacity:.8}
#cPlume,#cPelote{pointer-events:none;opacity:0;transition:opacity .45s}
#cFil,#cPlume{z-index:4}   /* la ficelle et la plume pendent devant Charbon (10/10, l'auteur : elles passaient derrière lui) */
#cPlume.on,#cPelote.on{opacity:1}
#cPlume{transform-origin:50% 0}
.c-bulle{left:14%;top:20%;max-width:46%;padding:7px 11px;z-index:5;border-radius:14px 14px 14px 4px;background:#f6eedc;color:#3a2a1b;font:800 12.5px/1.35 var(--sans);
  opacity:0;translate:0 6px;transition:opacity .2s,translate .25s var(--out);pointer-events:none}
.c-bulle.on{opacity:1;translate:0 0}
body[data-moment="matin"] #cCtrl,body[data-moment="matin"] #cPlume{filter:brightness(1.04) sepia(.05)}
body[data-moment="jour"] #cCtrl,body[data-moment="jour"] #cPlume{filter:brightness(1.07) saturate(.96)}
/* Charbon : ses images (cadre 1254 de assis.png) posées par le bas de ses pattes ; assis, ses gestes (cligne, bâille, se lèche…)
   et sa queue sur un calque à part (outils/charbon.py) ; sinon une image par instant du mouvement (outils/coop-accueil.py) */
.charbon{padding:0;line-height:0;touch-action:manipulation;z-index:3}
.ch-chat{position:relative;display:block;transform-origin:30% 96%;animation:souffleChat 3.6s ease-in-out infinite alternate}
@keyframes souffleChat{from{scale:1 1}to{scale:1.012 1.022}}
@keyframes ronron{from{translate:-.5px 0}to{translate:.5px .3px}}
.ch-chat img{display:block;width:100%;-webkit-user-drag:none;user-select:none;z-index:auto}
.ch-chat .ch-q{position:absolute;inset:0;height:100%;transform-origin:55.4% 95.0%;animation:queueChat 4.4s ease-in-out infinite alternate}   /* la queue remue, autour de sa racine */
@keyframes queueChat{0%{rotate:-3deg}60%{rotate:4deg}100%{rotate:1deg}}
.charbon .ch-chat{filter:drop-shadow(0 3px 3px rgba(10,20,12,.45))}
.charbon:not(.assis) .ch-chat{animation:none}
.charbon:not(.assis) .ch-q{display:none}
.charbon.miroir .ch-c{transform:scaleX(-1)}   /* ses images de marche et de saut regardent d'un seul côté : de l'autre, en miroir */
.charbon.cache{visibility:hidden}
.charbon.leche .ch-c{animation:lecheChat .3s ease-in-out infinite alternate}   /* il se lèche la patte : la tête monte et descend */
@keyframes lecheChat{to{translate:0 -.8%}}
.charbon.ronronne .ch-chat{animation:ronron .08s linear infinite alternate}
body[data-moment="soir"] #cPelote{filter:brightness(.84) saturate(.92)}
/* Même traitement de lumière que Charbon incorporé aux poses du Contrôleur. */
body[data-moment="matin"] .c-sc .charbon img{filter:brightness(1.04) sepia(.05)}
body[data-moment="jour"] .c-sc .charbon img{filter:brightness(1.07) saturate(.96)}
/* sur le quai Coop : il arrive en marchant depuis le train et s'assoit aux pieds du Contrôleur */
.ch-quai{position:absolute;left:104%;bottom:20%;width:17.94%;pointer-events:none;opacity:0;transition:opacity .4s}
.ch-quai img{display:block;width:100%}
.ch-quai .ch-q{position:absolute;inset:0;height:100%;transform-origin:55.4% 95.0%;animation:queueChat 4.4s ease-in-out infinite alternate}
.ch-quai.marche .ch-q{display:none}
.ch-quai.marche img.ch-c{scale:-1 1}   /* les images de marche vont vers la droite : il vient du train, à droite */
body.quai-coop .ch-quai{opacity:1}
body[data-moment="soir"] .ch-quai{filter:brightness(.78) saturate(.9)}
body[data-moment="matin"] .ch-quai{filter:brightness(.97) sepia(.06)}
.ch-bulle{position:absolute;left:40%;bottom:92%;padding:6px 11px;border-radius:14px 14px 14px 4px;background:#f6eedc;color:#3a2a1b;font:800 13px var(--sans);white-space:nowrap;
  opacity:0;translate:0 6px;transition:opacity .2s,translate .25s var(--out);pointer-events:none}
.charbon.ronronne .ch-bulle{opacity:1;translate:0 0}
/* les billets de groupe : un par train ; à droite, après les perforations, les 8 places en petites lampes (comme les 4 tables × 2 de la voiture-salon) */
#coop .c-t{margin:20px 2px 8px;font:800 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#e9c879}
#coop .c-note{font:700 12px/1.5 var(--sans);color:#d8c7a6;margin:10px 2px 0}
.c-vide{padding:14px;border-radius:10px;border:1.5px dashed rgba(233,200,121,.3);font:700 12.5px/1.45 var(--sans);color:#cdb88f}
.billets-g{display:grid;gap:10px}
.billet-g{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 88px;width:100%;text-align:left;color:#3a2a1b;border-radius:8px;
  background:linear-gradient(180deg,#f6eedc,#e9ddc1);box-shadow:inset 0 1px 0 rgba(255,253,242,.75),inset 0 0 0 1px rgba(80,55,30,.16),0 5px 14px rgba(0,0,0,.36)}
.billet-g::before,.billet-g::after{content:'';position:absolute;right:81px;width:14px;height:14px;border-radius:50%;background:var(--fond-billet,#1b100b)}
.billet-g::before{top:-7px}.billet-g::after{bottom:-7px}
.billet-g:disabled{opacity:.6}
.bg-g{min-width:0;padding:12px 10px 12px 14px}
.bg-k{display:block;font:800 9.5px var(--sans);letter-spacing:.2em;color:#8a5a2b}
.bg-nom{display:block;font:italic 600 19px/1.2 var(--serif);color:#2b1d12;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bg-chef{display:flex;align-items:center;gap:6px;margin-top:6px;font:700 12px var(--sans);color:#5b4128;min-width:0}
.bg-etat{display:block;margin-top:5px;font:800 11.5px var(--sans);color:#2f6b4f}
.bg-noms{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:7px;font:800 11px var(--sans);color:#5b4128}
.bg-d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-left:2px dashed rgba(80,55,30,.32)}
.bg-d small{font:800 10.5px var(--sans);color:#6b5236}
.bg-monter{font:900 12px var(--sans);font-style:normal;color:#fff;background:#2f6b4f;border-radius:99px;padding:6px 12px;box-shadow:0 2px 0 #1d4a35}
.bg-tampon{position:absolute;right:96px;top:6px;width:34px;height:34px;rotate:-12deg;font-size:0;background:url(assets/carnet/web/tampons/patte-charbon.webp) center/contain no-repeat;opacity:.75;mix-blend-mode:multiply;pointer-events:none}   /* l'empreinte de Charbon à la place du mot COOP (CH23) */
.bg-act{grid-column:1/-1;display:flex;gap:8px;padding:0 12px 12px}
.bg-act button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid rgba(60,40,20,.3);font:800 12.5px var(--sans);color:#3a2a1a}
.bg-act button.ok{background:#2f6b4f;border-color:#2f6b4f;color:#fff;box-shadow:inset 0 1px 0 rgba(225,246,231,.2),0 2px 0 #1d4a35}
.bg-act button.ok:active:not(:disabled){box-shadow:inset 0 2px 4px rgba(9,35,23,.26),0 1px 0 #1d4a35}
.lampes{display:grid;grid-template-columns:repeat(4,10px);gap:5px 6px}
.lampes i{width:10px;height:10px;border-radius:50%;background:#cdbf9f;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.lampes i.on{background:radial-gradient(circle at 40% 35%,#fff4c9,#ffc24d 45%,#e0821c);box-shadow:0 0 8px 2px rgba(255,190,80,.7)}
.lampes i.allume{animation:allume .9s ease-out}
@keyframes allume{0%{scale:.4;box-shadow:0 0 0 0 rgba(255,210,120,0)}40%{scale:1.5;box-shadow:0 0 16px 6px rgba(255,210,120,.95)}100%{scale:1}}
.c-actions{display:flex;gap:8px;margin-top:14px}
.c-actions button{flex:1;min-height:50px;border-radius:12px;font:900 13px var(--sans);letter-spacing:.03em;border:1.5px solid rgba(233,200,121,.45);color:#f3e2b8}
.c-actions button.ok{background:linear-gradient(#3a7a5a,#2f6b4f);border-color:#2f6b4f;color:#fff;box-shadow:inset 0 1px 0 rgba(225,246,231,.2),0 3px 0 #1d4a35}
.c-actions button.ok:active:not(:disabled){box-shadow:inset 0 2px 4px rgba(9,35,23,.26),0 1px 0 #1d4a35}
.c-code{margin-top:10px;padding:2px 14px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(233,200,121,.18)}
#quaiCoop{--fond-billet:#140d07}
#quaiCoop{position:absolute;left:12px;right:12px;top:max(14px,env(safe-area-inset-top));z-index:8;padding:14px;border-radius:18px;
  background:linear-gradient(180deg,rgba(20,13,7,.94),rgba(12,8,4,.96));border:1px solid rgba(255,217,161,.2);box-shadow:0 18px 50px rgba(0,0,0,.6);
  opacity:0;translate:0 -16px;pointer-events:none;transition:opacity .35s,translate .45s var(--out)}
#quaiCoop.on{opacity:1;translate:0 0;pointer-events:auto}
body.quai-coop header.ui,body.quai-coop .dock .go{opacity:0;pointer-events:none}   /* le quai Coop remplace le tableau et le bouton du trajet solo */
body.quai-coop:has(#quaiCoop.on) #bubble{display:none}   /* sa bulle passerait sous le billet du quai : le billet dit déjà qui monte ; au départ, le panneau s'efface et elle revient */
#quaiCoop .k{font:900 10.5px var(--sans);letter-spacing:.18em;color:var(--amber);margin:12px 0 6px}
#quaiCoop .k{color:#e9c879}   /* le Coop a ses couleurs : laiton et velours vert (06/10) */
#quaiCoop .fiche-act button.ok{background:linear-gradient(#3a7a5a,#2f6b4f);border-color:#2f6b4f;color:#fff}
#quaiCoop .objet.on{border-color:#3a7a5a;background:rgba(58,122,90,.22);color:#cfe8d8}
#coopInfo{font:700 12px var(--sans);color:#c9b9a3;margin-top:8px}
@keyframes palette{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.objets{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.objet{min-height:48px;padding:3px 1px;border-radius:10px;border:1.5px solid rgba(255,217,161,.18);font:800 9.5px/1.05 var(--sans);color:#c9b9a3;display:flex;flex-direction:column;align-items:center;gap:3px}
.objet i{width:24px;height:24px;border-radius:50%;background:rgba(255,217,161,.12) center/contain no-repeat}
.objet.on{border-color:var(--amber);background:rgba(232,167,92,.16);color:var(--amber-hi)}
#coopDepart:disabled{opacity:.6}
.coop-quitter{display:block;margin:8px auto 0;min-height:40px;font:800 12px var(--sans);color:#9a8a76}
/* le carnet : le prénom sur l'étiquette de la page de garde ; le billet Coop */
.exlibris{position:absolute;left:50%;top:15.5%;translate:-50% -50%;font:600 26px/1 'Caveat',cursive;color:#2f3f6b;white-space:nowrap;rotate:-2deg}
.tampon-coop{position:absolute;right:8%;top:10%;width:15%;aspect-ratio:1;rotate:10deg;font-size:0;background:url(assets/carnet/web/tampons/patte-charbon.webp) center/contain no-repeat;opacity:.85;mix-blend-mode:multiply}   /* l'empreinte de Charbon (CH23) */
.billet.coop{background-image:url(assets/carnet/web/billet-coop.webp),url(assets/carnet/web/billet-1.webp);padding-left:26%}   /* deux talons (T02) : le texte et les trous commencent plus loin */
.tampon-terminus{position:absolute;right:9%;top:20%;rotate:-8deg;font:400 15px var(--imp);letter-spacing:.18em;color:var(--rouge);
  background:url(assets/carnet/web/tampons/terminus.webp) center/100% 100% no-repeat;padding:7px 15px;opacity:.9;mix-blend-mode:multiply}
.reglage{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,217,161,.08)}
.reglage b{display:block;font:800 14px var(--sans);color:var(--cream)}
.reglage span{display:block;font:700 12px/1.45 var(--sans);color:#9a8a76;margin-top:2px}
.interrupteur{flex:none;width:52px;height:32px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .2s}
.interrupteur::after{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#e9dcc6;transition:translate .2s var(--out)}
.interrupteur[aria-checked="true"]{background:var(--amber)}
.interrupteur[aria-checked="true"]::after{translate:20px 0}
/* train régulier : il attend à quai et annonce son départ */
#regulier{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;padding:8px 8px 8px 14px;border-radius:14px;
  background:rgba(20,12,6,.88);border:1px solid rgba(232,167,92,.45);font:800 12.5px var(--sans);color:var(--amber-hi)}
#regulier[hidden]{display:none}
#regulier button{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(255,217,161,.3);font:800 12px var(--sans);color:var(--amber-hi)}
#toast{position:absolute;left:50%;bottom:170px;translate:-50% 10px;padding:10px 16px;border-radius:12px;background:rgba(4,9,22,.92);border:1px solid rgba(255,255,255,.08);
  font:700 13px/1.4 var(--sans);color:var(--ink);opacity:0;pointer-events:none;transition:opacity .25s,translate .35s var(--out);
  z-index:20;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;translate:-50% 0}
/* ---------- les Réglages (décision de l'auteur, 04/10 au soir : directions/REGLAGES.md) : des réglages simples sur des panneaux de verre fumé ;
   derrière, la cabine de conduite de ChatGPT (directions/REGLAGES-IMAGES-2026-10-04.md).
   09/10 (l'auteur) : plus de Contrôleur, toujours la cabine vide, et les réglages commencent juste sous le titre. ---------- */
#reglages{top:0;max-height:none;border-radius:0;padding:0;overflow:hidden;border-top:0;background:#0d0f12;color:#eef0f2}
#reglages .r-fond{position:absolute;inset:0;pointer-events:none;filter:brightness(.8)}   /* la cabine de ChatGPT, un peu assombrie (l'auteur, 05/10) */
#reglages .r-fond img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
#reglages .r-fond::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,11,.72),rgba(8,9,11,.05) 22%,rgba(8,9,11,.08) 50%,rgba(8,9,11,.6))}
#reglages .croix{z-index:3}
#reglages .r-defile{position:absolute;inset:0;z-index:1;overflow-y:auto;overscroll-behavior:contain;padding:max(18px,env(safe-area-inset-top)) 14px 28px}
#reglages::after{content:'';position:absolute;inset:0 0 auto;height:calc(env(safe-area-inset-top) + 10px);z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(8,9,11,.94) 72%,rgba(8,9,11,0))}   /* iPhone : la liste qui défile passe sous l'heure, pas à travers (19/10) */
#reglages h2{color:#f2f3f5;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#reglages .r-titre{margin:18px 4px 7px;font:800 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#b9c0c8;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#reglages .r-panneau{max-width:460px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(26,29,33,.72),rgba(18,21,25,.68));border:1px solid rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(14px) saturate(.7);backdrop-filter:blur(14px) saturate(.7);box-shadow:inset 0 1px 0 rgba(240,243,246,.07),0 10px 30px rgba(0,0,0,.35)}
#reglages .r-ligne{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:11px 14px;text-align:left;color:inherit;cursor:pointer}
#reglages .r-ligne+.r-ligne{border-top:1px solid rgba(255,255,255,.1)}
#reglages .r-ligne.col{flex-direction:column;align-items:stretch;cursor:default}
#reglages .r-txt b{display:block;font:800 14.5px/1.25 var(--sans);color:#eef0f2}
#reglages .r-dit{display:block;margin-top:2px;font:700 12px/1.4 var(--sans);color:#b6bdc6}
#reglages .r-ligne input{margin:0}
#reglages .r-seg{display:flex;gap:3px;padding:3px;border-radius:11px;background:rgba(255,255,255,.08)}
#reglages .r-seg button{flex:1;min-height:40px;border-radius:9px;font:800 13px var(--sans);color:#c3c9d0;transition:background .2s,color .2s}
#reglages .r-seg button[aria-checked="true"]{background:#e9ecef;color:#15181c;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 3px rgba(0,0,0,.25)}
#reglages .r-seg button:active:not(:disabled){box-shadow:inset 0 2px 4px rgba(0,0,0,.14)}
#reglages .interrupteur::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 1px 3px rgba(0,0,0,.3)}
#reglages :is(.r-ligne,.r-seg button,.interrupteur):focus-visible{outline:2px solid var(--amber-hi);outline-offset:-3px}
#reglages .r-ligne.verrou .r-txt{opacity:.6}
#reglages .r-tag{flex:none;padding:5px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.18);font:800 10.5px var(--sans);letter-spacing:.06em;color:#c9ced4;white-space:nowrap}
#reglages .r-raz{position:relative;overflow:hidden;width:100%;min-height:52px;border-radius:14px;border:1.5px solid rgba(255,120,95,.5);color:#ffb3a3;font:800 13.5px var(--sans);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#reglages .r-raz i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(216,68,58,.38)}
#reglages .r-raz span{position:relative}
#reglages .r-note{margin:2px 2px 0;font:700 12px/1.45 var(--sans);color:#b6bdc6}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.12s!important}
}
/* ---------- l'abonnement (11/10, l'auteur : « l'offre doit s'afficher souvent, attirante comme Duolingo, et sur la Gare à tout moment ») ---------- */
.where .abo-pastille{flex:none;position:relative;overflow:hidden;display:flex;align-items:center;gap:5px;height:26px;margin:-6px 0 -6px 2px;padding:0 10px 0 8px;border-radius:999px;
  background:linear-gradient(135deg,#ffe7a8,#eab457 55%,#c98a35);color:#2a1a06;font:900 10.5px/1 var(--sans);letter-spacing:.1em;cursor:pointer;
  box-shadow:0 2px 0 #8a5a1c,0 4px 14px rgba(242,200,107,.35);-webkit-tap-highlight-color:transparent}
.where .abo-pastille span{color:inherit}
.abo-pastille svg{width:12px;height:12px;flex:none;fill:currentColor}
.abo-pastille::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.8) 48%,transparent 64%);translate:-130% 0;animation:aboBrille 6s 2.5s infinite;pointer-events:none}
.where .abo-pastille.abonne{background:rgba(242,200,107,.13);color:#ffe3a1;box-shadow:inset 0 0 0 1px rgba(242,200,107,.55)}
.abo-pastille.abonne::after{display:none}
.abo-pastille.billet svg{display:none}
.abo-pastille.billet::before{content:'';width:18px;height:18px;flex:none;background:url(assets/abonnement/web/billet-or.webp) center/contain no-repeat}
body:not([data-moment="soir"]) .where .abo-pastille.abonne{background:rgba(120,78,20,.16);color:#7a4f12;box-shadow:inset 0 0 0 1px rgba(138,83,29,.5)}
.where.court2 .abo-pastille span{display:none}
.where.court2 .abo-pastille{padding:0 8px}
.where.court3 #who{display:none}
.where.court4 .lieu{display:none}
@keyframes aboBrille{0%,72%{translate:-130% 0}100%{translate:130% 0}}
/* la page de l'offre : plein écran, bleu nuit et or */
#abo{position:absolute;inset:0;z-index:19;visibility:hidden;pointer-events:none}
#abo.on{visibility:visible;pointer-events:auto}
#abo::before{content:'';position:absolute;inset:0;background:rgba(2,5,14,.55);opacity:0;transition:opacity .35s}
#abo.on::before{opacity:1}
.abo-feuille{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:#081631;color:#f3ead6;
  translate:0 104%;transition:translate .55s cubic-bezier(.22,1,.36,1)}
#abo.on .abo-feuille{translate:0 0}
.abo-x{position:absolute;z-index:3;left:12px;top:max(12px,env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:rgba(8,22,49,.6);color:#cdd5ea;font:300 28px/1 var(--sans);display:grid;place-items:center}
.abo-heros{position:relative;height:36%;min-height:205px;max-height:310px;overflow:hidden;background:radial-gradient(95% 90% at 58% 42%,#21418a 0%,#132d66 42%,#081631 78%)}
.abo-heros::after{content:'';position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(rgba(8,22,49,0),#081631);pointer-events:none}
.abo-heros.img{background:url(assets/abonnement/web/heros.webp) center/cover}
.abo-heros.img .abo-ctrl,.abo-heros.img .abo-carte,.abo-heros.img .abo-eclat{display:none}
.abo-eclat{position:absolute;left:62%;top:46%;width:110%;aspect-ratio:1;translate:-50% -50%;background:radial-gradient(circle,rgba(255,214,120,.42) 0%,rgba(242,180,80,.15) 30%,transparent 58%);animation:aboPulse 5s ease-in-out infinite}
@keyframes aboPulse{50%{scale:1.08;opacity:.8}}
.abo-ctrl{position:absolute;left:-5%;bottom:-26%;height:118%;width:auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55))}
.abo-carte{position:absolute;right:5%;top:21%;width:55%;aspect-ratio:1000/604;border-radius:9px;overflow:hidden;rotate:-7deg;
  box-shadow:0 22px 44px rgba(0,0,0,.55),0 0 0 2px rgba(255,231,168,.75),0 0 46px rgba(242,190,90,.5);animation:aboFlotte 6s ease-in-out infinite}
.abo-carte::before{content:'';position:absolute;inset:0;background:url(assets/amis/web/carte-abonne.webp) center/100% 100%;filter:sepia(.62) saturate(1.55) hue-rotate(-14deg) brightness(.93) contrast(1.22)}
.abo-carte i{position:absolute;inset:0;background:linear-gradient(110deg,transparent 36%,rgba(255,252,235,.7) 50%,transparent 64%);translate:-130% 0;animation:aboBrille 4.8s 1s infinite}
@keyframes aboFlotte{50%{translate:0 -6px;rotate:-5deg}}
.abo-etincelles i{position:absolute;width:12px;height:12px;opacity:0;
  background:radial-gradient(circle,#fff8dc 0 16%,transparent 22%),linear-gradient(#ffe7a8,#ffe7a8) center/1.5px 100% no-repeat,linear-gradient(#ffe7a8,#ffe7a8) center/100% 1.5px no-repeat;
  animation:aboScint var(--d) var(--t) ease-in-out infinite}
@keyframes aboScint{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(var(--s)) rotate(45deg)}}
.abo-corps{position:relative;max-width:460px;margin:0 auto;padding:0 20px 8px}
/* le bouton d'essai reste toujours en bas de l'écran, la page défile derrière */
.abo-pied{position:sticky;bottom:0;z-index:2;max-width:460px;margin:0 auto;padding:18px 20px max(8px,env(safe-area-inset-bottom));background:linear-gradient(rgba(8,22,49,0),#081631 18px)}   /* fond plein sous les boutons : la liste ne transparaît plus derrière « Pas maintenant » (19/10) */
.abo-pied[hidden]{display:none}
.abo-pied .abo-go{margin-top:0}
.abo-pied .abo-plustard{margin-top:2px;padding:10px 18px}
.abo-k{font:900 11px var(--sans);letter-spacing:.22em;color:#f2c86b}
#aboTitre{margin:6px 0 6px;font:italic 600 31px/1.08 var(--serif);background:linear-gradient(180deg,#fff7de 10%,#f4cd73 62%,#d99b3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.abo-sous{font:700 14px/1.45 var(--sans);color:#c4cde4}
.abo-liste{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px}
.abo-li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;border:1px solid transparent;opacity:0;translate:0 10px}
#abo.on .abo-li{animation:aboEntre .5s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.12s + var(--i) * .06s)}
@keyframes aboEntre{to{opacity:1;translate:0 0}}
.abo-li.top{background:linear-gradient(90deg,rgba(242,200,107,.18),rgba(242,200,107,.03));border-color:rgba(242,200,107,.4)}
.abo-ico{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#ffd98a;
  background:radial-gradient(circle at 35% 30%,rgba(255,226,150,.3),rgba(242,180,80,.08) 65%);box-shadow:inset 0 0 0 1px rgba(242,200,107,.42),0 0 18px rgba(242,190,90,.14)}
.abo-ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.abo-ico img{width:44px;height:44px;object-fit:contain}
.abo-txt{flex:1;min-width:0}
.abo-txt b{display:block;font:800 14.5px/1.25 var(--sans);color:#f6ecd8}
.abo-txt>span{display:block;margin-top:2px;font:600 12.5px/1.4 var(--sans);color:#9fb0d4}
.abo-tag{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:6px;border:1px solid rgba(160,176,212,.4);font:800 9px/1.3 var(--sans);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:#a9b6d6;vertical-align:2px}
.abo-ok{flex:none;font:900 16px var(--sans);font-style:normal;color:#f2c86b}
.abo-formules{display:flex;gap:10px;margin-top:22px}
.abo-f{flex:1;position:relative;text-align:left;padding:17px 12px 12px;border-radius:16px;border:2px solid rgba(255,255,255,.13);background:rgba(255,255,255,.035);color:#e9e2d0;transition:border-color .2s,background .2s,box-shadow .2s}
.abo-f[aria-checked="true"]{border-color:#f2c86b;background:linear-gradient(180deg,rgba(242,200,107,.17),rgba(242,200,107,.04));box-shadow:0 0 0 4px rgba(242,200,107,.14)}
.abo-badge{position:absolute;top:-11px;left:10px;padding:4px 8px;border-radius:999px;background:linear-gradient(135deg,#ffe7a8,#e8ac4e);color:#2a1a06;font:900 9.5px var(--sans);letter-spacing:.08em;white-space:nowrap}
.abo-badge[hidden]{display:none}
.abo-f b{display:block;font:800 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#c9d2ea}
.abo-prix{display:block;margin-top:5px;font:800 22px var(--sans);color:#fff4d6;white-space:nowrap}
.abo-prix small{font:700 12px var(--sans);color:#a9b4d2}
.abo-mois{display:block;margin-top:3px;font:700 11px/1.35 var(--sans);color:#93a3cb}
.abo-go{position:relative;overflow:hidden;width:100%;min-height:64px;margin-top:16px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,#ffe28f,#f0b14a);color:#2a1a06;box-shadow:0 6px 0 #a8742a,0 16px 36px rgba(242,181,75,.32);transition:translate .12s,box-shadow .12s}
.abo-go b{font:900 16.5px var(--sans);letter-spacing:.07em;text-transform:uppercase}
.abo-go span{font:700 11.5px var(--sans);opacity:.72}
.abo-go::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.7) 48%,transparent 62%);translate:-130% 0;animation:aboBrille 3.8s 1.2s infinite}
.abo-go:active{translate:0 5px;box-shadow:0 1px 0 #a8742a,0 6px 16px rgba(242,181,75,.25)}
.abo-proto{margin-top:12px;text-align:center;font:700 11px/1.4 var(--sans);color:#7584ab}
body.beta .abo-proto{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(232,190,110,.16);border:1px solid rgba(232,190,110,.55);color:#f3dfae;font-size:13px}
.abo-plustard{display:block;margin:4px auto 0;padding:12px 18px;font:800 12.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#93a3cb}
.abo-etat{margin-top:18px;padding:14px 16px;border-radius:14px;background:rgba(242,200,107,.1);border:1px solid rgba(242,200,107,.32);font:700 14px/1.55 var(--sans);color:#f3ead6}
.abo-etat b{color:#ffe3a1}
/* la carte d'abonné dorée des abonnés (provisoire : la carte peinte AB2 de Codex la remplacera) */
.abo.or{box-shadow:0 0 0 1.5px rgba(255,227,161,.75),0 0 26px rgba(242,200,107,.35)}
.abo.or.img{background:none}
.abo.or.img::before{content:'';position:absolute;inset:0;background:url(assets/amis/web/carte-abonne.webp) center/100% 100%;filter:sepia(.62) saturate(1.55) hue-rotate(-14deg) brightness(.95) contrast(1.2)}
.abo.or.or-img::before{background-image:url(assets/abonnement/web/carte-or.webp);filter:none}
.abo.or::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,250,230,.5) 50%,transparent 62%);translate:-130% 0;animation:aboBrille 6s 1.5s infinite;pointer-events:none}
/* Coop, carnet et Réglages : la marque de l'abonnement */
.c-abo{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:center;margin:2px 0 14px;padding:12px 12px 12px 14px;border-radius:16px;
  background:linear-gradient(135deg,rgba(242,200,107,.22),rgba(242,200,107,.07));border:1px solid rgba(242,200,107,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.c-abo b{grid-column:1;font:900 13px/1.3 var(--sans);color:#ffe3a1}
.c-abo span{grid-column:1;font:700 12px/1.4 var(--sans);color:#e3d7c0}
.c-abo button{grid-column:2;grid-row:1/3;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#ffe7a8,#e2a94c);color:#2a1a06;font:900 11.5px var(--sans);letter-spacing:.04em;box-shadow:0 3px 0 #8a5a1c}
.cv-abo{display:block;margin:22px auto 0;padding:12px 18px;border-radius:12px;border:1.5px dashed #9a6b1f;background:rgba(242,200,107,.2);font:500 19px var(--main);color:#5a3c12;rotate:-1deg}
#reglages .r-abo{width:100%;text-align:left}
#reglages .r-tag.r-or{border:0;background:linear-gradient(135deg,#ffe7a8,#e2a94c);color:#2a1a06;font-weight:900}
/* la pub du Voyageur, à la descente du train (simulée dans le prototype) */
#pub{position:absolute;inset:0;z-index:17;display:none;flex-direction:column;background:#000;color:#fff}
#pub.on{display:flex}
#pub [hidden]{display:none!important}
.pub-haut{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 14px 10px}
.pub-tag{padding:4px 8px;border-radius:6px;background:#f2c86b;color:#1a1206;font:900 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.pub-compte{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.4);font:800 13px var(--sans);font-variant-numeric:tabular-nums}
.pub-ecran{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:0 14px}
.pub-video{position:relative;flex:1;max-height:520px;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;
  background:linear-gradient(135deg,#1c2a52,#3a1f4f 50%,#12324a);background-size:300% 300%;animation:pubFond 8s ease infinite}
@keyframes pubFond{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.pub-video b{font:900 17px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.pub-video>span{font:700 13px/1.45 var(--sans);color:rgba(255,255,255,.75);max-width:250px}
.pub-video .pub-serie{position:absolute;top:12px;left:12px;right:12px;max-width:none;padding:9px 12px;border-radius:10px;background:rgba(0,0,0,.45);font:800 13px/1.35 var(--sans);color:#ffe3a1}
.pub-lecture{position:relative;width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.pub-lecture::after{content:'';position:absolute;left:21px;top:16px;border-left:17px solid rgba(255,255,255,.85);border-top:11px solid transparent;border-bottom:11px solid transparent}
.pub-barre{height:4px;margin-top:10px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.pub-barre i{display:block;height:100%;width:0;background:#f2c86b}
.pub-bas{padding:14px 18px max(18px,env(safe-area-inset-bottom));text-align:center}
.pub-bas p{font:700 13px/1.4 var(--sans);color:rgba(255,255,255,.78);margin-bottom:10px}
/* garder sa série après un frein (une fois par semaine) */
#sauvetage{position:absolute;inset:0;z-index:16;display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 16px 16px;background:rgba(3,6,14,.78);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#sauvetage.on{display:flex}
.sv-boite{position:relative;width:min(100%,380px);padding:20px 18px 14px;border-radius:24px;text-align:center;background:linear-gradient(180deg,#24170d,#150d07);border:1px solid rgba(255,217,161,.22);box-shadow:0 24px 60px rgba(0,0,0,.6);color:var(--ink)}
.sv-boite .k{font:900 11px var(--sans);letter-spacing:.2em;color:var(--amber)}
.sv-flamme{display:block;width:70px;height:70px;margin:12px auto 0;fill:#ffb35c;filter:drop-shadow(0 0 18px rgba(255,150,60,.65));animation:svFlamme 1.6s ease-in-out infinite}
@keyframes svFlamme{50%{scale:1.06 1.1;filter:drop-shadow(0 0 26px rgba(255,150,60,.85))}}
.sv-n{margin-top:2px;font:900 46px/1 var(--sans);color:#ffe3a1;font-variant-numeric:tabular-nums}
.sv-boite h2{margin:2px 0 10px;font:italic 500 22px/1.15 var(--serif);color:var(--cream)}
.sv-txt{font:700 14px/1.45 var(--sans);color:#d8c9b0}
.sv-note{margin-top:8px;font:700 11.5px/1.4 var(--sans);color:#9a8a76}
.sv-oui{width:100%;min-height:56px;margin-top:16px;border-radius:16px;background:linear-gradient(180deg,#ffe28f,#f0b14a);color:#2a1a06;font:900 14px var(--sans);letter-spacing:.05em;text-transform:uppercase;box-shadow:0 5px 0 #a8742a}
.sv-oui:active{translate:0 4px;box-shadow:0 1px 0 #a8742a}
.sv-non{display:block;margin:6px auto 0;padding:12px 16px;font:800 12.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#9a8a76}
/* « Mouvements réduits » dans les Réglages : la même chose, même si le téléphone ne le demande pas */
html.calme *,html.calme *::before,html.calme *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.12s!important
}

#app{height:100%}
@media(min-width:500px){#app{height:calc(100% - 28px)}}
#app img{max-width:none}

/* Sour Gummy retenue par l'auteur le 19/10 : la mise en page suit ses lettres.
   Interface seulement ; peintures, lettrages d'objets, pages et gestes conservés. */
html,body{font-size:16px;font-weight:400}
button,input,select,textarea{font-synthesis:none}
#app h1,#app h2,#app h3,#app .bg-nom,#app #aboTitre,#app .rm-nom{font-style:normal;font-weight:600;line-height:1.25;letter-spacing:0}
h1{font-size:28px}
button,input,select,textarea{letter-spacing:0}
.go{height:auto;min-height:62px;padding:11px 14px;gap:3px}
.go b{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:0;text-transform:none;text-align:center;overflow-wrap:anywhere}
.go span{font-size:14px;font-weight:400;line-height:1.35}
.where{font-size:12px;font-weight:500;line-height:1.35;letter-spacing:.02em;gap:6px}
.where .etats{gap:7px}
.where .abo-pastille{height:auto;min-height:32px;font-size:12px;font-weight:600;letter-spacing:0;line-height:1.3}
.bhead{font-size:12px;font-weight:600;letter-spacing:.04em;flex-wrap:wrap}
.bhead b{font-size:13px;font-weight:600;letter-spacing:0}
.add{height:auto;min-height:36px;font-size:14px;font-weight:600;line-height:1.3;padding:6px 10px;letter-spacing:0}
.rows{max-height:min(184px,31dvh)}
.row{min-height:56px;gap:10px;padding:9px 12px}
.row .t b{font:600 16px/1.3 var(--sans);white-space:normal;overflow-wrap:anywhere}
.row .t span{font-size:14px;font-weight:400;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.row .min{flex:none;font-size:14px;font-weight:600;line-height:1.3}
nav button{font-size:13px;font-weight:500;letter-spacing:0;line-height:1.25;min-height:56px;gap:5px}
#bubble,.a-bulle,.ch-bulle{font-weight:500;line-height:1.4}
#bubble{font-size:16px}
.a-bulle,.ch-bulle{font-size:14px}
#creer h2,.feuilleG h2,.mod-boite h2{font-size:26px;line-height:1.25}
#creer label,.feuilleG h3,.feuilleG label,.f-titre{font-size:14px;font-weight:600;letter-spacing:.02em;line-height:1.4;text-transform:none}
#creer input,#creer select,.feuilleG input,.feuilleG select{font-size:16px;font-weight:400;line-height:1.4;min-height:48px}
#creer .deux>div{min-width:0}
#creer .note,.feuilleG .note,.f-note,#ficheTxt,.ec-dit,.a-note,.a-vide,.c-vide,#coop .c-note,#coopInfo{font-size:14px;font-weight:400;line-height:1.5;overflow-wrap:anywhere}
#creer .btns button,.feuilleG .fermer,.fiche-act button,.a-cta,.fa-retirer,.fa-act2 button,.c-actions button,.bg-act button,.iq-btn,#invitation button,#regulier button,.coop-quitter{font-family:var(--sans);font-size:16px;font-weight:600;line-height:1.35;letter-spacing:0;text-transform:none;min-width:0;height:auto;min-height:48px;padding:10px 12px;white-space:normal;overflow-wrap:anywhere}
.fiche-act,.c-actions,.bg-act{flex-wrap:wrap}
.fiche-act button,.c-actions button,.bg-act button{flex:1 1 110px}
.jour{font-size:14px;font-weight:500;line-height:1.3}
.feuilleG .k,#creer .k,.mod-boite .k,.a-titre,#coop .c-t,#quaiCoop .k{font-size:13px;font-weight:600;line-height:1.4;letter-spacing:.04em}
.ami b{font:600 18px/1.3 var(--sans)}
.ami small,.ami i{font-size:14px;font-weight:400;line-height:1.4}
.ami-txt b,.ami-txt small{white-space:normal;overflow-wrap:anywhere}
.ami i{flex:none}
.ec small{font-size:12px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
/* Les titres/commandes du Carnet utilisent l'identité ; l'encre manuscrite,
   les billets peints et leur typographie proportionnelle restent des objets. */
.page .rubrique{font:600 13px/1.3 var(--sans);letter-spacing:.04em}
.page h3{font:600 23px/1.25 var(--sans)}
.page{overflow-y:auto;overflow-x:hidden}
.page .coins{position:relative;left:auto;right:auto;bottom:auto;margin-top:14px;gap:6px}
.page .coins button{flex:1;min-width:0;white-space:normal}
.onglets button{font-family:var(--sans);font-size:13px;font-style:normal;font-weight:500;line-height:1.2;letter-spacing:0;border-width:8px 3px;padding:0 1px 24px;display:flex;justify-content:center;align-items:flex-start}

.onglets button:nth-child(1){--x:1%;width:19.6%}
.onglets button:nth-child(2){--x:20.6%;width:19.6%}
.onglets button:nth-child(3){--x:40.2%;width:19.6%}
.onglets button:nth-child(4){--x:59.8%;width:19.6%}
.onglets button:nth-child(5){--x:79.4%;width:19.6%}
.refermer,.page .coins button,.fa-aide,.fa-act2 button,.pl-fermer,.plan-ouvrir{font-family:var(--sans);font-style:normal;font-weight:500;line-height:1.4}
.refermer,.page .coins button{font-size:14px}
.bil-tete{flex-wrap:wrap;gap:4px 10px}
.bil-ligne{display:block}
.bil-ligne .note{font:400 14px/1.4 var(--sans);margin-top:5px}
.bil-total{font-size:32px;line-height:1.15}
.bg-nom{font:600 20px/1.3 var(--sans);white-space:normal;overflow-wrap:anywhere}
.bg-chef,.bg-etat,.bg-noms{font-size:14px;font-weight:400;line-height:1.4;overflow-wrap:anywhere}

<script>
document.documentElement.lang='fr';
const ECRANS={
gare(){
window.POSES_DISPO=["chef-depart-v2", "emo-decu-bras-croises", "emo-decu-cligne", "emo-decu-epaules", "emo-decu-gratte", "emo-decu-lunettes", "emo-decu-moustache", "emo-decu-note", "emo-decu-poches", "emo-decu-repos", "emo-decu-soupir", "emo-decu-train", "emo-fier-repare-v2", "jour-annonce-v2", "jour-sifflet-v2", "jour-surpris-v2", "soir-surpris-v2"];

/* dans la page privée Claude, un hôte (window.HORLIGNE) fournit l'état enregistré et passe d'un écran à l'autre ;
   ailleurs, on garde le navigateur (localStorage) et les deux pages séparées */
const H=window.HORLIGNE||null;

if(!S||typeof S!=='object'||Array.isArray(S))S={};

function noter(e,o){const J=S.journal=Array.isArray(S.journal)?S.journal:[];J.push(o?[Date.now(),e,o]:[Date.now(),e]);if(J.length>600)J.splice(0,J.length-600)}

function noterOuverture(){const J=S.journal||[],der=J.length?J[J.length-1][0]:0;if(Date.now()-der<30*60000)return;noter('ouverture');sauver()}

  // 10/10 (l'auteur) : les exemples seulement tant qu'il n'a jamais eu de ligne ; une fois ses lignes au terminus, le tableau est vide
  const aEu=Object.keys(S.personalLines||{}).length>0;
  demo=!lines.length&&!aEu;vide=!lines.length&&aEu;
  if(demo)lines=[{id:'d1',name:'Bac de maths',goal:'Avoir 14 au bac',interval:25,color:'#8ec5e8'},

const COURTS=['court','court2','court3','court4'];   // trop étroit : « Gare centrale » part d'abord, puis le mot du bouton doré, le prénom, « voie 7 » ; l'étoile dorée reste toujours
function ajusterLieu(){const w=document.querySelector('.where');w.classList.remove(...COURTS);for(const c of COURTS){if(w.scrollWidth<=w.clientWidth+1)break;w.classList.add(c)}}
if(document.fonts)document.fonts.ready.then(ajusterLieu);addEventListener('resize',ajusterLieu);
function jour(t){const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function serie(){const depuis=debutSerie(),jours=new Set([...(S.log||[]).filter(e=>e.d>depuis).map(e=>jour(e.d)),...joursVeilleuse(depuis)]);   // 23/10 : un jour gardé par un billet de réserve compte
  let n=0;const d=new Date();if(!jours.has(jour(d)))d.setDate(d.getDate()-1);
  while(jours.has(jour(d))&&d.getTime()>depuis-864e5){n++;d.setDate(d.getDate()-1)}return n}
/* =====================================================================
   LE BILLET DE RÉSERVE ET LA VEILLEUSE (23/10, plan Duolingo thème 4 : le « gel de série » se gagne d'avance).
   Une mission du jour accomplie donne un billet de réserve (deux au plus en poche). Un jour passé sans trajet,
   le billet sert tout seul : la lanterne de ce jour-là reste en veilleuse (petite flamme bleue) et la série tient.
   Il ne sert que s'il sauve vraiment la série (autant de billets que de jours manqués) ; jamais le jour même.
   Sans lien avec le frein : un frein reste un frein. Images V1–V3 de Codex (NIVEAU-DUOLINGO-IMAGES-2026-10-23), sinon dessins en code.
   ===================================================================== */
const RESERVES_MAX=2;
const jourVersDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m,d,12)};

   Poses de Codex (NIVEAU-DUOLINGO-IMAGES-2026-10-23, lots R, A, E), normalisées par outils/poses-vivantes.py : essayées au chargement,
   ajoutées au jeu du moment dès qu'elles existent. En attendant, les gestes existants les remplacent (salut, casquette, lanterne).
   Le matin reprend les réactions du jour, comme pour les autres gestes ; ses occupations restent les siennes (journal, café, balai).
   ===================================================================== */

const ATTENTES={jour:['visiere','boutons','carnet'],soir:['ciel','meche','carnet']};
Object.assign(LANTERNE,{surpris:[25.8,79.7],pouce:LANTERNE.repos,rire:[26,79.5],casquette:[24.9,79.3],ciel:[24.4,79.2],meche:[28.9,70.5],carnet:[27,61.3],retrouvailles:[23.1,43.1]});   // relevées sur les poses refaites par Codex (27/10), en % du cadre, vérifiées à l'œil
const vivantesPretes=new Set();
Object.entries(VIVANTES).forEach(([m,o])=>Object.entries(o).forEach(([k,f])=>{if(window.VIVANTES_PRETES&&!window.VIVANTES_PRETES.includes(f))return;const i=new Image();   // la liste vient de page-privee.py ; seule, la page essaie tout
  
  i.onload=()=>{vivantesPretes.add(f);SETS[m][k]=f;if(m==='jour')SETS.matin[k]=f;if(ATTENTES[m].includes(k)&&!ACTIVITES[m].includes(k))ACTIVITES[m].push(k)};
  i.src=`assets/controleur/${f}.webp`;cache.push(i)}));
const vivante=k=>{const f=VIVANTES[moment==='soir'?'soir':'jour'][k];return !!f&&vivantesPretes.has(f)};
/* au toucher : une fois sur trois environ une vraie réaction (surpris, clin d'œil, coup de casquette), et trois touchers rapides le font rire.
   Seulement de bonne humeur : déçu, fatigué ou sévère, il garde ses répliques. */
const REACTIONS={surpris:['Hé ! Ça chatouille !','Oh ! Tu m’as surpris.','Ho ho, doucement, voyageur !'],
  pouce:['Tout roule.','Toi, tu es sur la bonne voie.','Bien joué, voyageur.'],
  rire:['Ha ha ! Arrête, je suis en service !','Ho ho ho ! Ça suffit, ça suffit !','Ha ha ! Tu vas me faire perdre ma casquette.'],
  casquette:['Mes hommages, voyageur.','Bonsoir, et bienvenue à bord.']};
const REPLI={surpris:'salut',pouce:'salut',rire:'salut',casquette:'salut'};   // le geste montré tant que la pose peinte manque
let touchers=[],reactionAvant='';
function reactionToucher(){const now=Date.now();touchers=touchers.filter(t=>now-t<2200);touchers.push(now);
  if(humeur()!=='normal'||jeuHumeur||asleep||absent())return null;
  if(touchers.length>=3){touchers=[];return 'rire'}
  if(Math.random()>.35)return null;
  const L=[...(surpriseOk()?['surpris']:[]),'pouce',...(moment==='soir'?['casquette']:[])].filter(k=>k!==reactionAvant);return L[Math.floor(Math.random()*L.length)]}
function reagir(k){reactionAvant=k;const L=REACTIONS[k],t=L[Math.floor(Math.random()*L.length)];
  const p=vivante(k)?k:moment!=='soir'&&k==='rire'?'casquette':REPLI[k];say(t,p,2200);noter('reaction',{k})}
/* la marionnette : elle remplace l'image de repos dès que tous ses morceaux sont chargés (au repos, elle lui est identique).
   Un jeu de morceaux par moment (outils/marionnette.py), humeur joyeuse seulement, et jamais en « mouvements réduits ».
   Pivots (cou, haut du bout d'écharpe, anse de la lanterne) en % du cadre 840 × 1020 des poses, imprimés par l'outil. */
const PANTIN={soir:{tete:'48.05% 47.59%',ech:'61.87% 51.31%',lant:'24.85% 61.72%'},

let pantinMoment=null,pantinPret=false;

function chargerPantin(){if(pantinMoment===moment)return;const m=pantinMoment=moment,P=PANTIN[m],soir=m==='soir';pantinPret=false;
  ctrl.classList.toggle('sans-lant',!soir);ctrl.style.setProperty('--pv-tete',P.tete);ctrl.style.setProperty('--pv-ech',P.ech);if(P.lant)ctrl.style.setProperty('--pv-lant',P.lant);

  Promise.all(L.map(i=>new Promise(r=>{i.addEventListener('load',r,{once:true});i.addEventListener('error',r,{once:true});i.src=`assets/corrections-poses-2026-10-10/marionnette/${m}-${i.dataset.m}.webp`})))
    .then(()=>{if(pantinMoment!==m)return;pantinPret=L.every(i=>i.naturalWidth>0);if(pantinPret&&pose==='repos'&&!asleep&&pantinOk())ctrl.classList.add('pantin-on')})}
let boucheT=null;
function parler(ms){clearInterval(boucheT);const fin=performance.now()+ms;   // la bouche s'ouvre et se ferme le temps de la phrase
  boucheT=setInterval(()=>{if(performance.now()>fin){delete ctrl.dataset.bouche;clearInterval(boucheT);return}
    const r=Math.random();ctrl.dataset.bouche=r<.3?'':r<.68?'a':'o'},115)}

function setPose(p,hold,force){
  clearTimeout(poseT);if(p!==pose||force){
    ctrl.classList.toggle('sans-lanterne',!!jeuHumeur||!!CHEF[p]);   // les remises gardent aussi l'humeur et l'absence de lanterne
    const src=poseSrc(p),j=++jeton,nb=back,nf=nb===$('p1')?$('p2'):$('p1');nb.src=src;
    // une demande plus récente l'emporte (le toucher qui réveille enchaîne deux poses) : jamais deux Contrôleurs, jamais aucun
    if(p==='repos'&&pantinOk())chargerPantin();

      nf.classList.remove('in');nf.classList.add('off');nb.classList.remove('off');nb.classList.add('in');setMask(src);front=nb;back=nf;

    Promise.race([nb.decode?nb.decode():0,new Promise(r=>setTimeout(r,400))]).then(swap,swap);   // decode() ne se résout pas toujours page masquée
    if((LANTERNE[p]||p==='carte'||p==='tampon')&&moment==='soir'){const[lx,ly]=LANTERNE[p]||LANTERNE.billet;ctrl.style.setProperty('--lx',lx+'%');ctrl.style.setProperty('--ly',ly+'%')}

    pose=p}
  if(hold)poseT=setTimeout(()=>setPose('repos'),hold);

  const h=humeur(),L=h==='normal'?ACTIVITES[moment]:jeuHumeur?(HUMEUR[humeurJeu].emo||[]).filter(k=>jeuHumeur[k]):(HUMEUR[h].activites[moment]||[]);if(L.length&&!absent())setPose(L[Math.floor(Math.random()*L.length)],3800)}vie()},11000+Math.random()*9000)})();

/* bulle ancrée à la tête */
const bubble=$('bubble');let bubT=null,parleT=null;
function placeBubble(){
  const c=ctrl.getBoundingClientRect(),a=app.getBoundingClientRect();
  let x=c.left-a.left+c.width*.628,y=c.top-a.top+c.height*.18;
  const bw=bubble.offsetWidth||180,bh=bubble.offsetHeight||44;
  x=Math.min(x,a.width-bw-12);bubble.style.left=x+'px';bubble.style.top=(y-bh-6)+'px';
}
function say(t,p,hold=2600){
  if(document.body.classList.contains('reparation')){toast(t);return}
  wake();bubble.textContent=t;placeBubble();bubble.classList.add('on');
  ctrl.classList.add('parle');clearTimeout(parleT);parleT=setTimeout(()=>ctrl.classList.remove('parle'),Math.min(hold,600+t.length*45));   // il hoche la tête le temps de sa phrase
  parler(Math.min(hold,600+t.length*45));
  if(p)setPose(p,hold);clearTimeout(bubT);bubT=setTimeout(()=>bubble.classList.remove('on'),hold+400);resetIdle();
}

let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||!!(S.set&&S.set.calme);   // le téléphone, ou le levier « Mouvements réduits »

// Un contexte sonore par écran ; les sons ponctuels ne cumulent plus des moteurs audio.
let audioGare=null;
function contexteSon(){if(!audioGare||audioGare.state==='closed')audioGare=new (window.AudioContext||window.webkitAudioContext)();
  if(audioGare.state==='suspended')audioGare.resume().catch(()=>{});return audioGare}
H?.onExit(()=>{if(audioGare)audioGare.close().catch(()=>{})});
function clic(){if(S.set&&S.set.rail===false)return;try{const ac=contexteSon(),b=ac.createBuffer(1,ac.sampleRate*.06,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6);const s=ac.createBufferSource(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=1800;s.buffer=b;s.connect(f).connect(sortie(ac));s.start()}catch(e){}}
function sifflet(){if(S.set&&S.set.rail===false)return;try{const ac=contexteSon(),o=ac.createOscillator(),v=ac.createOscillator(),vg=ac.createGain(),g=ac.createGain(),t=ac.currentTime;
  o.type='sine';o.frequency.value=2750;v.frequency.value=34;vg.gain.value=70;v.connect(vg).connect(o.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.04);g.gain.setValueAtTime(.08,t+.5);g.gain.exponentialRampToValueAtTime(.001,t+.75);
  o.connect(g).connect(sortie(ac));o.start(t);v.start(t);o.stop(t+.8);v.stop(t+.8)}catch(e){}}

  S.personalLines[id]=L;S.onboarded=1;sauver();chargerLignes();sel=Math.max(0,lines.findIndex(x=>x.id===id));paintBoard();
  toast(`« ${L.name} » est maintenant ta ligne : tes trajets sont gardés.`);return L}

  if(H&&H.imageReady)H.imageReady(`assets/trajet/web/fond-${moment}.webp`).catch(()=>{});

/* =====================================================================
   LE CARNET DE VOYAGE (décisions de l'auteur du 04/10 : directions/CARNET.md)
   Bilan · Billets · Tampons · Cartes. Une page à la fois, on feuillette les semaines.
   ===================================================================== */
const fmtMin=m=>m>=60?`${Math.floor(m/60)} h${m%60?' '+String(m%60).padStart(2,'0'):''}`:`${m} min`;
const JOUR_NOM=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS_NOM=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function lundiDe(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
function semaine(w){const a=lundiDe(Date.now());a.setDate(a.getDate()+7*w);const b=new Date(a);b.setDate(b.getDate()+7);return [a.getTime(),b.getTime(),a]}
const dateCourte=d=>`${d.getDate()===1?'1er':d.getDate()} ${MOIS_NOM[d.getMonth()]}`;

/* les trajets d'avant le carnet : on les reconstitue une fois à partir des gares et des freins enregistrés */
function migrerBillets(){
  if(S.trajetsV)return;S.trajets=S.trajets||[];
  const premier=S.trajets.length?Math.min(...S.trajets.map(t=>t.d)):Infinity,neufs=[];
  const hasard=()=>({x:+(.30+Math.random()*.62).toFixed(3),y:+(.50+Math.random()*.34).toFixed(3),r:Math.round(Math.random()*360)});   // (les anciens trajets : sans éviter les autres trous)
  Object.values(S.personalLines||{}).forEach(L=>{
    const ecart=Math.max(3,(L.interval||25)*1.6)*60000;let cur=null;
    (L.stations||[]).filter(g=>g.date<premier).sort((a,b)=>a.date-b.date).forEach(g=>{
      if(!cur||g.date-cur.f>ecart){cur={d:g.date-(g.minutes||L.interval||25)*60000,f:g.date,l:L.id,n:L.name,o:L.goal||'',p:L.frein==='plombe'?1:0,g:0,m:0,fr:0,...hasard()};neufs.push(cur)}
      cur.f=g.date;cur.g++;cur.m+=g.minutes||0})});
  (S.incidents||[]).filter(i=>i.lineId&&i.d<premier&&S.personalLines&&S.personalLines[i.lineId]).forEach(i=>{const L=S.personalLines[i.lineId];
    const t=neufs.find(t=>t.l===i.lineId&&!t.fr&&i.d>=t.f&&i.d-t.f<(L.interval||25)*1.6*60000);
    if(t){t.fr=1;t.f=i.d}else neufs.push({d:i.d-(i.minutes||0)*60000,f:i.d,l:L.id,n:L.name,o:L.goal||'',p:L.frein==='plombe'?1:0,g:0,m:0,fr:1,...hasard()})});
  S.trajets=neufs.concat(S.trajets).sort((a,b)=>a.d-b.d);S.trajetsV=1;sauver()}
migrerBillets();
